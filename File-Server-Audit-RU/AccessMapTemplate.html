const IDENTITY_TYPE_ORDER = ['User', 'Group', 'Computer', 'Well-known / Local', 'Unresolved'];

function computeIdentityBreakdown() {
  const byType = {};
  DATA.identities.forEach(idn => { byType[idn.type] = (byType[idn.type] || 0) + 1; });
  return byType;
}

function computeUserHealth() {
  let total = 0, enabled = 0, disabled = 0, locked = 0, dormant = 0;
  DATA.identities.forEach(idn => {
    if (idn.type !== 'User') return;
    total++;
    if (idn.enabled === false) disabled++;
    else if (idn.enabled === true) enabled++;
    if (idn.locked === true) locked++;
    if (idn.flagDormant) dormant++;
  });
  return { total, enabled, disabled, locked, dormant };
}

// These three feed the dashboard, which has to render correctly with ZERO
// share chunks loaded (that's the whole point -- opening the report and
// seeing the summary shouldn't cost a multi-gigabyte parse). Each one used
// to get its answer by scanning every edge; now that edges only exist for
// shares someone has actually drilled into, that same scan would silently
// under-report on an untouched dataset. Build-AccessMapHtml.ps1 already
// visits every edge once while it builds them, so these are precomputed
// there instead and just read back here.

// RU_RIGHTS_CHART_VALIDATION_V1: missing counters are UNKNOWN, not zero.
// Validate against the total number of access edges published in the manifest.
const RIGHTS_LABELS_SUMMARY_RU = [
  'Полный доступ', 'Изменение', 'Чтение и выполнение', 'Чтение', 'Запись', 'Особые права'
];
let recoveredRightsDistribution = null;
let pendingRightsRecount = null;

function computeRightsDistribution() {
  if (recoveredRightsDistribution) return recoveredRightsDistribution.slice();
  const raw = ACCESS_MAP_MANIFEST.rightsDistribution;
  let source = null;
  if (Array.isArray(raw)) {
    source = raw;
  } else if (raw && typeof raw === 'object' &&
      Array.from({length: RIGHTS_LABELS.length}, (_, i) => i)
        .every(i => Object.prototype.hasOwnProperty.call(raw, String(i)))) {
    // Accept a numeric-key object, sometimes emitted by an older serializer.
    source = Array.from({length: RIGHTS_LABELS.length}, (_, i) => raw[i]);
  }
  if (!source || source.length !== RIGHTS_LABELS.length) return null;
  const counts = source.map(x => Number(x));
  if (!counts.every(x => Number.isSafeInteger(x) && x >= 0)) return null;
  const total = Number(ACCESS_MAP_MANIFEST.totalEdgeCount);
  if (Number.isSafeInteger(total) && total >= 0 &&
      counts.reduce((a, b) => a + b, 0) !== total) return null;
  return counts;
}

async function recountRightsFromShareChunks() {
  if (pendingRightsRecount) return pendingRightsRecount;
  pendingRightsRecount = (async () => {
    // A fallback for old reports with missing/malformed manifest counters.
    // Do not load every share just to display a dashboard unless needed.
    const shareKeys = (ACCESS_MAP_MANIFEST.shares || []).map(s => s.key);
    await ensureSharesLoaded(shareKeys);
    const counts = Array(RIGHTS_LABELS.length).fill(0);
    for (const edge of DATA.edges) {
      const rightsCode = Number(edge[2]);
      if (!Number.isInteger(rightsCode) || rightsCode < 0 || rightsCode >= counts.length)
        throw new Error('Недопустимый код прав доступа: ' + edge[2]);
      counts[rightsCode]++;
    }
    const total = Number(ACCESS_MAP_MANIFEST.totalEdgeCount);
    const observed = counts.reduce((a, b) => a + b, 0);
    if (Number.isSafeInteger(total) && total >= 0 && observed !== total)
      throw new Error('Количество записей не совпадает: ' + observed + ' вместо ' + total +
        '. Проверьте целостность AccessMap_data.');
    recoveredRightsDistribution = counts;
    return counts;
  })();
  try {
    return await pendingRightsRecount;
  } finally {
    pendingRightsRecount = null;
  }
}

function computeBroadPrincipalGrants() {
  const b = ACCESS_MAP_MANIFEST.broadPrincipalGrants || {};
  return {
    folderCount: Number.isFinite(Number(b.folderCount)) ? Number(b.folderCount) : 0,
    folderIdxs: Array.isArray(b.folderIdxs) ? b.folderIdxs : []
  };
}

function computeStaleAccessCounts() {
  let dormantWithAccess = 0, unresolvedWithAccess = 0;
  DATA.identities.forEach(idn => {
    if (!(idn.edgeCount > 0)) return; // precomputed total across ALL shares, not just loaded ones
    if (idn.flagDisabled || idn.flagDormant || idn.flagLocked) dormantWithAccess++;
    if (idn.type === 'Unresolved') unresolvedWithAccess++;
  });
  return { dormantWithAccess, unresolvedWithAccess };
}

function renderDonutChart(segments, size) {
  size = size || 200;
  const R = size / 2 - 28, strokeW = 24, cx = size / 2, cy = size / 2;
  const realTotal = segments.reduce((s, x) => s + x.count, 0);
  const total = realTotal || 1; // safe denominator only -- never used for display
  const C = 2 * Math.PI * R;
  let offset = 0;
  const svg = svgEl('svg', { viewBox: `0 0 ${size} ${size}`, width: size, height: size });
  svg.appendChild(svgEl('circle', { cx, cy, r: R, fill: 'none', stroke: effectiveThemeIsLight() ? '#d8dce2' : '#20262f', 'stroke-width': strokeW }));
  segments.forEach(seg => {
    if (seg.count <= 0) return;
    const frac = seg.count / total;
    const dash = Math.max(frac * C - (segments.length > 1 ? 1.5 : 0), 0);
    const circle = svgEl('circle', {
      cx, cy, r: R, fill: 'none', stroke: seg.color, 'stroke-width': strokeW,
      'stroke-dasharray': `${dash} ${C - dash}`, 'stroke-dashoffset': -offset,
      transform: `rotate(-90 ${cx} ${cy})`
    });
    const title = document.createElementNS('http://www.w3.org/2000/svg', 'title');
    title.textContent = `${seg.label}: ${seg.count} (${(frac * 100).toFixed(1)}%)`;
    circle.appendChild(title);
    svg.appendChild(circle);
    offset += frac * C;
  });
  const centerText = svgEl('text', { x: cx, y: cy, 'text-anchor': 'middle', 'dominant-baseline': 'middle', 'font-size': 15, fill: effectiveThemeIsLight() ? '#1a1f26' : '#e6e9ee' });
  centerText.textContent = String(realTotal);
  svg.appendChild(centerText);
  return svg;
}

function renderChartWithLegend(segments) {
  const row = document.createElement('div');
  row.className = 'chartRow';
  row.appendChild(renderDonutChart(segments));
  const legend = document.createElement('div');
  legend.className = 'chartLegend';
  const total = segments.reduce((s, x) => s + x.count, 0) || 1;
  segments.forEach(seg => {
    const r = document.createElement('div');
    r.className = 'legendRow';
    const sw = document.createElement('span');
    sw.className = 'legendSwatch';
    sw.style.background = seg.color;
    r.appendChild(sw);
    const label = document.createElement('span');
    label.textContent = `${seg.label}: ${seg.count} (${((seg.count / total) * 100).toFixed(1)}%)`;
    r.appendChild(label);
    legend.appendChild(r);
  });
  row.appendChild(legend);
  return row;
}

function statCard(num, label, opts) {
  opts = opts || {};
  const card = document.createElement('div');
  card.className = 'statCard' + (opts.tone ? ' ' + opts.tone : '') + (opts.onClick ? ' clickable' : '');
  const bignum = document.createElement('div');
  bignum.className = 'bigNum';
  bignum.textContent = String(num);
  card.appendChild(bignum);
  const lbl = document.createElement('div');
  lbl.className = 'cardLabel';
  lbl.textContent = label;
  card.appendChild(lbl);
  if (opts.onClick) card.onclick = opts.onClick;
  return card;
}

function computeObservations() {
  const broad = computeBroadPrincipalGrants();
  const stale = computeStaleAccessCounts();
  const brokenCount = DATA.folders.filter(f => f.broken).length;
  const rights = computeRightsDistribution();
  const totalEdges = rights ? rights.reduce((a, b) => a + b, 0) : 0;
  const fullControlShare = totalEdges > 0 ? rights[0] / totalEdges : 0;
  const scanErrorCount = (DATA.scanErrors || []).length;

  const observations = [];

  // Reused guidance blocks: several observations here are really the same
  // underlying "least privilege" / "stale accounts" issues, so the same
  // sourced control language applies to more than one of them.
  const LEAST_PRIVILEGE_GUIDANCE = [
    { region: "AU", source: "ACSC Essential Eight — ограничение административных привилегий (уровень зрелости 1)", text: "Запросы на привилегированный доступ к системам и приложениям проверяются при поступлении; права предоставляются по принципу минимально необходимых привилегий." },
    { region: "AU", source: "ISM правительства Австралии — принцип кибербезопасности PRO-12 (минимальные привилегии)", text: "Предоставляйте пользователям только те права, которые необходимы им для выполнения рабочих обязанностей." },
    { region: "NZ", source: "NZISM, контроль 16.4.38.C.01", text: "При разработке и применении политики управления привилегированным доступом организации обязаны соблюдать принцип минимальных привилегий." },
    { region: "US", source: "NIST SP 800-53 AC-6 (минимальные привилегии)", text: "Применяйте принцип минимальных привилегий: разрешайте пользователям только действия, необходимые для выполнения назначенных задач." },
    { region: "US", source: "NIST CSF 2.0 — PR.AA-05", text: "Управляйте разрешениями и полномочиями с учётом минимальных привилегий и разделения обязанностей." },
    { region: "Intl", source: "CIS Controls v8 — мера 3.3 (настройка списков контроля доступа)", text: "Настраивайте ACL по принципу служебной необходимости. Применяйте такие списки к локальным и сетевым файловым системам." }
  ];
  const STALE_ACCOUNT_GUIDANCE = [
    { region: "US", source: "NIST SP 800-53 AC-2(3) (отключение учётных записей)", text: "Отключайте учётные записи по истечении срока действия, при прекращении связи с пользователем, нарушении политики или после заданного периода неактивности." },
    { region: "Intl", source: "CIS Controls v8 — мера 5.3 (отключение неактивных учётных записей)", text: "Удаляйте либо отключайте учётные записи, не использовавшиеся в течение установленного периода." },
    { region: "AU", source: "ACSC Essential Eight — ограничение административных привилегий (уровень зрелости 2)", text: "Привилегированный доступ к системам и приложениям автоматически отключается через 12 месяцев, если необходимость в нём не подтверждена повторно." },
    { region: "NZ", source: "NZISM, контроль 9.2.17.C.02", text: "Повышенные права, предоставленные в виде исключения, должны быть временными и иметь установленную дату окончания." }
  ];
  const RETENTION_GUIDANCE = [
    { region: "NZ", source: "Закон Новой Зеландии Privacy Act 2020 — принцип 9 (ограничение сроков хранения)", text: "Организация не должна хранить персональные данные дольше, чем это необходимо для законных целей их использования." },
    { region: "AU", source: "Закон Австралии Privacy Act 1988 — Australian Privacy Principle 11.2", text: "Когда персональные данные больше не требуются для законных целей, организация должна принять разумные меры по их удалению или обезличиванию." },
    { region: "EU", source: "GDPR, статья 5(1)(e) — ограничение срока хранения", text: "Персональные данные должны храниться в форме, позволяющей идентифицировать субъектов, не дольше необходимого для целей обработки." },
    { region: "US", source: "NIST SP 800-53 SI-12 (управление и хранение информации)", text: "Управляйте системной информацией и сроками её хранения в соответствии с применимыми законами, правилами и установленными политиками." },
    { region: "Intl", source: "CIS Controls v8 — мера 3.4 (соблюдение сроков хранения данных)", text: "Храните данные по документированному порядку организации с учётом минимальных и максимальных сроков хранения." }
  ];

  if (broad.folderCount > 0) {
    observations.push({
      title: `${broad.folderCount} папок предоставляют «Полный доступ» или «Изменение» широкой группе (Everyone, Authenticated Users, Domain Users или Users)`,
      why: "Широкие группы с высокими привилегиями затрудняют понимание того, кто может читать, изменять или удалять данные. При компрометации одной учётной записи или заражении программой-вымогателем такие права увеличивают масштаб возможного ущерба. Хотя приведённые стандарты не всегда упоминают группу Everyone напрямую, её высокие полномочия противоречат принципам минимальных привилегий и доступа по необходимости.",
      guidance: LEAST_PRIVILEGE_GUIDANCE,
      action: () => filterToBroadGrantFolders()
    });
  }
  if (brokenCount > 0) {
    observations.push({
      title: `${brokenCount} папок с отключённым наследованием NTFS-разрешений (ACL не наследуется от родительской папки)`,
      why: "Индивидуальные изменения разрешений в отдельных папках сложнее поддерживать и проверять; они могут со временем отклониться от принятой модели доступа. Сами по себе отключённое наследование и явные ACL не нарушают конкретного требования NTFS: это признак, который следует проверить, а не автоматически исправлять.",
      guidance: [
        { region: "Intl", source: "CIS Controls v8 — мера 3.3 (настройка ACL)", text: "Принцип настройки ACL по служебной необходимости применим и здесь: правила, незаметно отличающиеся от разрешений родителя, сложнее последовательно сопровождать и проверять." }
      ],
      action: () => filterToBrokenFolders()

  if (stale.dormantWithAccess > 0) {
    observations.push({
      title: `${stale.dormantWithAccess} отключённых, заблокированных или неактивных (более 90 дней) субъектов всё ещё имеют записи доступа`,
      why: "Неактивные учётные записи с сохранившимися правами доступа могут стать целью злоумышленников, например при повторном включении аккаунта или компрометации его учётных данных. Статус «неактивна» здесь основан на приблизительном времени входа, а не доказывает отсутствие использования учётной записи.",
      guidance: STALE_ACCOUNT_GUIDANCE,
      action: () => filterToDormantIdentities()
    });
  }
  if (stale.unresolvedWithAccess > 0) {
    observations.push({
      title: `${stale.unresolvedWithAccess} SID не удалось разрешить (возможно, учётные записи удалены), однако записи ACL сохранились`,
      why: "Неразрешённый SID в ACL может означать, что соответствующая учётная запись удалена или недоступна текущему контексту AD. Проверьте происхождение SID и разрешение имени до удаления записи: отсутствие разрешения не доказывает, что учётная запись уже не существует.",
      guidance: [
        { region: "US", source: "NIST SP 800-53 AC-2(3) (отключение учётных записей)", text: "Отключайте учётные записи, которые больше не связаны с действующими пользователями или субъектами." },
        { region: "Intl", source: "CIS Controls v8 — мера 5.3 (отключение неактивных учётных записей)", text: "Удаляйте или отключайте неактивные учётные записи по установленной политике." }
      ]
    });
  }
  if (scanErrorCount > 0) {
    observations.push({
      title: `${scanErrorCount} объектов не удалось проверить из-за отказа в доступе или ограничений пути/платформы`,
      why: "Если папку нельзя прочитать при аудите, сведения о её разрешениях в отчёте неполны. Проверьте, должен ли аккаунт аудита иметь доступ к этой папке, а также возможные ограничения пути и платформы. Это проблема полноты инвентаризации, а не автоматическое доказательство ошибки ACL.",
      guidance: [
        { region: "Intl", source: "CIS Controls v8 — мера 1.1 (подробная инвентаризация ресурсов)", text: "Невозможно надёжно защитить и проверить ресурсы, сведения о которых отсутствуют или доступ к которым для инвентаризации ограничен." },

      ],
      action: () => showScanErrorsDetail()
    });
  }
  if (fullControlShare > 0.25 && totalEdges >= 20) {
    observations.push({
      title: `${(fullControlShare * 100).toFixed(0)}% записей доступа предоставляют «Полный доступ»`,
      why: "«Полный доступ» позволяет не только читать и записывать данные, но и менять разрешения и владельца. Обычно такие права необходимы ограниченному кругу администраторов и владельцев данных. Высокая доля таких записей — повод проверить принцип минимальных привилегий.",
      guidance: LEAST_PRIVILEGE_GUIDANCE
    });
  }
  if (DATA.hasFileMetadata) {
    // 5 years is this observation's own fixed threshold for "worth flagging
    // at all" (distinct from the sidebar's own 1yr/5yr/10yr cycle, which the
    // viewer controls directly) -- a reasonable, common checkpoint for
    // unstructured-data review across the frameworks cited below, without
    // being so short it flags routine, actively-used folders.
    const agedThresholdDays = 5 * 365;
    const agedCount = DATA.folders.filter(f => {
      const age = ageInDays(f.modified);
      return age !== null && age >= agedThresholdDays;
    }).length;
    if (agedCount > 0) {
      observations.push({
        title: `${agedCount} папок не изменялись пять лет или дольше`,
        why: "Давно не изменявшиеся каталоги могут содержать данные, которые стоит проверить на необходимость хранения, архивирования или удаления. При этом финансовые, исторические и другие документы могут законно храниться длительное время. Эта отметка означает «проверить сроки хранения», а не «удалить».",
        guidance: RETENTION_GUIDANCE,
        action: () => {
          state.filterAgedYears = 5;
          const btn = document.getElementById('btnAged');
          btn.textContent = 'Папки без изменений более 5 лет';
          btn.classList.add('state-show');
          setTab('folders');
        }
      });
    }
  }

  return observations;
}


function filterToBroadGrantFolders() {
  setTab('folders');
  document.getElementById('searchBox').value = '';
  state.search = '';
  const panel = document.getElementById('listPanel');
  panel.innerHTML = '';
  const broad = computeBroadPrincipalGrants();
  const folderIdxs = broad.folderIdxs;
  folderIdxs.forEach(idx => {
    const f = DATA.folders[idx];
    const div = document.createElement('div');
    div.className = 'listItem';
    div.innerHTML = `<div class="listItemPathRow"><span class="path">${esc(f.path)}</span></div>`;
    div.title = f.path;
    div.onclick = () => selectFolder(idx, true);
    panel.appendChild(div);
  });
  if (folderIdxs.length === 0) {
    const none = document.createElement('div');
    none.className = 'listMore';
    none.textContent = 'Ничего не найдено.';
    panel.appendChild(none);
  }
}

function showScanErrorsDetail() {
  const content = document.getElementById('content');
  content.classList.remove('content-split');
  content.innerHTML = '';
  clearUrlHash();
  const card = document.createElement('div');
  card.className = 'summarySection';
  const title = document.createElement('h2');
  title.textContent = `Не удалось проверить объектов: ${(DATA.scanErrors || []).length}`;
  card.appendChild(title);

  const errors = DATA.scanErrors || [];
  const table = document.createElement('table');
  table.className = 'scanErrorsTable';
  table.innerHTML = '<thead><tr><th>Путь</th><th>Категория</th><th>Сообщение</th></tr></thead>';
  const tbody = document.createElement('tbody');
  errors.forEach(err => {
    const tr = document.createElement('tr');
    const tdPath = document.createElement('td');
    tdPath.textContent = err.Path || '(строка журнала не распознана)';
    tdPath.title = err.Path || '';
    const tdCat = document.createElement('td');
    tdCat.textContent = err.Category || '';
    const tdMsg = document.createElement('td');
    tdMsg.textContent = err.Message || '';
    tr.appendChild(tdPath); tr.appendChild(tdCat); tr.appendChild(tdMsg);
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  card.appendChild(table);

  const exportBtn = document.createElement('button');
  exportBtn.textContent = `Экспорт ${errors.length} строк в CSV`;
  exportBtn.style.marginTop = '10px';
  exportBtn.onclick = () => downloadCsv('scan_errors.csv', errors, [
    { label: 'Path', get: r => r.Path },
    { label: 'Category', get: r => r.Category },
    { label: 'Message', get: r => r.Message },
    { label: 'Timestamp', get: r => r.Timestamp }
  ]);
  card.appendChild(exportBtn);

  const backLink = document.createElement('button');
  backLink.textContent = '← Вернуться к сводке';
  backLink.style.marginTop = '10px';
  backLink.style.marginLeft = '8px';
  backLink.onclick = () => renderSummaryView();
  card.appendChild(backLink);

  content.appendChild(card);
}

// raises a runtime error during summary rendering. No ACL/AD data is changed.
function renderSummaryView() {
  try {
    renderSummaryViewContent();
    window.__fsaSummaryLastError = null;
  } catch (error) {
    window.__fsaSummaryLastError = String(error && (error.stack || error.message) || error);
    console.error('File-Server-Audit: summary rendering failed', error);
    const container = document.getElementById('content');
    container.classList.remove('content-split');
    container.innerHTML = '';
    const box = document.createElement('section');
    box.className = 'summarySection';

    diagnostic.style.whiteSpace = 'pre-wrap';
    diagnostic.style.overflowWrap = 'anywhere';

/* --------------------------- Resizable split panes ---------------------------- */

function initSplitter() {
  const splitter = document.getElementById('splitter');
  const sidebar = document.getElementById('sidebar');
  const main = document.getElementById('main');
  const MIN_SIDEBAR = 220, MIN_CONTENT = 320;

  let saved = null;
  try { saved = localStorage.getItem('accessMapSidebarWidth'); } catch (e) { /* ignore -- fall back to CSS default */ }
  if (saved) {
    const w = parseInt(saved, 10);
    if (!isNaN(w) && w >= MIN_SIDEBAR) sidebar.style.width = w + 'px';
  }

  let dragging = false;
  splitter.addEventListener('pointerdown', (e) => {
    dragging = true;
    splitter.classList.add('dragging');
    try { splitter.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  });
  splitter.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const rect = main.getBoundingClientRect();
    let w = e.clientX - rect.left;
    const maxW = Math.max(MIN_SIDEBAR, rect.width - MIN_CONTENT - 6);
    w = Math.max(MIN_SIDEBAR, Math.min(maxW, w));
    sidebar.style.width = w + 'px';
  });
  function stopDrag() {
    if (!dragging) return;
    dragging = false;
    splitter.classList.remove('dragging');
    try { localStorage.setItem('accessMapSidebarWidth', String(sidebar.getBoundingClientRect().width)); } catch (e) { /* ignore -- resize just won't persist across reloads */ }
  }
  splitter.addEventListener('pointerup', stopDrag);
  splitter.addEventListener('pointercancel', stopDrag);
  splitter.addEventListener('lostpointercapture', stopDrag);
}

function makeResizableSplitPanes(topContent, bottomContent, storageKey, defaultTopRatio) {
  // Stacks topContent/bottomContent with a draggable horizontal splitter
  // between them, dividing whatever height the caller's own container ends
  // up with (via flex -- see the .splitPanes/.splitPaneTop/.splitPaneBottom
  // CSS) rather than a fixed pixel split, so it still works however tall
  // the viewport happens to be. The ratio persists per storageKey (folder
  // Tree/Graph vs. permissions gets its own key, separate from identity's,
  // so a preference set on one doesn't unexpectedly move the other).
  const wrap = document.createElement('div');
  wrap.className = 'splitPanes';

  const topPane = document.createElement('div');
  topPane.className = 'splitPaneTop';
  topPane.appendChild(topContent);

  const splitter = document.createElement('div');
  splitter.className = 'paneSplitter';
  splitter.title = 'Перетащите для изменения высоты';

  const bottomPane = document.createElement('div');
  bottomPane.className = 'splitPaneBottom';
  bottomPane.appendChild(bottomContent);

  wrap.appendChild(topPane);
  wrap.appendChild(splitter);
  wrap.appendChild(bottomPane);

  let ratio = defaultTopRatio;
  try {
    const saved = localStorage.getItem(storageKey);
    if (saved) { const n = parseFloat(saved); if (!isNaN(n) && n > 0.1 && n < 0.9) ratio = n; }
  } catch (e) { /* ignore -- falls back to defaultTopRatio */ }
  const applyRatio = (r) => {
    topPane.style.flex = `${r} 1 0`;
    bottomPane.style.flex = `${1 - r} 1 0`;
  };
  applyRatio(ratio);

  let dragging = false;
  splitter.addEventListener('pointerdown', (e) => {
    dragging = true;
    splitter.classList.add('dragging');
    try { splitter.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  });
  splitter.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const rect = wrap.getBoundingClientRect();
    if (rect.height <= 0) return;
    let r = (e.clientY - rect.top) / rect.height;
    r = Math.max(0.15, Math.min(0.85, r));
    ratio = r;
    applyRatio(r);
  });
  function stopDrag() {
    if (!dragging) return;
    dragging = false;
    splitter.classList.remove('dragging');
    try { localStorage.setItem(storageKey, String(ratio)); } catch (e) { /* ignore -- resize just won't persist across reloads */ }
  }
  splitter.addEventListener('pointerup', stopDrag);
  splitter.addEventListener('pointercancel', stopDrag);
  splitter.addEventListener('lostpointercapture', stopDrag);

  return wrap;
}

/* -------------------------------- Theme toggle -------------------------------- */

function effectiveThemeIsLight() {
  const explicit = document.documentElement.getAttribute('data-theme');
  if (explicit === 'light') return true;
  if (explicit === 'dark') return false;
  return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
}

function updateThemeBtnLabel() {
  const btn = document.getElementById('themeToggleBtn');
  if (!btn) return;
  // Label names the mode a click will switch TO, matching how the sidebar's
  // own A-Z/Z-A button already communicates "what happens if you click this".
  btn.textContent = effectiveThemeIsLight() ? '🌙 Тёмная тема' : '☀️ Светлая тема';
}

function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem('accessMapTheme'); } catch (e) { /* ignore -- falls back to the OS preference */ }
  if (saved === 'light' || saved === 'dark') document.documentElement.setAttribute('data-theme', saved);
  updateThemeBtnLabel();
  document.getElementById('themeToggleBtn').onclick = () => {
    const next = effectiveThemeIsLight() ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('accessMapTheme', next); } catch (e) { /* ignore -- choice just won't persist across reloads */ }
    updateThemeBtnLabel();
  };
}

/* ------------------------------ Deep-link (URL hash) --------------------------- */
/* A link like AccessMap.html#f:12:graph or #i:5 refers to a specific folder/
   identity (by index) and detail tab within THIS generated report -- it's only
   ever meaningful alongside this exact AccessMap.html/AccessMap_data pairing
   (indices aren't stable across a different run's rebuild), not a general,
   portable reference to a filesystem path. history.replaceState (not
   pushState/location.hash=) keeps the address bar in sync without adding
   browser-level back/forward entries -- this app already has its own Back
   button and in-app history (see pushHistory/goBack), and stacking browser-
   native history on top of that would just be two competing mechanisms. */

function clearUrlHash() {
  // Same replaceState-preferred, location.hash-fallback approach as
  // updateUrlHash -- see there for why both are attempted.
  try { history.replaceState(null, '', location.pathname + location.search); }
  catch (e) {
    try { location.hash = ''; } catch (e2) { /* ignore */ }
  }
}

function updateUrlHash() {
  if (!state.selected) return;
  const tabPart = state.detailTab === 'graph' ? ':graph' : '';
  const hash = '#' + (state.selected.kind === 'folder' ? 'f:' : 'i:') + state.selected.idx + tabPart;
  // history.replaceState is preferred (doesn't add a browser-native history
  // entry, avoiding a second history mechanism competing with this app's own
  // Back button); some environments reject a hash-only replaceState against
  // a file:// URL, though, so fall back to a plain location.hash assignment
  // (which does add a browser history entry) rather than silently giving up
  // and leaving the address bar out of sync with what's on screen.
  try { history.replaceState(null, '', hash); }
  catch (e) {
    try { location.hash = hash; } catch (e2) { /* ignore -- copying the current URL just won't carry the view */ }
  }
}

function restoreFromHash() {
  const m = /^#(f|i):(\d+)(:graph)?$/.exec(location.hash);
  if (!m) return false;
  const kind = m[1], idx = parseInt(m[2], 10), isGraph = !!m[3];
  if (kind === 'f' && idx >= 0 && idx < DATA.folders.length) {
    if (isGraph) state.detailTab = 'graph';
    selectFolder(idx, false);
    return true;
  }
  if (kind === 'i' && idx >= 0 && idx < DATA.identities.length) {
    if (isGraph) state.detailTab = 'graph';
    selectIdentity(idx, false);
    return true;
  }
  return false;
}

function init() {
  precompute();
  renderList();
  initSplitter();
  initTheme();

  document.getElementById('tabIdentities').onclick = () => setTab('identities');
  document.getElementById('tabFolders').onclick = () => setTab('folders');
  document.getElementById('searchBox').oninput = (e) => { state.search = e.target.value; renderList(); };
  document.getElementById('sortDirBtn').onclick = () => {
    state.sortDir *= -1;
    document.getElementById('sortDirBtn').innerHTML = state.sortDir === 1 ? 'A&ndash;Z' : 'Z&ndash;A';
    renderList();
    if (state.selected) {
      if (state.selected.kind === 'folder') renderFolder(state.selected.idx);
      else renderIdentity(state.selected.idx);
    }
  };
  document.getElementById('backBtn').onclick = goBack;
  document.getElementById('summaryBtn').onclick = renderSummaryView;

  // Users/Groups/Both tri-state (mirrors the header quick-filters' own cycle:
  // off/all -> one setting -> the other -> back to all) and the independent
  // "Groups first" sort option -- both compose with the existing search and
  // Disabled/dormant filter rather than replacing or fighting them (see
  // renderList's identities branch, which applies all of them together).
  // Every label names what's CURRENTLY shown, not just "All" at rest, which
  // didn't say what clicking it would actually do.
  const identityKindLabels = ['Пользователи и группы', 'Только пользователи', 'Только группы'];
  document.getElementById('identityKindBtn').onclick = () => {
    state.filterIdentityKind = (state.filterIdentityKind + 1) % 3;
    document.getElementById('identityKindBtn').textContent = identityKindLabels[state.filterIdentityKind];
    document.getElementById('identityKindBtn').classList.toggle('state-show', state.filterIdentityKind !== 0);
    if (state.tab !== 'identities') setTab('identities'); else renderList();
  };
  document.getElementById('groupsFirstBtn').onclick = () => {
    state.sortGroupsFirst = !state.sortGroupsFirst;
    document.getElementById('groupsFirstBtn').classList.toggle('state-show', state.sortGroupsFirst);
    renderList();
  };

  // Header quick-filter buttons are 3-way toggles -- off / show-only (green,
  // "ON") / hide (red, "HIDDEN") -- rather than one-shot actions, so they can
  // be turned back off again without having to switch tabs or search to undo
  // them. Turning one on jumps to the tab it applies to; cycling within that
  // tab, or turning it off, just re-renders in place.
  document.getElementById('btnBroken').onclick = () => {
    state.filterBroken = (state.filterBroken + 1) % 3;
    setFilterButtonUI('btnBroken', state.filterBroken);
    if (state.filterBroken !== 0 && state.tab !== 'folders') setTab('folders'); else renderList();
  };
  document.getElementById('btnDormant').onclick = () => {
    state.filterDormant = (state.filterDormant + 1) % 3;
    setFilterButtonUI('btnDormant', state.filterDormant);
    if (state.filterDormant !== 0 && state.tab !== 'identities') setTab('identities'); else renderList();
  };

  // Aged-folders filter only makes sense (and is only shown at all) when
  // this scan actually captured Created/Modified/Accessed -- see
  // DATA.hasFileMetadata and the Summary page's own note when it's missing.
  const AGED_YEAR_CYCLE = [0, 1, 5, 10];
  if (DATA.hasFileMetadata) {
    document.getElementById('btnAged').style.display = '';
    document.getElementById('btnAged').onclick = () => {
      const curIdx = AGED_YEAR_CYCLE.indexOf(state.filterAgedYears);
      state.filterAgedYears = AGED_YEAR_CYCLE[(curIdx + 1) % AGED_YEAR_CYCLE.length];
      const btn = document.getElementById('btnAged');
      btn.textContent = state.filterAgedYears === 0 ? 'Давно не изменявшиеся папки' : `Без изменений ${state.filterAgedYears} лет и более`;
      btn.classList.toggle('state-show', state.filterAgedYears !== 0);
      if (state.filterAgedYears !== 0 && state.tab !== 'folders') setTab('folders'); else renderList();
    };
  }

  // Flag-files-broken toggle only makes sense (and is only shown at all)
  // when this scan actually aggregated per-folder file counts -- see
  // DATA.hasFileCounts. The badge it controls appears in both the sidebar
  // list (renderList) and the tree view (renderFolderTreeView, shared by
  // both renderFolder and renderIdentity), so toggling it needs to
  // re-render whichever of those is currently on screen, not just one.
  if (DATA.hasFileCounts) {
    document.getElementById('btnFilesBroken').style.display = '';
    document.getElementById('btnFilesBroken').onclick = () => {
      state.flagFilesBroken = !state.flagFilesBroken;
      document.getElementById('btnFilesBroken').classList.toggle('state-show', state.flagFilesBroken);
      renderList();
      if (state.selected) {
        if (state.selected.kind === 'folder') renderFolder(state.selected.idx);
        else renderIdentity(state.selected.idx);
      }
    };
  }

  if (DATA.scanComplete === false || (DATA.truncatedRowsDropped || 0) > 0) {
    const badge = document.getElementById('headerIncompleteBadge');
    badge.style.display = 'inline-block';
    badge.style.cursor = 'pointer';
    badge.onclick = renderSummaryView;
  }

  document.getElementById('footerLine').textContent =
    `Создано ${DATA.generatedAt}${fmtDuration(DATA.buildDurationSeconds) ? ' (сборка за ' + fmtDuration(DATA.buildDurationSeconds) + ')' : ''} из ${DATA.sourceFolder} (версия инструмента ${DATA.toolkitVersion || '?'}) — снимок состояния на момент аудита, не текущие данные.`;

  // A #f:<idx> / #i:<idx>[:graph] link in the address bar (see updateUrlHash)
  // takes the visitor straight back to that exact view; anything else (no
  // hash, or one that doesn't resolve) falls back to the normal Summary
  // landing page.
  if (!restoreFromHash()) renderSummaryView();
}

init();
</script>

</body>
</html>
