<!DOCTYPE html>
<!-- SPDX-License-Identifier: MIT -->
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Карта прав доступа файлового сервера</title>
<style>
  :root {
    /* Dark is the base/fallback. Light applies automatically when the OS
       prefers it AND the user hasn't explicitly chosen (see the toggle
       button below) -- an explicit choice (data-theme="light"/"dark")
       always wins over the OS preference either way. */
    --bg: #111418; --panel: #1a1f26; --panel2: #20262f; --border: #2c333d;
    --text: #e6e9ee; --muted: #9aa4b2; --accent: #4da3ff; --warn: #ffb454; --bad: #ff5d5d;
    --good: #57d38c; --selected-bg: #20304a;
    --warn-bg: #2a2410; --bad-bg: #3a1a1a; --bad-text: #ff9d9d; --good-bg: #2c4a3d;
    --pill-au-bg: #003a5c; --pill-au-text: #7dd3fc;
    --pill-nz-bg: #1a2e1a; --pill-nz-text: #86efac;
    --pill-us-bg: #2e1a3a; --pill-us-text: #d8b4fe;
    --pill-eu-bg: #2e2a1a; --pill-eu-text: #fde68a;
    --pill-intl-bg: #2c333d;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme]) {
      /* Off-white rather than a stark #fff/#f5f6f8 -- easier on the eyes
         for a page people may have open for a while. */
      --bg: #eef0f2; --panel: #f7f7f5; --panel2: #ececea; --border: #d8dce2;
      --text: #1a1f26; --muted: #5b6472; --accent: #1a73e8; --warn: #b8720a; --bad: #d53c3c;
      --good: #1e8e4f; --selected-bg: #d7e6fb;
      --warn-bg: #fdf1d9; --bad-bg: #fbe4e2; --bad-text: #a32e20; --good-bg: #dcf3e6;
      --pill-au-bg: #d9edfb; --pill-au-text: #0a4a72;
      --pill-nz-bg: #dff3e2; --pill-nz-text: #146c33;
      --pill-us-bg: #f0e3fa; --pill-us-text: #5a2a82;
      --pill-eu-bg: #faf0d4; --pill-eu-text: #7a5c00;
      --pill-intl-bg: #e4e7eb;
    }
  }
  :root[data-theme="light"] {
    --bg: #eef0f2; --panel: #f7f7f5; --panel2: #ececea; --border: #d8dce2;
    --text: #1a1f26; --muted: #5b6472; --accent: #1a73e8; --warn: #b8720a; --bad: #d53c3c;
    --good: #1e8e4f; --selected-bg: #d7e6fb;
    --warn-bg: #fdf1d9; --bad-bg: #fbe4e2; --bad-text: #a32e20; --good-bg: #dcf3e6;
    --pill-au-bg: #d9edfb; --pill-au-text: #0a4a72;
    --pill-nz-bg: #dff3e2; --pill-nz-text: #146c33;
    --pill-us-bg: #f0e3fa; --pill-us-text: #5a2a82;
    --pill-eu-bg: #faf0d4; --pill-eu-text: #7a5c00;
    --pill-intl-bg: #e4e7eb;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Segoe UI, Roboto, Arial, sans-serif; background:var(--bg); color:var(--text); }
  #app { display:flex; flex-direction:column; height:100vh; }
  header { padding:10px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:16px; background:var(--panel); flex-shrink:0; }
  .themeToggleBtn { font-size:16px; padding:6px 10px; flex-shrink:0; }
  /* Unified small "chip" look for the header's right-side utility buttons
     (quick filters + theme toggle) and the sidebar's own identity filter
     row (kind + groups-first) -- these previously looked inconsistent
     (colored borders at rest for Broken/Dormant, a bare checkbox for
     Groups First, a plain "All" for the kind filter) despite doing the
     same KIND of job: toggle or cycle a view option. They now share one
     neutral resting look, differing only in their ACTIVE state (green
     "on" / red "hidden"), matching how the show/hide colors already
     worked -- just no longer colored while simply at rest. */
  .chipBtn { background:var(--panel2); color:var(--text); border:1px solid var(--border); border-radius:14px; padding:5px 12px; font-size:12px; white-space:nowrap; }
  .chipBtn:hover { background:var(--border); }
  .chipBtn.state-show { background:var(--good); color:#062b17; border-color:var(--good); font-weight:600; }
  .chipBtn.state-hide { background:var(--bad); color:#fff; border-color:var(--bad); font-weight:600; }
  header .headerRightGroup { margin-left:auto; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .identityFilterRow { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:0 10px 10px; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  button { background:var(--panel2); color:var(--text); border:1px solid var(--border); border-radius:4px; padding:6px 10px; cursor:pointer; font-size:12px; }
  button:hover { background:var(--panel2); }
  #main { flex:1; display:flex; min-height:0; }
  #sidebar { width:320px; flex-shrink:0; border-right:1px solid var(--border); display:flex; flex-direction:column; background:var(--panel); }
  #sidebar .tabs { display:flex; border-bottom:1px solid var(--border); }
  #sidebar .tabs button { flex:1; border:none; border-radius:0; background:transparent; padding:10px; }
  #sidebar .tabs button.active { background:var(--panel2); border-bottom:2px solid var(--accent); }
  .searchRow { display:flex; gap:6px; margin:10px; align-items:stretch; }
  #searchBox { flex:1; min-width:0; padding:8px; border-radius:4px; border:1px solid var(--border); background:var(--panel2); color:var(--text); }
  #sortDirBtn { flex-shrink:0; font-size:12px; padding:6px 10px; }
  #listPanel { flex:1; overflow-y:auto; padding:0 6px 10px; }
  .listItem { padding:8px 10px; border-radius:4px; cursor:pointer; font-size:13px; margin-bottom:2px; }
  .listItem:hover { background:var(--panel2); }
  .listItem .sub { color:var(--muted); font-size:11px; }
  /* RU_SIDEBAR_GROUP_MEMBERS_V1 */
  .sidebarGroupLine { display:flex; align-items:stretch; gap:2px; min-width:0; }
  .sidebarGroupLine .listItem { flex:1; min-width:0; margin-bottom:0; padding-left:5px; }
  .sidebarGroupToggle { width:25px; flex:0 0 25px; border:0; padding:4px; border-radius:4px;
    background:transparent; color:var(--text); cursor:pointer; font-size:15px; }
  .sidebarGroupToggle:hover, .sidebarGroupToggle:focus-visible { background:var(--panel2); }
  .sidebarGroupMembers { border-left:1px solid var(--border); padding-left:8px; margin:1px 0 6px 16px; }
  .sidebarMemberLink { display:block; width:100%; padding:6px 8px; text-align:left; border:0;
    border-radius:4px; background:transparent; color:var(--text); font:inherit; font-size:12px;
    cursor:pointer; overflow-wrap:anywhere; }
  .sidebarMemberLink:hover, .sidebarMemberLink:focus-visible { background:var(--panel2); }
  .sidebarMemberNote { color:var(--muted); padding:6px 8px; font-size:11px; line-height:1.4; }
  .groupMemberDetails { margin-top:10px; padding:8px 10px; border:1px solid var(--border);
    border-radius:5px; font-size:12px; max-height:230px; overflow-y:auto; }
  .groupMemberDetails > summary { cursor:pointer; font-weight:600; }
  .groupMemberDetails .sidebarGroupMembers { margin-top:8px; }

  .listItemPathRow { display:flex; align-items:center; gap:6px; min-width:0; }
  .listItemPathRow .path { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; min-width:0; }
  .badge { display:inline-block; padding:1px 6px; border-radius:3px; font-size:10px; margin-left:6px; vertical-align:middle; }
  .badge.disabled { background:var(--bad); color:#fff; }
  .badge.dormant { background:var(--warn); color:#000; }
  .badge.locked { background:var(--bad); color:#fff; }
  .badge.broken { background:var(--warn); color:#000; }
  /* RU_IDENTITY_STATUS_EVERYWHERE_1_0_12: consistent AD-state badges across views. */
  .statusBadges { display:inline-flex; align-items:center; flex-wrap:wrap; gap:3px; vertical-align:middle; }
  .statusBadges .badge { margin:0 0 0 4px; white-space:nowrap; }
  .sidebarMemberLink .statusBadges { margin-left:5px; }
  .sidebarMemberLink.statusCritical, .aclRow.statusCritical, .listItem.statusCritical { background:var(--bad-bg); }
  .sidebarMemberLink.statusWatch, .aclRow.statusWatch, .listItem.statusWatch { background:var(--warn-bg); }
  .sidebarMemberLink.statusCritical { border-left:2px solid var(--bad); }
  .sidebarMemberLink.statusWatch { border-left:2px solid var(--warn); }
  .aclRow .statusBadges { flex-shrink:0; }

  .listMore { padding:8px 10px; color:var(--muted); font-size:11px; font-style:italic; }
  #content { flex:1; overflow-y:auto; padding:16px; min-width:0; }
  /* Folder/identity views (Tree-or-Graph + a permissions list below it) use an
     internal resizable split instead of #content's own outer scroll -- each
     pane scrolls itself, so the two share a fixed height budget the splitter
     can actually divide between them. Every other view (dashboard, quick-
     filter lists, welcome screen) keeps the plain #content scroll above. */
  #content.content-split { display:flex; flex-direction:column; overflow:hidden; }
  .splitPanes { flex:1; min-height:0; display:flex; flex-direction:column; }
  .splitPaneTop, .splitPaneBottom { min-height:60px; overflow:hidden; display:flex; flex-direction:column; }
  .paneSplitter { height:7px; flex-shrink:0; cursor:row-resize; background:var(--border); touch-action:none; margin:6px 0; border-radius:3px; }
  .paneSplitter:hover, .paneSplitter.dragging { background:var(--accent); }
  @media (max-width: 760px) {
    .splitPanes { flex:none; }
    .splitPaneTop, .splitPaneBottom { flex:none !important; min-height:0; overflow:visible; }
    .paneSplitter { display:none; }
    #content.content-split { overflow-y:auto; }
  }
  #welcome { color:var(--muted); max-width:600px; }
  #welcome ul { line-height:1.8; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:14px 16px; margin-bottom:16px; }
  .card h2 { margin:0 0 10px; font-size:15px; }
  .breadcrumb { font-size:15px; font-weight:600; line-height:1.7; word-break:break-word; margin-bottom:6px; }
  .crumbLink { color:var(--accent); cursor:pointer; }
  .crumbLink:hover { text-decoration:underline; }
  .crumbCurrent { color:var(--text); }
  .crumbPlain { color:var(--muted); font-weight:400; }
  .crumbSep { color:var(--muted); margin:0 5px; font-weight:400; }
  .card .field { display:inline-block; min-width:220px; margin:2px 18px 2px 0; font-size:13px; }
  .folderMetaRow { margin-top:6px; }
  .card .field b { color:var(--muted); font-weight:500; }
  .treeWrap { background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:8px; margin-bottom:16px; flex:1; min-height:0; display:flex; flex-direction:column; }
  .treeToolbar { display:flex; align-items:center; gap:14px; padding:2px 6px 8px; flex-wrap:wrap; border-bottom:1px solid var(--border); margin-bottom:6px; flex-shrink:0; }
  .treeToolbar .groupLabel { font-size:11px; color:var(--muted); margin-right:2px; }
  .depthBtn { padding:4px 9px; font-size:11px; }
  .depthBtn.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .treeNote { font-size:11px; color:var(--muted); padding:4px 8px; }
  .treeHost { flex:1; min-height:0; overflow-y:auto; padding:4px 6px; }
  .treeNode { }
  .treeRow { display:flex; align-items:center; gap:6px; padding:3px 6px; border-radius:4px; cursor:pointer; font-size:13px; }
  .treeRow:hover { background:var(--panel2); }
  .treeRow.selected { background:var(--selected-bg); outline:1px solid var(--accent); }
  .treeToggle { display:inline-block; width:14px; text-align:center; color:var(--muted); flex-shrink:0; }
  .treeToggle.hasChildren { cursor:pointer; }
  .treeToggle.hasChildren:hover { color:var(--text); }
  .treeLabel { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .treeCount { font-size:10px; color:var(--muted); background:var(--panel2); border-radius:8px; padding:1px 7px; flex-shrink:0; }
  .treeChildren { margin-left:20px; padding-left:10px; border-left:1px solid var(--border); }
  .treeMore { font-size:11px; color:var(--muted); font-style:italic; padding:3px 6px 3px 26px; }
  .detailTabs { display:flex; gap:4px; margin-bottom:8px; }
  .detailTabBtn { padding:6px 14px; font-size:12px; }
  .detailTabBtn.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .graphWrap { background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:8px; margin-bottom:16px; position:relative; flex:1; min-height:0; display:flex; flex-direction:column; }
  /* RU_GRAPH_VIEWPORT_DRAG_1_0_15: graph-only overlay, no out-of-bounds legend. */
  .graphCanvas { position:relative; display:flex; flex:1 1 auto; min-height:200px; overflow:hidden; border-radius:4px; }
  .graphCanvas svg.graph { flex:1 1 auto; min-height:0; height:100%; }
  .graphCanvas .graphLegendPanel { box-sizing:border-box; top:8px; bottom:48px; max-height:none; min-height:0; overflow-y:auto; overscroll-behavior:contain; }
  .graphCanvas .graphLegendPanel:focus-visible { outline:2px solid var(--accent); outline-offset:-2px; }

  .graphToolbar { display:flex; align-items:center; gap:14px; padding:2px 6px 8px; flex-wrap:wrap; flex-shrink:0; }
  .graphToolbar .groupLabel { font-size:11px; color:var(--muted); margin-right:2px; }
  .graphLegendToggle { position:absolute; right:14px; bottom:14px; width:26px; height:26px; border-radius:50%; background:var(--panel2); border:1px solid var(--border); color:var(--muted); font-size:14px; font-weight:600; font-style:italic; font-family:Georgia,serif; cursor:pointer; display:flex; align-items:center; justify-content:center; z-index:5; }
  .graphLegendToggle:hover { color:var(--text); border-color:var(--muted); }
  .graphLegendPanel { position:absolute; right:14px; bottom:48px; width:315px; max-width:calc(100% - 28px); overflow-y:auto; background:var(--panel2); border:1px solid var(--border); border-radius:6px; padding:12px 14px; font-size:11px; z-index:5; box-shadow:0 4px 16px rgba(0,0,0,0.4); }
  .graphLegendExplanation { margin:8px 0 2px; padding:8px; border:1px solid var(--border); border-radius:4px; color:var(--text); line-height:1.5; }
  .graphLegendPanel h4 { margin:0 0 6px; font-size:11px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:0.03em; }
  .graphLegendPanel h4:not(:first-child) { margin-top:10px; }
  .graphLegendRow { display:flex; align-items:center; gap:7px; padding:2px 0; }
  .graphLegendSwatch { width:13px; height:13px; border-radius:3px; flex-shrink:0; }
  .graphLegendLine { width:16px; height:0; border-top:3px solid; flex-shrink:0; }
  .graphLegendLine.dashed { border-top-style:dashed; }
  .graphLegendDot { width:9px; height:9px; border-radius:50%; background:var(--warn); border:1px solid #000; flex-shrink:0; }
  .zoomBtn { padding:4px 9px; font-size:13px; line-height:1; }
  .graphNote { font-size:11px; color:var(--muted); padding:4px 8px; }
  svg.graph { width:100%; flex:1; min-height:200px; display:block; background:var(--panel2); border-radius:4px; touch-action:none; }
  svg.graph text { fill:var(--text); font-size:11px; font-family:inherit; pointer-events:none; }
  svg.graph .nodeGroup { cursor:grab; }
  svg.graph .nodeGroup:active { cursor:grabbing; }
  svg.graph .nodeCircle { stroke:#000; stroke-width:1; }
  svg.graph .centerCircle { fill:var(--warn); }
  svg.graph .nodeLabel { font-weight:500; }
  svg.graph .nodeSubLabel { fill:var(--muted); font-size:9px; }
  /* RU_GRAPH_NODE_RIGHTS_1_0_13: rights belong to the connected node.
     No free-floating edge text can remain behind after dragging. */
  svg.graph .graphRightsTag { pointer-events:none; }
  svg.graph .graphRightsBadge { fill:var(--panel); stroke-width:1.6; }
  svg.graph .graphRightsLabel { fill:var(--text); font-size:10px; font-weight:600; }
  svg.graph:not(.rightsAlways) .graphRightsTag { opacity:0; visibility:hidden; }
  svg.graph:not(.rightsAlways) .nodeGroup:hover .graphRightsTag,
  svg.graph:not(.rightsAlways) .nodeGroup:focus .graphRightsTag,
  svg.graph:not(.rightsAlways) .nodeGroup:focus-within .graphRightsTag { opacity:1; visibility:visible; }
  svg.graph .graphRightsTag { transition:opacity 0.12s ease; }
  svg.graph .nodeGroup:focus { outline:none; }
  svg.graph .nodeGroup:focus .nodeCircle { stroke:var(--accent); stroke-width:2.5; }
  svg.graph .graphLinkTitle { pointer-events:none; }
  svg.graph .flagRing { pointer-events:none; }
  .summaryGrid { display:grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap:14px; margin-bottom:18px; }
  .statCard { background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:14px 16px; }
  .statCard .bigNum { font-size:28px; font-weight:600; line-height:1; }
  .statCard .cardLabel { font-size:12px; color:var(--muted); margin-top:6px; }
  .statCard.clickable { cursor:pointer; }
  .statCard.clickable:hover { background:var(--panel2); }
  .statCard.warn .bigNum { color:var(--warn); }
  .statCard.bad .bigNum { color:var(--bad); }
  .breakdownRow { display:flex; justify-content:space-between; font-size:13px; padding:4px 0; border-bottom:1px solid var(--border); }
  .breakdownRow:last-child { border-bottom:none; }
  .summarySection { background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:16px; margin-bottom:16px; }
  .summarySection h2 { font-size:14px; margin:0 0 12px; }
  .chartRow { display:flex; gap:24px; align-items:center; flex-wrap:wrap; }
  .chartLegend { font-size:12px; }
  .chartLegend .legendRow { display:flex; align-items:center; gap:8px; padding:3px 0; }
  .legendSwatch { width:11px; height:11px; border-radius:2px; flex-shrink:0; }
  .disclaimerBanner { background:var(--warn-bg); border:1px solid var(--warn); color:var(--warn); border-radius:6px; padding:10px 14px; font-size:12px; margin-bottom:16px; }
  .incompleteBanner { background:var(--bad-bg); border:1px solid var(--bad); color:var(--bad-text); border-radius:6px; padding:12px 16px; font-size:13px; margin-bottom:18px; font-weight:500; }
  .infoBanner { background:var(--panel2); border:1px solid var(--border); color:var(--muted); border-radius:6px; padding:12px 16px; font-size:13px; margin-bottom:18px; }
  .headerIncompleteBadge { background:var(--bad); color:#fff; font-size:11px; font-weight:600; padding:3px 9px; border-radius:10px; margin-left:6px; }
  .obsCard { border-left:3px solid var(--warn); background:var(--panel2); border-radius:0 6px 6px 0; padding:10px 14px; margin-bottom:10px; }
  .obsCard .obsTitle { font-weight:600; font-size:13px; margin-bottom:4px; }
  .obsCard .obsWhy { font-size:12px; color:var(--muted); margin-bottom:6px; }
  .obsCard .obsFrameworks { font-size:11px; color:var(--text); }
  .guidanceRow { display:flex; align-items:flex-start; gap:8px; margin-bottom:5px; }
  .regionPill { flex-shrink:0; width:34px; text-align:center; font-size:10px; font-weight:600; padding:1px 0; border-radius:3px; }
  .regionPill-AU { background:var(--pill-au-bg); color:var(--pill-au-text); }
  .regionPill-NZ { background:var(--pill-nz-bg); color:var(--pill-nz-text); }
  .regionPill-US { background:var(--pill-us-bg); color:var(--pill-us-text); }
  .regionPill-EU { background:var(--pill-eu-bg); color:var(--pill-eu-text); }
  .regionPill-Intl { background:var(--pill-intl-bg); color:var(--muted); }
  .abuseTable { width:100%; border-collapse:collapse; font-size:12px; }
  .abuseTable th, .abuseTable td { text-align:left; padding:5px 8px; border-bottom:1px solid var(--border); vertical-align:top; }
  .abuseTable th { color:var(--muted); font-weight:500; }
  .scanErrorsTable { width:100%; border-collapse:collapse; font-size:12px; margin-top:8px; }
  .scanErrorsTable th, .scanErrorsTable td { text-align:left; padding:5px 8px; border-bottom:1px solid var(--border); }
  .scanErrorsTable th { color:var(--muted); font-weight:500; }
  table.datatable { width:100%; border-collapse:collapse; font-size:12px; }
  table.datatable th { text-align:left; padding:6px 8px; border-bottom:1px solid var(--border); cursor:pointer; color:var(--muted); position:sticky; top:0; background:var(--panel); user-select:none; }
  table.datatable th:hover { color:var(--text); }
  table.datatable td { padding:5px 8px; border-bottom:1px solid var(--border); }
  table.datatable tr.rowclick { cursor:pointer; }
  table.datatable tr.rowclick:hover td { background:var(--panel2); }
  .tableToolbar { display:flex; gap:8px; margin-bottom:8px; align-items:center; flex-shrink:0; }
  .tableWrap { flex:1; min-height:0; display:flex; flex-direction:column; }
  .tableBody { flex:1; min-height:0; overflow:auto; }
  .tableToolbar input { flex:1; padding:6px; border-radius:4px; border:1px solid var(--border); background:var(--panel2); color:var(--text); }
  .pill { padding:2px 6px; border-radius:3px; font-size:10px; }
  .pill.inherited { background:var(--panel2); color:var(--muted); }
  .pill.explicit { background:var(--good-bg); color:var(--good); }
  .pill.deny { background:var(--bad); color:#fff; }
  #backBtn:disabled { opacity:0.4; cursor:default; }
  footer { padding:6px 16px; font-size:11px; color:var(--muted); border-top:1px solid var(--border); flex-shrink:0; display:flex; align-items:center; justify-content:space-between; gap:10px; }
  footer a.chipBtn { color:var(--text); text-decoration:none; font-size:11px; padding:4px 10px; }

  /* Resizable / responsive split panes */
  #splitter { width:6px; flex-shrink:0; cursor:col-resize; background:var(--border); touch-action:none; }
  #splitter:hover, #splitter.dragging { background:var(--accent); }
  @media (max-width: 760px) {
    #main { flex-direction:column; }
    #sidebar { width:100% !important; height:38vh; flex-shrink:0; border-right:none; border-bottom:1px solid var(--border); }
    #splitter { display:none; }
    #content { height:auto; }
  }

  /* Tri-state quick filter buttons: off (neutral) / show-only (green) / hide (red) -- see .chipBtn */
  .filterStateLabel { font-size:9px; text-transform:uppercase; letter-spacing:0.03em; opacity:0.85; margin-left:5px; }

  /* Folder tree: "virtual" nodes stand in for a path segment the scan itself
     never recorded as its own folder (so parent/child structure still nests
     correctly even when the scan has gaps) -- shown distinctly since there's
     no data behind them to open. */
  .treeRow.virtual .treeLabel { color:var(--muted); font-style:italic; }
  .treeRow.virtual { cursor:default; }
  .treeRow.virtual:hover { background:none; }
  .virtualNote { font-size:9px; color:var(--muted); border:1px solid var(--border); border-radius:8px; padding:0 6px; flex-shrink:0; }

  /* Nested ACL list (a folder's identities, with group members collapsible
     underneath the group instead of flattened alongside it) */
  .aclWrap { background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:10px; margin-bottom:16px; flex:1; min-height:0; display:flex; flex-direction:column; }
  .aclSummary { font-size:12px; color:var(--muted); padding:0 4px 8px; flex-shrink:0; }
  .aclToolbar { display:flex; gap:8px; margin-bottom:8px; align-items:center; flex-shrink:0; }
  .aclToolbar input { flex:1; padding:6px; border-radius:4px; border:1px solid var(--border); background:var(--panel2); color:var(--text); }
  .aclHost { flex:1; min-height:0; overflow-y:auto; }

  .aclRow:hover { background:var(--panel2); }

  .aclRow .treeToggle.hasChildren { cursor:pointer; }
  .aclRow .treeToggle.hasChildren:hover { color:var(--text); }
  .aclName { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

</style>

<script src="AccessMap_data/manifest.js"></script>
<script>
'use strict';

/* ---------------------------------------------------------------------------
   Data loading.

   Build-AccessMapHtml.ps1 copies THIS FILE byte-for-byte to AccessMap.html --
   nothing on this page is templated or rewritten at generation time. Every
   run's actual data lives next to it in a sibling AccessMap_data/ folder:

     AccessMap.html
     AccessMap_data/
       manifest.js     -- identities, folders, and every dashboard-level
                           total/observation, loaded eagerly (small
                           regardless of audit size: one entry per identity
                           and per folder, never per access grant)
       share_0.js       -- one file per top-level share (\\server\share),
       share_1.js ...       each holding just that share's access edges
                             (folder x identity ACE rows -- the part of the
                             dataset that actually gets huge)

   manifest.js is loaded up front via the <script src> above -- <script src>
   works from file:// with no CORS restrictions and no server, unlike
   fetch()/XHR, so this stays a "just open it" report. A share_N.js file is
   only fetched the moment something on screen actually needs that share's
   access entries (a folder is selected, an identity with access there is
   selected, or the relationship graph expands into it) -- see
   ensureShareLoaded() below. This is what lets a multi-gigabyte audit open
   instantly instead of parsing the whole thing before showing anything.
--------------------------------------------------------------------------- */
const ACCESS_MAP_DATA_DIR = 'AccessMap_data';
const MAX_EDGES_PER_NODE = ACCESS_MAP_MANIFEST.maxEdgesPerNode;

// DATA mirrors the old all-in-one shape everything below was written
// against. identities/folders and the rest are eager (straight off the
// manifest); edges starts EMPTY and grows in place as share chunks load
// (see mergeEdges) -- every place below that reads DATA.edges/byFolder/
// byIdentity/adjacency for a specific folder or identity is only ever
// reached after that folder's/identity's own share(s) are confirmed loaded.
const DATA = {
  identities: ACCESS_MAP_MANIFEST.identities,
  folders: ACCESS_MAP_MANIFEST.folders,
  edges: [],
  generatedAt: ACCESS_MAP_MANIFEST.generatedAt,
  sourceFolder: ACCESS_MAP_MANIFEST.sourceFolder,
  toolkitVersion: ACCESS_MAP_MANIFEST.toolkitVersion,
  scanErrors: ACCESS_MAP_MANIFEST.scanErrors,
  scanComplete: ACCESS_MAP_MANIFEST.scanComplete,
  truncatedRowsDropped: ACCESS_MAP_MANIFEST.truncatedRowsDropped,
  // Created/Modified/Accessed per folder are optional -- only present when
  // built from a CSV produced by Invoke-NTFSPermissionAudit.ps1 0.5.5+.
  // !! coerces an older manifest's genuinely absent field to false rather
  // than undefined, though in practice this template and the build script
  // that produced any given manifest are always the same version pair --
  // there's no supported scenario mixing an old manifest with this template.
  hasFileMetadata: !!ACCESS_MAP_MANIFEST.hasFileMetadata,
  hasFileCounts: !!ACCESS_MAP_MANIFEST.hasFileCounts,
  // The bash/awk build path appends this as a separate, trailing statement
  // after manifest.js's own const declaration (see Build-AccessMapHtml.sh --
  // avoids build.awk needing systime(), a gawk-only extension not available
  // in mawk), so it can genuinely be absent on an older report even when
  // everything else in ACCESS_MAP_MANIFEST is present; undefined here is
  // handled the same as "not available" by fmtDuration/the footer, not as 0.
  buildDurationSeconds: ACCESS_MAP_MANIFEST.buildDurationSeconds
};

/* ------------------------------ Lazy share data ---------------------------- */

const shareByKey = new Map();
(ACCESS_MAP_MANIFEST.shares || []).forEach(s => shareByKey.set(s.key, s));

const loadedShares = new Set();      // share keys whose edges are in DATA.edges/byFolder/byIdentity/adjacency
const shareLoadPromises = new Map(); // share key -> { promise, resolve, reject } while a chunk is in flight

// Called by each share_N.js chunk file itself, as the very last thing it
// does, once the <script> tag for it has finished loading.
function registerShareChunk(shareKey, edgeRows) {
  if (loadedShares.has(shareKey)) return; // safety net, shouldn't normally happen
  loadedShares.add(shareKey);
  mergeEdges(edgeRows);
  const pending = shareLoadPromises.get(shareKey);
  if (pending) pending.resolve();
}

function ensureShareLoaded(shareKey) {
  if (!shareKey || loadedShares.has(shareKey)) return Promise.resolve();
  const existing = shareLoadPromises.get(shareKey);
  if (existing) return existing.promise;
  const shareMeta = shareByKey.get(shareKey);
  if (!shareMeta) return Promise.resolve(); // unknown key -- nothing to load

  let resolveFn, rejectFn;
  const promise = new Promise((res, rej) => { resolveFn = res; rejectFn = rej; });
  shareLoadPromises.set(shareKey, { promise, resolve: resolveFn, reject: rejectFn });

  const script = document.createElement('script');
  script.src = ACCESS_MAP_DATA_DIR + '/' + shareMeta.file;
  script.onerror = () => {
    shareLoadPromises.delete(shareKey);
    rejectFn(new Error(`Не удалось загрузить ${script.src}. Папка AccessMap_data могла быть перемещена, переименована или не скопирована вместе с HTML-отчётом.`));
  };
  document.head.appendChild(script);
  return promise;
}

function ensureSharesLoaded(shareKeys) {
  return Promise.all(Array.from(new Set((shareKeys || []).filter(Boolean))).map(ensureShareLoaded));
}

function linkAdjacency(k1, k2, edgeDescr) {
  if (!adjacency.has(k1)) adjacency.set(k1, new Map());
  if (!adjacency.has(k2)) adjacency.set(k2, new Map());
  const m1 = adjacency.get(k1), m2 = adjacency.get(k2);
  if (!m1.has(k2)) m1.set(k2, { edges: [] });
  if (!m2.has(k1)) m2.set(k1, { edges: [] });
  m1.get(k2).edges.push(edgeDescr);
  m2.get(k1).edges.push(edgeDescr);
}

// RU_GROUP_ACL_TOPOLOGY_1_0_16
// e[6] = -1 for the identity's own ACL; index of granting AD group for
// an expanded member row. Preserve all rows, but graph the routes correctly.
function mergeEdges(edgeRows) {
  const directGroupAces = new Set();
  for (const e of edgeRows) {
    if (e[6] < 0 && DATA.identities[e[1]] &&
        DATA.identities[e[1]].type === 'Group') {
      directGroupAces.add(e[0] + '|' + e[1]);
    }
  }
  const inferredGrantsSeen = new Set();
  edgeRows.forEach(e => {
    const ei = DATA.edges.length;
    DATA.edges.push(e);
    const folderIdx = e[0], identityIdx = e[1];
    if (!byIdentity.has(identityIdx)) byIdentity.set(identityIdx, []);
    byIdentity.get(identityIdx).push(ei);
    if (!byFolder.has(folderIdx)) byFolder.set(folderIdx, []);
    byFolder.get(folderIdx).push(ei);

    const grantingGroup = Number(e[6]);
    if (Number.isInteger(grantingGroup) && grantingGroup >= 0) {
      if (DATA.identities[grantingGroup] &&
          DATA.identities[grantingGroup].type === 'Group') {
        const pair = folderIdx + '|' + grantingGroup;
        if (!directGroupAces.has(pair)) {
          // A missing group ACE must not become a false direct user grant.
          const dedupe = pair + '|' + e[2] + '|' + e[3] + '|' + e[5];
          if (!inferredGrantsSeen.has(dedupe)) {
            inferredGrantsSeen.add(dedupe);
            linkAdjacency('f:' + folderIdx, 'i:' + grantingGroup,
              { type: 'inferredGroupGrant', e, ei });
          }
        }
      } else {
        // Unresolvable group pointer: retain the route, but mark uncertainty.
        linkAdjacency('f:' + folderIdx, 'i:' + identityIdx,
          { type: 'unresolvedGroupGrant', e, ei });
      }
    } else {
      linkAdjacency('f:' + folderIdx, 'i:' + identityIdx,
        { type: 'access', e, ei });
    }
    // Membership adjacency is built once from manifest in precompute().
  });
}

const RIGHTS_LABELS = ['Full Control', 'Modify', 'Read & Execute', 'Read', 'Write', 'Special'];
// Higher = more "interesting" to show first when a node has more neighbors
// than MAX_EDGES_PER_NODE. Explicit (non-inherited) always outweighs rights level.
const RIGHTS_WEIGHT = [100, 90, 50, 10, 60, 85];
// Used as swatch/stroke colors (graph edges, legend dots, the dashboard's
// rights donut chart) against the graph/panel background, never as text
// sitting on top of them -- so the one real risk is a color simply being
// too washed-out against whichever theme's background is currently active,
// not text-on-color contrast. The dark-mode set was tuned against a dark
// canvas; a couple of those (the light purple especially) read as too
// pale once the graph background itself became theme-aware rather than
// permanently dark (see svg.graph's own fix) -- these functions pick a
// deliberately darker/more saturated variant for light mode instead of
// reusing the same six colors unchanged in both themes.
const EDGE_COLORS_DARK  = ['#ff5d5d', '#ffb454', '#57d3d3', '#7d8a99', '#4da3ff', '#c084fc'];
const EDGE_COLORS_LIGHT = ['#d53c3c', '#b8720a', '#0d7373', '#4a5568', '#1a73e8', '#7c3aed'];
function getEdgeColors() { return effectiveThemeIsLight() ? EDGE_COLORS_LIGHT : EDGE_COLORS_DARK; }

const TYPE_COLORS_DARK = {
  User: '#4da3ff', Group: '#c084fc', Computer: '#7d8a99',
  'Well-known / Local': '#5a6472', Unresolved: '#5a6472'
};
const TYPE_COLORS_LIGHT = {
  User: '#1a73e8', Group: '#7c3aed', Computer: '#4a5568',
  'Well-known / Local': '#6b7280', Unresolved: '#6b7280'
};
function getTypeColors() { return effectiveThemeIsLight() ? TYPE_COLORS_LIGHT : TYPE_COLORS_DARK; }

const DORMANT_DAYS = 90;
const TREE_CHILD_CAP = MAX_EDGES_PER_NODE; // max children shown per folder before "+N more"
const TREE_AUTO_EXPAND_CAP = 1500;         // safety cap on total nodes auto-expanded (Full depth), regardless of tree size

let state = {
  tab: 'identities',
  search: '',
  selected: null,      // { kind: 'identity'|'folder', idx: N }
  history: [],
  tableSort: { col: null, dir: 1 },
  tableFilter: '',
  depth: 1,            // tree auto-expand depth: 1/2/3/4/5/Infinity ("Full") -- 1 = just the
                        // folder itself, no subfolders shown yet; 2 = + its direct subfolders;
                        // 3 = + their own subfolders in turn; etc. Each subfolder's own children
                        // branch from it specifically -- never pooled with a sibling's.
  detailTab: 'tree',   // 'tree' (folder/subfolder hierarchy) or 'graph' (relationship picture)
  graphDepth: 2,       // Folder -> group -> members by default; depth 1 = direct ACL
                        // relationships only. Separate from the Tree's `depth` since they mean
                        // different things (relationship hops here vs. subfolder nesting there).
  filterBroken: 0,     // sidebar quick filter, tri-state: 0=off, 1=show only, 2=hide
  filterDormant: 0,    // same, for the disabled/dormant/locked identities filter
  sortDir: 1,          // sidebar list sort direction: 1 = A-Z, -1 = Z-A
  filterIdentityKind: 0, // sidebar identities filter, tri-state: 0=all, 1=Users (non-Group), 2=Groups only
  sortGroupsFirst: false, // when true, all Groups sort before all non-Groups (each block still respects sortDir/search/filterIdentityKind)
  filterAgedYears: 0,     // sidebar folder list "aged" filter, cycles 0 (off) -> 1 -> 5 -> 10 (years since last modified) -> back to 0; only meaningful when DATA.hasFileMetadata is true
  flagFilesBroken: false  // when true, shows a "files: broken" badge on folders with filesBrokenInheritance in both the sidebar list and the tree view; only meaningful when DATA.hasFileCounts is true
};

// Case-insensitive comparator for anything shown alphabetically (sidebar
// lists, tree children) -- plain localeCompare()'s default collation isn't
// guaranteed case-insensitive across environments/locales, which could
// otherwise interleave "Arthur"/"bill"/"Diane" in a way that LOOKS unsorted
// even though a comparator was technically applied.
function cmpText(a, b) {
  a = (a || '').toLowerCase();
  b = (b || '').toLowerCase();
  if (a < b) return -1;
  if (a > b) return 1;
  return 0;
}

const RING_SPACING = 130;
const HUB_DEGREE_THRESHOLD = 15;
const GRAPH_NODE_CAP = 600; // safety cap on total nodes drawn in the graph, regardless of depth
let adjacency = new Map(); // 'f:N'|'i:N' -> Map<neighborKey, {edges:[{type,e,ei}]}> -- membership links built
                            // once in precompute(); access links added incrementally by mergeEdges() as
                            // each share's chunk loads (see linkAdjacency())

/* ------------------------------- Precompute ------------------------------- */

const byIdentity = new Map();  // idx -> [edgeIdx,...]
const byFolder = new Map();    // idx -> [edgeIdx,...]
const folderPathToIdx = new Map(); // path string -> folder idx (REAL folders only)
const folderChildren = new Map();  // nodeId -> [nodeId,...], sorted, built in precompute()
const folderParent = new Map();    // nodeId -> nodeId

// A node id is a real folder's own index (>=0) when the scan actually
// recorded that folder, or a negative "virtual" id standing in for a path
// segment the scan never recorded as its own folder (a share it walked
// non-recursively, an ACL-unchanged folder it skipped, etc.) but that still
// has to exist structurally so a folder several levels deeper nests under
// the right ancestor instead of becoming its own disconnected tree root.
// Without this, any gap in the scanned set turns what should be one deep
// tree into a wall of single-node "roots" that merely LOOK flat.
const virtualNodes = []; // virtualNodes[-id-1] = { path, segment }
function nodeIsReal(id) { return id >= 0; }
function nodePath(id) { return id >= 0 ? DATA.folders[id].path : virtualNodes[-id - 1].path; }
function nodeLabel(id) { return id >= 0 ? lastPathSegment(DATA.folders[id].path) : virtualNodes[-id - 1].segment; }

function ensureNode(path, shareRoot) {
  // Returns the node id for `path`: the real folder if the scan recorded
  // one there, otherwise a virtual node -- creating it, and recursively
  // wiring its own parent the same way, the first time this exact path is
  // asked for. Recursion terminates as soon as it reaches a path already in
  // pathToNodeId (a real folder, or a virtual node created by an earlier
  // call), since that node's own ancestor chain was already wired then, or
  // once it reaches shareRoot itself (nothing above that is meaningful --
  // just a bare server or drive letter, not another folder level).
  if (folderPathToIdx.has(path)) return folderPathToIdx.get(path);
  const lastSep = path.lastIndexOf('\\');
  const segment = lastSep >= 0 ? path.substring(lastSep + 1) : path;
  const id = -(virtualNodes.length + 1);
  virtualNodes.push({ path, segment });
  folderPathToIdx.set(path, id);
  if (path !== shareRoot && lastSep > 0) {
    const parentPath = path.substring(0, lastSep);
    const parentId = ensureNode(parentPath, shareRoot);
    if (!folderChildren.has(parentId)) folderChildren.set(parentId, []);
    folderChildren.get(parentId).push(id);
    folderParent.set(id, parentId);
  }
  return id;
}

function buildFolderTree() {
  // Parent/child relationships are derived from path strings -- a folder's
  // parent path is whatever's left after trimming its own last segment off
  // (via the path's own last backslash), not a path re-synthesized from
  // split segments with a hardcoded "\\" prefix -- that assumption only
  // holds for UNC-style (\\server\share\...) paths and silently fabricates
  // a non-matching ancestor for any other convention (a local C:\... root,
  // for instance), which then never connects back to the real folder at
  // that level and can leave every folder looking parentless. Each
  // folder's own precomputed .share field (whatever convention it itself
  // uses) marks where the walk stops -- nothing above a share's own root is
  // meaningful here. Any missing intermediate level gets a virtual node
  // (see ensureNode) rather than breaking the chain, so real folders still
  // nest under their true ancestor even when the scan itself has gaps.
  DATA.folders.forEach((f, idx) => folderPathToIdx.set(f.path, idx));
  DATA.folders.forEach((f, idx) => {
    if (f.path === f.share) return; // this folder IS its own share's root -- no parent
    const lastSep = f.path.lastIndexOf('\\');
    if (lastSep <= 0) return; // defensive: nothing to trim
    const parentPath = f.path.substring(0, lastSep);
    const parentId = ensureNode(parentPath, f.share);
    if (!folderChildren.has(parentId)) folderChildren.set(parentId, []);
    folderChildren.get(parentId).push(idx);
    folderParent.set(idx, parentId);
  });
  folderChildren.forEach(list => list.sort((a, b) => cmpText(nodePath(a), nodePath(b))));
}

function computeTopmostRoots(candidateIndices) {
  // Given a set of folders an identity has a direct edge to, a normal
  // recursive audit typically records an ACE row for EVERY folder in a
  // branch (inherited ACEs get captured per-folder) -- so without this, a
  // parent folder and several of its own descendants would each show up as
  // their own separate, duplicated top-level tree root. Keep only the
  // topmost folder per branch; everything beneath it is already reachable
  // by expanding that one root.
  const candidateSet = new Set(candidateIndices);
  return candidateIndices.filter(idx => {
    let p = folderParent.get(idx);
    while (p !== undefined) {
      if (candidateSet.has(p)) return false; // an ancestor is also a candidate -- not topmost
      p = folderParent.get(p);
    }
    return true;
  });
}

let cachedFolderTreeOrder = null;
let cachedFolderTreeOrderDir = null;

function isTopOfItsOwnBranch(idx) {
  // A real folder counts as a top-level entry for the flat sidebar list if
  // no ancestor above it (walking up through any virtual bridge nodes) is
  // ALSO a real, scanned folder. Covers both the ordinary case (this
  // folder's own share root was itself scanned, so it simply has no
  // parent at all) and the less obvious one: an audit pointed at a
  // subfolder partway down a share, where EVERY real folder in the data
  // technically has some recorded parent, but that parent chain -- purely
  // virtual the whole way -- never actually passes through another folder
  // the scan itself captured. Plain `folderParent.get(idx) === undefined`
  // would wrongly find zero roots in that second case.
  let p = folderParent.get(idx);
  while (p !== undefined) {
    if (nodeIsReal(p)) return false;
    p = folderParent.get(p);
  }
  return true;
}

function getFolderListInTreeOrder() {
  // A flat lexicographic sort of every folder's own full path string doesn't
  // respect the tree it's actually describing: one folder's own descendants
  // can sort BEHIND an entirely unrelated sibling folder purely because of
  // how their names compare character-by-character (e.g. "\\srv\test2"
  // sorts between "\\srv\test" and "\\srv\test\a", even though the latter is
  // test's own child, not test2's). This instead walks the real tree
  // depth-first, pre-order -- each share (root) in turn, and within it every
  // descendant nested exactly where it belongs -- so a folder's whole branch
  // always reads as one contiguous, alphabetized block, matching how a file
  // explorer's expanded tree would read if flattened into a list. Virtual
  // "not scanned" bridge nodes (see ensureNode) are walked through so their
  // real descendants still land in the right place, but aren't themselves
  // emitted (nothing to select there).
  //
  // Cached and only rebuilt when the sort direction actually changes --
  // search keystrokes and filter toggles re-render the list far more often
  // than that, and re-filtering this cached order is cheap regardless.
  // Compute the ascending (A-Z) linearization once, then reverse the WHOLE
  // sequence for Z-A -- not just each level's own sibling order. "Root on
  // top in A-Z, root on bottom in Z-A" means the parent's own POSITION
  // relative to its children flips too (children-then-parent in Z-A), not
  // just which sibling comes first at any given level. This only makes
  // sense for this flat list; the nested Tree view's own children ordering
  // (see renderFolderNode) reverses sibling order only, since a parent node
  // there can never visually sit below its own children in an expandable
  // widget -- two different UI shapes, two different reversal rules.
  if (cachedFolderTreeOrder && cachedFolderTreeOrderDir === state.sortDir) return cachedFolderTreeOrder;

  const roots = [];
  DATA.folders.forEach((f, idx) => { if (isTopOfItsOwnBranch(idx)) roots.push(idx); });
  roots.sort((a, b) => cmpText(DATA.folders[a].path, DATA.folders[b].path));

  const out = [];
  function visit(nodeId) {
    if (nodeIsReal(nodeId)) out.push(nodeId);
    (folderChildren.get(nodeId) || []).forEach(visit); // already pre-sorted ascending by buildFolderTree
  }
  roots.forEach(visit);

  const finalOrder = state.sortDir === -1 ? out.slice().reverse() : out;
  cachedFolderTreeOrder = finalOrder;
  cachedFolderTreeOrderDir = state.sortDir;
  return finalOrder;
}

function precompute() {
  buildFolderTree();

  // folders[].broken is precomputed by Build-AccessMapHtml.ps1 (it already
  // knows this from InheritanceBrokenHere while it builds each edge) -- no
  // edges need to be loaded client-side to know which folders show the
  // "broken inheritance" badge.

  // Group-membership relationships ("who else is a member of this group")
  // are also global and cheap -- Build-AccessMapHtml.ps1 already resolves
  // every GrantedViaGroup while it streams IdentityPermissions.csv once, so
  // this is built here, eagerly, and never needs a share chunk loaded.
  DATA.identities.forEach((idn, groupIdx) => {
    (idn.members || []).forEach(memberIdx => {
      linkAdjacency('i:' + groupIdx, 'i:' + memberIdx, { type: 'membership' });
    });
  });

  // Per-identity disabled/dormant/locked flags, precomputed once.
  const now = new Date();
  DATA.identities.forEach(idn => {
    idn.flagDisabled = (idn.enabled === false);
    idn.flagLocked = (idn.locked === true);
    idn.flagDormant = false;
    if (idn.lastLogon) {
      const d = new Date(idn.lastLogon);
      if (!isNaN(d.getTime())) {
        const days = (now - d) / (1000 * 60 * 60 * 24);
        if (days > DORMANT_DAYS) idn.flagDormant = true;
      }
    }
  });
}

/* --------------------------------- Helpers -------------------------------- */

function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtBool(b) { return b === true ? 'Yes' : (b === false ? 'No' : ''); }
function fmtDate(iso) {
  // Created/Modified/Accessed are stored as raw ISO-8601 (round-trip,
  // locale-independent) strings -- reformatted here into something more
  // readable for display; ageInDays/the aged-document filter still parse
  // the RAW value directly via new Date(iso), not this formatted string.
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return iso; // fall back to the raw string rather than hide a genuinely unparseable value
  return d.toLocaleString('ru-RU', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}
function ageInDays(iso) {
  if (!iso) return null;
  const d = new Date(iso);
  if (isNaN(d.getTime())) return null;
  return (Date.now() - d.getTime()) / (1000 * 60 * 60 * 24);
}
function fmtDuration(seconds) {
  if (seconds === undefined || seconds === null || isNaN(seconds)) return '';
  if (seconds < 60) return `${seconds} с`;
  const mins = Math.floor(seconds / 60);
  const secs = Math.round(seconds % 60);
  return `${mins} мин ${secs} с`;
}
function truncateLabel(s, n) { if (!s) return ''; return s.length > n ? s.slice(0, n - 1) + '\u2026' : s; }

function downloadCsv(filename, rows, columns) {
  const header = columns.map(c => c.label).join(',');
  const lines = rows.map(r => columns.map(c => {
    let v = c.get(r);
    if (v === null || v === undefined) v = '';
    v = String(v).replace(/"/g, '""');
    return /[",\n]/.test(v) ? '"' + v + '"' : v;
  }).join(','));
  const csv = [header].concat(lines).join('\r\n');
  const blob = new Blob(['\uFEFF', csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

  const counts = { disabled:0, locked:0, dormant:0 };

// Members are taken from manifest.js, not queried live from AD.

const GROUP_MEMBER_PAGE_SIZE = 150;
function getReportGroupMembers(group, groupIdx) {
  const seen = new Set();
  if (Array.isArray(group.members)) for (const idx of group.members) {
    if (!Number.isInteger(idx) || idx < 0 || idx >= DATA.identities.length ||
        idx === groupIdx || !DATA.identities[idx]) continue;
    seen.add(idx);
  }
  return Array.from(seen).sort((a, b) =>
    cmpText(DATA.identities[a].name || '', DATA.identities[b].name || ''));

function groupMemberMissingText(group) {
  if (Number(group.memberCount) === 0 && group.memberCount !== null &&
      group.memberCount !== undefined && group.memberCount !== '')
    return 'По данным AD у группы нет непосредственных участников.';
  return 'Состав группы не записан в отчёт. При сканировании укажите -ExpandGroups; проверьте -ExpandGroupsExclude и доступ к AD.';

function populateReportGroupMembers(host, group, groupIdx) {

  note.textContent = 'Раскрытых по данным аудита: ' + ids.length +

function appendGroupSidebarRow(panel, group, idx, badges) {
  const line = document.createElement('div');

function renderList() {
  const panel = document.getElementById('listPanel');
  const previousScroll = panel.scrollTop;
  panel.innerHTML = '';
  const q = state.search.trim().toLowerCase();
  const LIMIT = 300;

  if (state.tab === 'identities') {
    let items = DATA.identities.map((idn, idx) => ({ idn, idx }));
    if (q) items = items.filter(x => (x.idn.name || '').toLowerCase().includes(q) ||
                                      (x.idn.dept || '').toLowerCase().includes(q) ||
                                      (x.idn.title || '').toLowerCase().includes(q));
    // filterDormant: 0=off, 1=show only disabled/dormant/locked, 2=hide them
    if (state.filterDormant === 1) items = items.filter(x => x.idn.flagDisabled || x.idn.flagDormant || x.idn.flagLocked);
    else if (state.filterDormant === 2) items = items.filter(x => !(x.idn.flagDisabled || x.idn.flagDormant || x.idn.flagLocked));
    // filterIdentityKind: 0=all, 1=Users (anything that isn't a Group -- User,
    // Computer, Well-known/Local, Unresolved), 2=Groups only. Composes with
    // filterDormant above (both apply together, not as alternatives) and with
    // sortGroupsFirst below -- none of these three fight each other.
    if (state.filterIdentityKind === 1) items = items.filter(x => x.idn.type !== 'Group');
    else if (state.filterIdentityKind === 2) items = items.filter(x => x.idn.type === 'Group');
    if (state.sortGroupsFirst) {
      items.sort((a, b) => {
        const aGroup = a.idn.type === 'Group' ? 0 : 1;
        const bGroup = b.idn.type === 'Group' ? 0 : 1;
        if (aGroup !== bGroup) return aGroup - bGroup; // Groups block always first, regardless of sortDir
        return state.sortDir * cmpText(a.idn.name, b.idn.name);
      });
    } else {
      items.sort((a, b) => state.sortDir * cmpText(a.idn.name, b.idn.name));
    }
    const total = items.length;
    items = items.slice(0, LIMIT);
    items.forEach(({ idn, idx }) => {
      const div = document.createElement('div');
      div.className = 'listItem';
      const badges = identityStatusBadgesHtml(idn);
      div.innerHTML = `<div>${esc(idn.name || '(неизвестно)')}${badges}</div><div class="sub">${esc(displayIdentityType(idn.type))}${idn.title ? ' \u00b7 ' + esc(idn.title) : ''}</div>`;
      const statusClass = identityStatusRowClass(idn);
      if (statusClass) {
        div.classList.add(statusClass);
        div.title = (idn.name || '') + ' · ' + identityStatusText(idn);
      }
      if (idn.type === 'Group') {
        appendGroupSidebarRow(panel, idn, idx, '');
      } else {
        div.onclick = () => selectIdentity(idx, true);
        panel.appendChild(div);
      }
    });
    if (total === 0) {
      const none = document.createElement('div');
      none.className = 'listMore';
      none.textContent = 'Ничего не найдено.';
      panel.appendChild(none);
    } else if (total > LIMIT) {
      const more = document.createElement('div');
      more.className = 'listMore';
      more.textContent = `${total - LIMIT} ещё — уточните поиск`;
      panel.appendChild(more);
    }
  } else {
    let items = getFolderListInTreeOrder().map(idx => ({ f: DATA.folders[idx], idx }));
    if (q) items = items.filter(x => x.f.path.toLowerCase().includes(q));
    // filterBroken: 0=off, 1=show only broken-inheritance folders, 2=hide them
    if (state.filterBroken === 1) items = items.filter(x => x.f.broken);
    else if (state.filterBroken === 2) items = items.filter(x => !x.f.broken);
    // filterAgedYears: 0=off, else show only folders whose Modified date is
    // at least that many years old. A folder with no Modified value at all
    // (this scan didn't capture it for that specific item, even if
    // DATA.hasFileMetadata is true overall) is excluded rather than shown
    // as a false positive -- "definitely old" is the claim being made here,
    // not "unknown age".
    if (state.filterAgedYears > 0) {
      const thresholdDays = state.filterAgedYears * 365;
      items = items.filter(x => {
        const age = ageInDays(x.f.modified);
        return age !== null && age >= thresholdDays;
      });
    }
    // NOTE: no separate sort here -- getFolderListInTreeOrder() already
    // ordered everything (see there for why a flat string sort isn't used),
    // and .filter() preserves that relative order.
    const total = items.length;
    items = items.slice(0, LIMIT);
    items.forEach(({ f, idx }) => {
      const div = document.createElement('div');
      div.className = 'listItem';
      const badge = f.broken ? '<span class="badge broken">наследование отключено</span>' : '';
      const fileBadge = (state.flagFilesBroken && f.filesBrokenInheritance) ? '<span class="badge broken" title="Для одного или нескольких файлов в этой папке отключено наследование">файлы: наследование отключено</span>' : '';
      div.innerHTML = `<div class="listItemPathRow"><span class="path">${esc(f.path)}</span>${badge}${fileBadge}</div>`;
      div.title = f.path;
      div.onclick = () => selectFolder(idx, true);
      panel.appendChild(div);
    });
    if (total === 0) {
      const none = document.createElement('div');
      none.className = 'listMore';
      none.textContent = 'Ничего не найдено.';
      panel.appendChild(none);
    } else if (total > LIMIT) {
      const more = document.createElement('div');
      more.className = 'listMore';
      more.textContent = `${total - LIMIT} ещё — уточните поиск`;
      panel.appendChild(more);
    }
  }
  panel.scrollTop = previousScroll;
}
