/* ----------------------------- Selection / nav ----------------------------- */

function pushHistory() {
  if (state.selected) state.history.push(state.selected);
  document.getElementById('backBtn').disabled = state.history.length === 0;
}

function goBack() {
  if (state.history.length === 0) return;
  const prev = state.history.pop();
  document.getElementById('backBtn').disabled = state.history.length === 0;
  if (prev.kind === 'identity') selectIdentity(prev.idx, false); else selectFolder(prev.idx, false);
}

let selectionToken = 0;

async function selectIdentity(idx, recordHistory) {
  if (recordHistory) pushHistory();
  state.selected = { kind: 'identity', idx };
  state.tableSort = { col: null, dir: 1 };
  state.tableFilter = '';
  setTab('identities');
  const token = ++selectionToken;
  // Usually resolves on the same tick (already loaded, or this identity has
  // no access anywhere) -- the placeholder only actually shows for however
  // long a genuinely new share chunk takes to fetch and register.
  document.getElementById('content').innerHTML = '<div id="welcome">Загрузка…</div>';
  try {
    await ensureSharesLoaded(DATA.identities[idx].shareKeys);
  } catch (err) {
    if (token !== selectionToken) return;
    document.getElementById('content').innerHTML = `<div id="welcome">Не удалось загрузить права учётной записи: ${esc(err.message)}</div>`;
    return;
  }
  if (token !== selectionToken) return; // a newer selection superseded this one
  renderIdentity(idx);
}

async function selectFolder(idx, recordHistory) {
  if (recordHistory) pushHistory();
  state.selected = { kind: 'folder', idx };
  state.tableSort = { col: null, dir: 1 };
  state.tableFilter = '';
  setTab('folders');
  const token = ++selectionToken;
  document.getElementById('content').innerHTML = '<div id="welcome">Загрузка…</div>';
  try {
    await ensureShareLoaded(DATA.folders[idx].share);
  } catch (err) {
    if (token !== selectionToken) return;
    document.getElementById('content').innerHTML = `<div id="welcome">Не удалось загрузить права папки: ${esc(err.message)}</div>`;
    return;
  }
  if (token !== selectionToken) return;
  renderFolder(idx);
}

/* -------------------------------- Folder tree view --------------------------- */

function lastPathSegment(path) {
  const segs = path.split('\\').filter(Boolean);
  return segs.length ? segs[segs.length - 1] : path;
}

function folderAccessCounts(folderIdx) {
  // Splits a folder's access entries into "direct" (this row's own identity
  // holds an ACE here that isn't itself an expanded group-membership row --
  // covers both an ordinary direct grant AND a group's own listing) versus
  // "via group" (a member shown here only because of a group ACE elsewhere
  // in this same folder's list). Flattening both into one number is what
  // made a group's members look like additional, separately-counted access
  // rather than a breakdown of ONE grant -- see buildFolderAclRows, which
  // uses this same split to nest members under their group instead.
  const edgeIdxs = byFolder.get(folderIdx) || [];
  let direct = 0, viaGroup = 0;
  edgeIdxs.forEach(ei => { if (DATA.edges[ei][6] >= 0) viaGroup++; else direct++; });
  return { direct, viaGroup, total: edgeIdxs.length };
}

function renderFolderNode(nodeId, level, maxAutoExpandDepth, onSelectFolder, selectedFolderIdx, expandBudget) {
  // Builds one folder row plus a (possibly lazily-built) container for its
  // children. Auto-expands up to maxAutoExpandDepth LEVELS deep (level 1 =
  // this node itself, so maxAutoExpandDepth=1 means "just this folder, no
  // children shown yet"); every subfolder's own children always branch from
  // that subfolder specifically, never pooled with a sibling's. Beyond the
  // auto-expand depth, anything with children can still be expanded manually
  // by clicking its toggle, regardless of the depth setting.
  //
  // nodeId can be a REAL folder (>=0, an index into DATA.folders) or a
  // VIRTUAL node (see ensureNode) standing in for a path segment the scan
  // itself never recorded -- shown as a plain, unclickable structural label
  // (no count, no broken badge, nothing to select) so the real folders on
  // either side of the gap still nest correctly instead of each becoming
  // their own disconnected root.
  const isReal = nodeIsReal(nodeId);
  const wrap = document.createElement('div');
  wrap.className = 'treeNode';

  const row = document.createElement('div');
  row.className = 'treeRow' + (nodeId === selectedFolderIdx ? ' selected' : '') + (isReal ? '' : ' virtual');

  const allChildren = folderChildren.get(nodeId) || [];
  const hasChildren = allChildren.length > 0;

  const toggle = document.createElement('span');
  toggle.className = 'treeToggle';
  toggle.textContent = '\u00a0\u00a0';
  row.appendChild(toggle);

  const label = document.createElement('span');
  label.className = 'treeLabel';
  label.textContent = nodeLabel(nodeId);
  label.title = nodePath(nodeId);
  row.appendChild(label);

  if (isReal) {
    const counts = folderAccessCounts(nodeId);
    const countBadge = document.createElement('span');
    countBadge.className = 'treeCount';
    countBadge.textContent = counts.viaGroup > 0 ? `${counts.direct}+${counts.viaGroup}` : String(counts.direct);
    countBadge.title = counts.viaGroup > 0
      ? `${counts.direct} прямых записей ACL и ${counts.viaGroup} записей через группы`
      : `${counts.direct} прямых записей ACL в этой папке`;
    row.appendChild(countBadge);

    if (DATA.folders[nodeId].broken) {
      const b = document.createElement('span');
      b.className = 'badge broken';
      b.textContent = 'наследование отключено';
      b.title = 'Наследование NTFS отключено: используются явные записи ACL';
      row.appendChild(b);
    }
    if (state.flagFilesBroken && DATA.folders[nodeId].filesBrokenInheritance) {
      const fb = document.createElement('span');
      fb.className = 'badge broken';
      fb.textContent = 'файлы: наследование отключено';
      fb.title = 'Для одного или нескольких файлов в этой папке отключено наследование';
      row.appendChild(fb);
    }
    row.onclick = () => onSelectFolder(nodeId);
  } else {
    const note = document.createElement('span');
    note.className = 'virtualNote';
    note.textContent = 'не проверено';
    note.title = 'Этот уровень папок не попал в аудит и показан только для сохранения структуры дерева.';
    row.appendChild(note);
    row.onclick = () => { if (hasChildren) setExpanded(!expanded); };
  }
  wrap.appendChild(row);

  const childHost = document.createElement('div');
  childHost.className = 'treeChildren';
  wrap.appendChild(childHost);

  let expanded = false;
  let built = false;

  function buildChildren() {
    if (built) return;
    built = true;
    // allChildren is stored sorted ascending (see buildFolderTree); reversing
    // it here reflects the sidebar's own A-Z/Z-A toggle in the tree too,
    // without needing to re-sort the underlying structure on every toggle.
    const ordered = state.sortDir === -1 ? allChildren.slice().reverse() : allChildren;
    const shown = ordered.slice(0, TREE_CHILD_CAP);
    shown.forEach(childId => {
      childHost.appendChild(renderFolderNode(childId, level + 1, maxAutoExpandDepth, onSelectFolder, selectedFolderIdx, expandBudget));
    });
    if (allChildren.length > TREE_CHILD_CAP) {
      const more = document.createElement('div');
      more.className = 'treeMore';
      more.textContent = `+ ${allChildren.length - TREE_CHILD_CAP} подпапок скрыто. Выберите папку, чтобы просмотреть полный список в таблице ниже.`;
      childHost.appendChild(more);
    }
  }

  function setExpanded(v) {
    expanded = v;
    if (expanded) buildChildren();
    childHost.style.display = expanded ? 'block' : 'none';
    if (hasChildren) toggle.textContent = expanded ? '\u25be' : '\u25b8';
  }

  if (hasChildren) {
    toggle.classList.add('hasChildren');
    toggle.onclick = (e) => { e.stopPropagation(); setExpanded(!expanded); };
  }

  const shouldAutoExpand = hasChildren && level < maxAutoExpandDepth && expandBudget.count < TREE_AUTO_EXPAND_CAP;
  if (shouldAutoExpand) expandBudget.count++;
  setExpanded(shouldAutoExpand);

  return wrap;
}

function renderFolderTreeView(rootFolderIndices, onSelectFolder, selectedFolderIdx, onDepthChange) {
  // rootFolderIndices: one root (folder-centered view) or several (identity-
  // centered view -- every folder that identity directly accesses, each
  // getting its own independent tree; nothing here ever reaches OUTSIDE those
  // specific roots' own subfolder structure, so there is no path for an
  // unrelated part of the tree to leak in the way a relationship-hop graph
  // could -- see the depth toolbar's hint text for what depth means here).
  const wrap = document.createElement('div');
  wrap.className = 'treeWrap';

  const toolbar = document.createElement('div');
  toolbar.className = 'treeToolbar';
  const depthLabel = document.createElement('span');
  depthLabel.className = 'groupLabel';
  depthLabel.textContent = 'Глубина:';
  toolbar.appendChild(depthLabel);
  [1, 2, 3, 4, 5, 'Full'].forEach(d => {
    const btn = document.createElement('button');
    btn.className = 'depthBtn' + ((d === 'Full' ? Infinity : d) === state.depth ? ' active' : '');
    btn.textContent = d === 'Full' ? 'Все' : String(d);
    btn.onclick = () => { state.depth = (d === 'Full' ? Infinity : d); onDepthChange(); };
    toolbar.appendChild(btn);
  });
  const hint = document.createElement('span');
  hint.className = 'groupLabel';
  hint.textContent = 'Глубина — число автоматически раскрываемых уровней папок \u00b7 каждая подпапка имеет собственную ветку \u00b7 нажмите ▸ для раскрытия или сворачивания \u00b7 нажмите имя папки для перехода';
  toolbar.appendChild(hint);
  wrap.appendChild(toolbar);

  const maxAutoExpandDepth = state.depth === Infinity ? Infinity : state.depth;
  const expandBudget = { count: 0 };
  const treeHost = document.createElement('div');
  treeHost.className = 'treeHost';
  rootFolderIndices.forEach(rootIdx => {
    treeHost.appendChild(renderFolderNode(rootIdx, 1, maxAutoExpandDepth, onSelectFolder, selectedFolderIdx, expandBudget));
  });
  wrap.appendChild(treeHost);

  if (expandBudget.count >= TREE_AUTO_EXPAND_CAP) {
    const note = document.createElement('div');
    note.className = 'treeNote';
    note.textContent = `Дерево слишком большое: автоматическое раскрытие остановлено после ${TREE_AUTO_EXPAND_CAP} папок для сохранения быстродействия. Остальные ветки можно раскрыть вручную кнопкой ▸ или уменьшить глубину.`;
    wrap.appendChild(note);
  }

  return wrap;
}

/* -------------------------------- Simple 1-hop graph -------------------------- */
/* The picture view: center node plus its DIRECT relationships only (no
   multi-hop traversal, so none of the earlier hub-explosion/unrelated-
   relationship issues can recur here -- it always shows exactly what the
   Tree tab's root row plus the table below it already shows, just as a
   visual instead of a list). Purely a rendering choice alongside the Tree
   tab; both read from the same underlying edges. */

function svgEl(tag, attrs) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  if (attrs) Object.keys(attrs).forEach(k => el.setAttribute(k, attrs[k]));
  return el;
}

function bestEdgeScore(edgeInfo) {
  let best = -1;
  edgeInfo.edges.forEach(d => {
    const s = d.type === 'membership' ? 40 :
      d.type === 'inferredGroupGrant' ? 30 :
      d.type === 'unresolvedGroupGrant' ? 20 :
      ((d.e[3] ? 0 : 1000) + RIGHTS_WEIGHT[d.e[2]]);
    if (s > best) best = s;
  });
  return best;
}

function isExpandable(key, isCenter) {
  // Gates what a node reveals when the BFS steps OUT of it (not whether it
  // appears at all). The center is always fully expanded. Beyond that:
  //   - Folders: always fully expandable.
  //   - Unresolved / Well-known, not centered: 'none' -- frequent accidental
  //     hubs (a stale SID on hundreds of ACLs, a default group on nearly
  //     everything) with little signal once you know what they are.
  //   - Groups, not centered: 'membershipOnly' -- reveal other members, not
  //     the group's own reach into unrelated folders.
  //   - Users, not centered: 'full' UNLESS their total fan-out (degree)
  //     exceeds HUB_DEGREE_THRESHOLD, in which case 'membershipOnly' too --
  //     an admin/service account with a huge footprint is just as much a
  //     hub as a broadly-permissioned group.
  if (isCenter) return 'full';
  if (key[0] === 'f') return 'full';
  const idx = parseInt(key.slice(2), 10);
  const idn = DATA.identities[idx];
  if (idn.type === 'Unresolved' || idn.type === 'Well-known / Local') return 'none';
  if (idn.type === 'Group') return 'membershipOnly';
  // edgeCount is precomputed server-side across the WHOLE dataset (not just
  // shares loaded so far) -- using byIdentity's size here instead would
  // under-count a hub identity until every one of its shares happened to
  // already be loaded, letting a real hub slip through as 'full'.
  const degree = idn.edgeCount || 0;
  if (degree > HUB_DEGREE_THRESHOLD) return 'membershipOnly';
  return 'full';
}

async function buildEgoGraph(centerKey, depth, cap, perSourceCap) {
  const visited = new Map();
  visited.set(centerKey, { hop: 0, from: null });
  let frontier = [centerKey];
  const layers = [[centerKey]];
  let truncated = false;

  for (let hop = 1; hop <= depth && visited.size < cap; hop++) {
    const candidates = [];
    for (const fKey of frontier) {
      let mode = isExpandable(fKey, fKey === centerKey);
      // Folder-centric access map: only groups expand to their members;
      // users must not pull unrelated folder ACLs into this folder's graph.
      if (centerKey.startsWith('f:') && fKey.startsWith('i:') && fKey !== centerKey) {
        const obj = DATA.identities[parseInt(fKey.slice(2), 10)];
        if (obj && obj.type !== 'Group') mode = 'none';
      }
      if (mode === 'none') continue;
      // A folder's own share is always already loaded by the time it can
      // appear here (it was only ever discovered via an edge that came from
      // a loaded chunk). An identity being expanded 'full' reveals its own
      // access edges too, which may live in shares not loaded yet -- load
      // them now. 'membershipOnly' only needs membership links, which are
      // global/eager (see precompute()), so nothing to load for that case.
      if (mode === 'full' && fKey[0] === 'i') {
        const idx = parseInt(fKey.slice(2), 10);
        await ensureSharesLoaded(DATA.identities[idx].shareKeys);
      }
      const nbrs = adjacency.get(fKey) || new Map();
      const fromThisSource = [];
      nbrs.forEach((edgeInfo, nKey) => {
        if (visited.has(nKey)) return;
        if (mode === 'membershipOnly' && !edgeInfo.edges.some(d => d.type === 'membership')) return;
        fromThisSource.push({ nKey, fromKey: fKey, edgeInfo, score: bestEdgeScore(edgeInfo) });
      });
      fromThisSource.sort((a, b) => b.score - a.score);
      if (fromThisSource.length > perSourceCap) truncated = true;
      candidates.push(...fromThisSource.slice(0, perSourceCap));
    }
    const bestByKey = new Map();
    candidates.forEach(c => {
      const existing = bestByKey.get(c.nKey);
      if (!existing || c.score > existing.score) bestByKey.set(c.nKey, c);
    });
    let sorted = Array.from(bestByKey.values()).sort((a, b) => b.score - a.score);
    const budget = cap - visited.size;
    if (sorted.length > budget) truncated = true;
    sorted = sorted.slice(0, Math.max(0, budget));
    const nextFrontier = [];
    sorted.forEach(c => {
      visited.set(c.nKey, { hop, from: c.fromKey, edgeInfo: c.edgeInfo });
      nextFrontier.push(c.nKey);
    });
    layers.push(nextFrontier);
    frontier = nextFrontier;
    if (nextFrontier.length === 0) break;
  }
  return refineGraphMembershipTopology({ visited, layers, truncated }, centerKey, depth);
}

// RU_GRAPH_GROUP_RELATIONSHIPS_1_0_16
// A graph is not only a BFS spanning tree: one person may have direct ACL
// access AND belong to one or more groups with ACL access to the same folder.
// Prefer placing dual-grant users behind their group, but preserve every
// additional direct/membership relationship as a second visible edge.
function refineGraphMembershipTopology(graph, centerKey, depth) {
  const { visited, layers } = graph;
  const extraLinks = [];
  const extraKeys = new Set();
  const limit = 800;
  const allVisible = new Set(visited.keys());

  function addExtra(from, to, edgeInfo, reason) {
    if (!edgeInfo || !edgeInfo.edges || !edgeInfo.edges.length ||
        !allVisible.has(from) || !allVisible.has(to)) return;
    // The primary spanning-tree edge is drawn separately.
    const toParent = visited.get(to);
    const fromParent = visited.get(from);
    if ((toParent && toParent.from === from) ||
        (fromParent && fromParent.from === to)) return;
    const dedupe = from + '|' + to;
    if (extraKeys.has(dedupe)) return;
    if (extraLinks.length >= limit) {
      graph.truncated = true;
      return;
    }
    extraKeys.add(dedupe);
    extraLinks.push({ from, to, edgeInfo, reason });
  }

  if (centerKey.startsWith('f:') && depth >= 2) {
    const firstRing = layers[1] || [];
    const grantingGroups = firstRing.filter(key => {
      if (!key.startsWith('i:')) return false;
      const idn = DATA.identities[parseInt(key.slice(2), 10)];
      const link = visited.get(key);
      return idn && idn.type === 'Group' && link &&
        link.from === centerKey && link.edgeInfo &&
        link.edgeInfo.edges.some(d =>
          d.type === 'access' || d.type === 'inferredGroupGrant');
    }).sort((a,b) => cmpText(
      DATA.identities[parseInt(a.slice(2), 10)].name,
      DATA.identities[parseInt(b.slice(2), 10)].name));

    for (const userKey of firstRing.slice()) {
      if (!userKey.startsWith('i:')) continue;
      const user = DATA.identities[parseInt(userKey.slice(2), 10)];
      const direct = visited.get(userKey);
      if (!user || user.type !== 'User' || !direct ||
          direct.from !== centerKey || !direct.edgeInfo ||
          !direct.edgeInfo.edges.some(d => d.type === 'access')) continue;
      const groupKey = grantingGroups.find(gk => {
        const link = adjacency.get(gk) && adjacency.get(gk).get(userKey);
        return link && link.edges.some(d => d.type === 'membership');
      });
      if (!groupKey) continue;
      const groupLink = adjacency.get(groupKey).get(userKey);
      // Move the user behind their granting group. Keep the folder->user
      // direct grant as an additional line (never discard it).
      visited.set(userKey, { hop: 2, from: groupKey, edgeInfo: groupLink });
      const originalPos = layers[1].indexOf(userKey);
      if (originalPos >= 0) layers[1].splice(originalPos, 1);
      if (!layers[2]) layers[2] = [];
      if (!layers[2].includes(userKey)) layers[2].push(userKey);
    }
  }

  // Draw every relevant, visible group-membership connection, even when the
  // user is connected to TWO groups (the BFS can keep only one parent).
  for (const groupKey of allVisible) {
    if (!groupKey.startsWith('i:')) continue;
    const group = DATA.identities[parseInt(groupKey.slice(2), 10)];
    if (!group || group.type !== 'Group') continue;
    const neighbors = adjacency.get(groupKey) || new Map();
    neighbors.forEach((edgeInfo, memberKey) => {
      if (!allVisible.has(memberKey) ||
          !edgeInfo.edges.some(d => d.type === 'membership')) return;
      // On group-group relationships, sort direction to avoid duplicate
      // secondary edges while retaining primary parent links.
      if (memberKey.startsWith('i:') &&
          DATA.identities[parseInt(memberKey.slice(2), 10)].type === 'Group' &&
          groupKey > memberKey) return;
      addExtra(groupKey, memberKey,
        { edges: edgeInfo.edges.filter(d => d.type === 'membership') },
        'additionalMembership');
    });
  }

  // Specifically keep the separate direct ACL when a folder-connected user
  // was placed behind a group. This may be a chord across two rings.
  if (centerKey.startsWith('f:')) {
    const neighbors = adjacency.get(centerKey) || new Map();
    neighbors.forEach((edgeInfo, key) => {
      if (!allVisible.has(key)) return;
      const directEdges = edgeInfo.edges.filter(d => d.type === 'access');
      if (directEdges.length) {
        addExtra(centerKey, key, { edges: directEdges }, 'additionalDirectAcl');
      }
    });
  }

  graph.extraLinks = extraLinks;
  return graph;
}

function layoutRadial(layers, visited) {
  // Concentric rings by hop distance; within a ring, nodes are angularly
  // clustered near their parent's angle so related nodes stay visually
  // grouped instead of scattering randomly.
  const positions = new Map();
  positions.set(layers[0][0], { x: 0, y: 0, angle: 0 });
  for (let hop = 1; hop < layers.length; hop++) {
    const nodesThisHop = layers[hop];
    if (nodesThisHop.length === 0) continue;
    const byParent = new Map();
    nodesThisHop.forEach(k => {
      const p = visited.get(k).from;
      if (!byParent.has(p)) byParent.set(p, []);
      byParent.get(p).push(k);
    });
    const parentKeys = Array.from(byParent.keys()).sort((a, b) =>
      (positions.get(a) ? positions.get(a).angle : 0) - (positions.get(b) ? positions.get(b).angle : 0));
    const total = nodesThisHop.length;
    parentKeys.forEach(p => {
      const kids = byParent.get(p);
      const parentAngle = positions.get(p) ? positions.get(p).angle : 0;
      const arcWidth = (kids.length / total) * 2 * Math.PI;
      const startAngle = parentAngle - arcWidth / 2;
      kids.forEach((k, i) => {
        const angle = kids.length === 1 ? parentAngle : startAngle + (arcWidth * (i + 0.5) / kids.length);
        positions.set(k, { angle, x: 0, y: 0 });
      });
    });
  }
  layers.forEach((nodesThisHop, hop) => {
    // A fixed radius puts dozens of distinct identities on top of each other.
    // Reserve enough angular distance for each node on dense rings.
    const minSeparation = nodesThisHop.length > 18 ? 115 : 95;
    const radius = hop === 0 ? 0 : Math.max(hop * RING_SPACING,
      (nodesThisHop.length * minSeparation) / (2 * Math.PI));
    nodesThisHop.forEach(k => {
      const pos = positions.get(k);
      pos.x = radius * Math.cos(pos.angle - Math.PI / 2);
      pos.y = radius * Math.sin(pos.angle - Math.PI / 2);
    });
  });
  return positions;
}

function nodeDisplayInfo(key) {
  const kind = key[0], idx = parseInt(key.slice(2), 10);
  if (kind === 'f') {
    const f = DATA.folders[idx];
    return { label: lastPathSegment(f.path), full: f.path, color: effectiveThemeIsLight() ? '#0d7373' : '#57d3d3', flagged: f.broken };
  }
  const idn = DATA.identities[idx];
  return {
    label: idn.name, full: idn.name,
    color: getTypeColors()[idn.type] || (effectiveThemeIsLight() ? '#4a5568' : '#7d8a99'),
    flagged: identityStatusItems(idn).length > 0,
    status: identityStatusText(idn),
    critical: idn.flagDisabled === true || idn.flagLocked === true
  };
}

function edgeDisplayInfo(edgeInfo) {
  let best = null, bestScore = -1;
  edgeInfo.edges.forEach(d => {
    const s = d.type === 'membership' ? 40 :
      d.type === 'inferredGroupGrant' ? 30 :
      d.type === 'unresolvedGroupGrant' ? 20 :
      ((d.e[3] ? 0 : 1000) + RIGHTS_WEIGHT[d.e[2]]);
    if (s > bestScore) { bestScore = s; best = d; }
  });
  if (best.type === 'membership')
    return { label: 'Состоит в группе', color: effectiveThemeIsLight() ? '#7c3aed' : '#c084fc', dashed: true };
  if (best.type === 'inferredGroupGrant' || best.type === 'unresolvedGroupGrant') {
    return {
      label: best.type === 'inferredGroupGrant' ?
        'Групповой доступ (ACE группы не найдена)' : 'Доступ через неизвестную группу',
      color: effectiveThemeIsLight() ? '#606b76' : '#aab5c3',
      dashed: true, dashPattern: '2,5', inferred: true
    };
  }
  const e = best.e;
  let label = displayRight(RIGHTS_LABELS[e[2]]);
  if (e[5]) label = 'Запрет: ' + label;
  return { label, color: getEdgeColors()[e[2]], dashed: !!e[3] };
}

let graphRenderToken = 0;

function renderRelationshipGraph(kind, idx, onNavigate, onDepthChange) {
  // Returns a placeholder synchronously (so the caller can appendChild it
  // right away, same as before) and swaps in the real graph once this
  // node's own share(s) -- and anything the BFS expands into -- are loaded.
  const holder = document.createElement('div');
  holder.className = 'graphWrap';
  const note = document.createElement('div');
  note.className = 'graphNote';
  note.textContent = 'Загрузка связей…';
  holder.appendChild(note);

  const centerKey = (kind === 'folder' ? 'f:' : 'i:') + idx;
  const depth = state.graphDepth === Infinity ? 999 : state.graphDepth;
  const token = ++graphRenderToken;

  (async () => {
    try {
      if (kind === 'folder') await ensureShareLoaded(DATA.folders[idx].share);
      else await ensureSharesLoaded(DATA.identities[idx].shareKeys);
      const g = await buildEgoGraph(centerKey, depth, GRAPH_NODE_CAP, MAX_EDGES_PER_NODE);
      if (token !== graphRenderToken) return; // a newer selection superseded this one
      const positions = layoutRadial(g.layers, g.visited);
      const built = renderRelationshipGraphInner(g, positions, centerKey, onNavigate, onDepthChange);
      holder.replaceWith(built);
    } catch (err) {
      if (token !== graphRenderToken) return;
      note.textContent = 'Не удалось загрузить данные связей: ' + err.message;
    }
  })();

  return holder;
}

function renderRelationshipGraphInner(g, positions, centerKey, onNavigate, onDepthChange) {
  const wrap = document.createElement('div');
  wrap.className = 'graphWrap';

  const toolbar = document.createElement('div');
  toolbar.className = 'graphToolbar';
  const depthLabel = document.createElement('span');
  depthLabel.className = 'groupLabel';
  depthLabel.textContent = 'Глубина:';
  toolbar.appendChild(depthLabel);
  [1, 2, 3, 4, 5, 'Full'].forEach(d => {
    const btn = document.createElement('button');
    btn.className = 'depthBtn' + ((d === 'Full' ? Infinity : d) === state.graphDepth ? ' active' : '');
    btn.textContent = d === 'Full' ? 'Все' : String(d);
    btn.onclick = () => { state.graphDepth = (d === 'Full' ? Infinity : d); onDepthChange(); };
    toolbar.appendChild(btn);
  });
  const btnOut = document.createElement('button'); btnOut.className = 'zoomBtn'; btnOut.textContent = '\u2212'; btnOut.title = 'Уменьшить масштаб';
  const btnIn = document.createElement('button'); btnIn.className = 'zoomBtn'; btnIn.textContent = '+'; btnIn.title = 'Увеличить масштаб';
  const btnReset = document.createElement('button'); btnReset.className = 'zoomBtn'; btnReset.textContent = '\u2317'; btnReset.title = 'Сбросить масштаб и расположение узлов';
  toolbar.appendChild(btnOut); toolbar.appendChild(btnIn); toolbar.appendChild(btnReset);
  const rightsToggle = document.createElement('button');
  rightsToggle.type = 'button';
  rightsToggle.className = 'chipBtn graphRightsToggle';
  toolbar.appendChild(rightsToggle);
  const hint = document.createElement('span');
  hint.className = 'groupLabel';
  hint.textContent = 'Глубина 1 — прямые ACL · глубина 2 — группы и их участники · при прямом ACL и членстве в группе показываются обе связи · перетаскивайте узлы для изменения расположения · кнопка ⌗ сбрасывает расположение';
  toolbar.appendChild(hint);
  wrap.appendChild(toolbar);
  const graphCanvas = document.createElement('div');
  graphCanvas.className = 'graphCanvas';
  wrap.appendChild(graphCanvas);

  const legendToggle = document.createElement('button');
  legendToggle.className = 'graphLegendToggle';
  legendToggle.textContent = 'i';
  legendToggle.title = 'Показать обозначения';
  graphCanvas.appendChild(legendToggle);

  const legendPanel = document.createElement('div');
  legendPanel.className = 'graphLegendPanel';
  legendPanel.style.display = 'none';
  legendPanel.tabIndex = 0;
  legendPanel.setAttribute('aria-label', 'Легенда графа: узлы, права и связи');
  function legendSection(title, rows) {
    const h = document.createElement('h4');
    h.textContent = title;
    legendPanel.appendChild(h);
    rows.forEach(row => legendPanel.appendChild(row));
  }
  function swatchRow(color, label) {
    const row = document.createElement('div');
    row.className = 'graphLegendRow';
    const sw = document.createElement('span');
    sw.className = 'graphLegendSwatch';
    sw.style.background = color;
    row.appendChild(sw);
    const lbl = document.createElement('span');
    lbl.textContent = label;
    row.appendChild(lbl);
    return row;
  }
  function lineRow(color, label, dashed) {
    const row = document.createElement('div');
    row.className = 'graphLegendRow';
    const ln = document.createElement('span');
    ln.className = 'graphLegendLine' + (dashed ? ' dashed' : '');
    ln.style.borderTopColor = color;
    row.appendChild(ln);
    const lbl = document.createElement('span');
    lbl.textContent = label;
    row.appendChild(lbl);
    return row;
  }
  legendSection('Узлы', [
    swatchRow(effectiveThemeIsLight() ? '#b8720a' : '#ffb454', 'Центр (выбранный объект)'),
    swatchRow(effectiveThemeIsLight() ? '#0d7373' : '#57d3d3', 'Папка'),
    swatchRow(getTypeColors().User, 'Пользователь'),
    swatchRow(getTypeColors().Group, 'Группа'),
    swatchRow(getTypeColors().Computer, 'Компьютер'),
    swatchRow(getTypeColors()['Well-known / Local'], 'Встроенная / локальная / SID без имени')
  ]);
  const flagRow = document.createElement('div');
  flagRow.className = 'graphLegendRow';
  const dot = document.createElement('span');
  dot.className = 'graphLegendDot';
  flagRow.appendChild(dot);
  const flagLbl = document.createElement('span');
  flagLbl.textContent = 'Папка: отключено наследование; учётная запись: отключена, заблокирована или неактивна';
  flagRow.appendChild(flagLbl);
  legendPanel.appendChild(flagRow);
  legendSection('Права доступа', RIGHTS_LABELS.map((label, i) => swatchRow(getEdgeColors()[i], displayRight(label))));
  // RU_GRAPH_LEGEND_COMBINATIONS_1_0_14: the SVG combines the rights code's
  // color with ACL inheritance's dash pattern. A dashed RED line does NOT
  // mean Deny: it is an inherited Full Control ACE.
  legendSection('Связи', [
    lineRow(effectiveThemeIsLight() ? '#4a5568' : '#7d8a99',
      'Сплошная линия — право назначено явно в ACL', false),
    lineRow(effectiveThemeIsLight() ? '#4a5568' : '#7d8a99',
      'Пунктир — право унаследовано от родительской папки', true),
    lineRow(getEdgeColors()[0],
      'Красный пунктир — унаследованный «Полный доступ»', true),
    lineRow(getEdgeColors()[0],
      'Красная сплошная — явно назначенный «Полный доступ»', false),
    lineRow(effectiveThemeIsLight() ? '#7c3aed' : '#c084fc',
      'Фиолетовый пунктир — членство в AD-группе', true),
    lineRow(effectiveThemeIsLight() ? '#606b76' : '#aab5c3',
      'Мелкий серый пунктир — групповое право определено косвенно (ACE группы в отчёте отсутствует)', true)
  ]);
  const meaning = document.createElement('p');
  meaning.className = 'graphLegendExplanation';
  meaning.textContent = 'Как читать линии: цвет показывает категорию прав NTFS, ' +
    'а сплошная линия или пунктир — их происхождение (явно назначены либо унаследованы). ' +
    'Красный цвет обозначает «Полный доступ», а НЕ запрет (Deny). ' +
    'Для папки права через AD-группу отображаются в ветке этой группы. ' +
    'Если у пользователя также есть прямой ACL, к нему ведёт отдельная линия. ' +
    'Линии членства учитывают раскрытых участников, включая вложенные группы. ' +
    'На графе для нескольких ACE выбирается наиболее значимая связь. ' +
    'Наведите курсор на линию или узел для просмотра подробностей, включая «Запрет».';
  legendPanel.appendChild(meaning);
  graphCanvas.appendChild(legendPanel);
  legendToggle.onclick = () => {
    const showing = legendPanel.style.display !== 'none';
    legendPanel.style.display = showing ? 'none' : 'block';
    legendToggle.title = showing ? 'Показать обозначения' : 'Скрыть обозначения';
    legendToggle.setAttribute('aria-expanded', String(!showing));
    if (!showing) {
      legendPanel.scrollTop = 0; // Always start with the "Узлы" legend section.
    }
  };

  let maxAbs = 60;
  positions.forEach(p => { maxAbs = Math.max(maxAbs, Math.abs(p.x), Math.abs(p.y)); });
  const half = maxAbs + 140;
  const vbW = half * 2, vbH = vbW * (520 / 900);
  const vb = { x: -vbW / 2, y: -vbH / 2, w: vbW, h: vbH };

  const svg = svgEl('svg', { class: 'graph', viewBox: `${vb.x} ${vb.y} ${vb.w} ${vb.h}`, xmlns: 'http://www.w3.org/2000/svg' });
  const graphNodeCount = [].concat(...g.layers).length;
  // On a crowded graph show rights for the hovered/focused node only.
  let showAllRights = graphNodeCount <= 14;
  const syncRightsMode = () => {
    svg.classList.toggle('rightsAlways', showAllRights);
    rightsToggle.textContent = showAllRights ? 'Права: всегда' : 'Права: при наведении';
    rightsToggle.title = showAllRights ?
      'Подписи прав закреплены за узлами. Нажмите для показа по наведению.' :
      'Наведите курсор на узел. Нажмите, чтобы показывать все подписи.';
    rightsToggle.setAttribute('aria-pressed', String(showAllRights));
  };
  rightsToggle.onclick = () => { showAllRights = !showAllRights; syncRightsMode(); };
  syncRightsMode();
  const edgesLayer = svgEl('g', {});
  const nodesLayer = svgEl('g', {});
  svg.appendChild(edgesLayer);
  svg.appendChild(nodesLayer);
  graphCanvas.appendChild(svg);

  // All mutable geometry is keyed by the identity/folder ID, never by
  // absolute screen coordinates. Node labels live inside their <g>.
  const linesByNode = new Map();
  const nodeGroupsByKey = new Map();
  const originalPositions = new Map(Array.from(positions, ([key, pos]) =>
    [key, { x: pos.x, y: pos.y }]));
  function trackLine(key, el, xAttr, yAttr) {
    if (!linesByNode.has(key)) linesByNode.set(key, []);
    linesByNode.get(key).push({ el, xAttr, yAttr });
  }
  function updateNodePosition(key, x, y) {
    const pos = positions.get(key);
    if (!pos) return;
    pos.x = x; pos.y = y;
    const group = nodeGroupsByKey.get(key);
    if (group) group.setAttribute('transform', `translate(${x},${y})`);
    (linesByNode.get(key) || []).forEach(link => {
      link.el.setAttribute(link.xAttr, x);
      link.el.setAttribute(link.yAttr, y);
    });
  }
  function edgeDetailLines(edgeInfo) {
    const seen = new Set();
    for (const item of (edgeInfo.edges || [])) {
      if (item.type === 'membership') {
        seen.add('Членство в AD-группе (включая вложенное членство)');
      } else if (item.type === 'inferredGroupGrant') {
        seen.add('Групповой доступ выводится из записей участников, ' +
          'но отдельной ACE группы в этой папке нет; право: ' +
          displayRight(RIGHTS_LABELS[item.e[2]]));
      } else if (item.type === 'unresolvedGroupGrant') {
        seen.add('Группа для записи доступа не определена; право: ' +
          displayRight(RIGHTS_LABELS[item.e[2]]));
      } else if (item.e) {
        seen.add((item.e[5] ? 'Запрет: ' : '') +
          displayRight(RIGHTS_LABELS[item.e[2]]) +
          (item.e[3] ? ' (наследуемые права)' : ' (явные права)'));
      }
    }
    return Array.from(seen);
  }

  const allKeys = [].concat(...g.layers);
  g.layers.forEach((layerKeys, hop) => {
    if (hop === 0) return;
    layerKeys.forEach(key => {
      const info = g.visited.get(key);
      const parentPos = positions.get(info.from);
      const pos = positions.get(key);
      const edisp = edgeDisplayInfo(info.edgeInfo);
      const line = svgEl('line', {
        x1: parentPos.x, y1: parentPos.y, x2: pos.x, y2: pos.y,
        stroke: edisp.color, 'stroke-width': edisp.dashed ? 1.5 : 3,
        'stroke-dasharray': edisp.dashPattern || (edisp.dashed ? '5,4' : 'none'),
        opacity: 0.85
      });
      edgesLayer.appendChild(line);
      trackLine(info.from, line, 'x1', 'y1');
      trackLine(key, line, 'x2', 'y2');
      // A line still has its full rights information on hover; it no longer
      // owns a free-floating label that can be left behind when nodes move.
      const lineTip = document.createElementNS('http://www.w3.org/2000/svg', 'title');
      lineTip.textContent = nodeDisplayInfo(info.from).full + ' ↔ ' +
        nodeDisplayInfo(key).full + '\n' + edgeDetailLines(info.edgeInfo).join('; ');
      line.appendChild(lineTip);
    });
  });

  // Supplementary edges represent relationships lost by a pure BFS tree:
  // multiple group memberships and an additional direct ACL to the folder.
  // They share the SAME endpoint trackers as primary lines, so dragging an
  // identity updates every direct and group relationship immediately.
  (g.extraLinks || []).forEach(linkInfo => {
    const a = positions.get(linkInfo.from), b = positions.get(linkInfo.to);
    if (!a || !b) return;
    const edisp = edgeDisplayInfo(linkInfo.edgeInfo);
    const line = svgEl('line', {
      class: 'graphSecondaryEdge', 'data-reason': linkInfo.reason,
      x1:a.x, y1:a.y, x2:b.x, y2:b.y,
      stroke: edisp.color, 'stroke-width': edisp.dashed ? 1.6 : 2.5,
      'stroke-dasharray': edisp.dashPattern || (edisp.dashed ? '5,4' : 'none'),
      opacity: 0.58
    });
    trackLine(linkInfo.from, line, 'x1', 'y1');
    trackLine(linkInfo.to, line, 'x2', 'y2');
    const label = document.createElementNS('http://www.w3.org/2000/svg', 'title');
    label.textContent = (linkInfo.reason === 'additionalDirectAcl' ?
        'Дополнительная прямая запись ACL' : 'Дополнительное членство в AD-группе') +
      '\n' + nodeDisplayInfo(linkInfo.from).full + ' ↔ ' +
      nodeDisplayInfo(linkInfo.to).full + '\n' +
      edgeDetailLines(linkInfo.edgeInfo).join('; ');
    line.appendChild(label);
    edgesLayer.appendChild(line);
  });

  function buildNode(key, pos, isCenter) {
    const info = nodeDisplayInfo(key);
    const r = isCenter ? 26 : 17;
    const group = svgEl('g', {
      class: 'nodeGroup', transform: `translate(${pos.x},${pos.y})`,
      'data-key': key, tabindex: 0, role: 'button',
      'aria-label': info.full
    });
    nodeGroupsByKey.set(key, group);
    group.appendChild(svgEl('circle', { class: 'nodeCircle' + (isCenter ? ' centerCircle' : ''), r, fill: isCenter ? undefined : info.color }));
    if (info.flagged) {
      // Show the warning even when the flagged account is the selected center.
      const signal = info.critical ? (effectiveThemeIsLight() ? '#d53c3c' : '#ff5d5d') :
        (effectiveThemeIsLight() ? '#b8720a' : '#ffb454');
      group.appendChild(svgEl('circle', {
        cx: r * 0.7, cy: -r * 0.7, r: 6, fill: signal,
        stroke: effectiveThemeIsLight() ? '#f7f7f5' : '#1a1f26', 'stroke-width': 1,
        class: 'flagRing'
      }));
    }
    // Rights badge is a CHILD of the corresponding user/group/folder node.
    // Its local coordinates remain correct for zoom, pan and node dragging.
    let edgeTip = '';
    if (!isCenter) {
      const relation = g.visited.get(key);
      if (relation && relation.edgeInfo) {
        const edisp = edgeDisplayInfo(relation.edgeInfo);
        const details = edgeDetailLines(relation.edgeInfo);
        const edgeCount = relation.edgeInfo.edges.length;
        edgeTip = '\nСвязь с ' + nodeDisplayInfo(relation.from).full +
          ': ' + details.join('; ') +
          (edgeCount > 1 ? '\nЗаписей связи: ' + edgeCount : '');
        const shown = truncateLabel(edisp.label, 25) +
          (edgeCount > 1 ? ' (+' + (edgeCount - 1) + ')' : '');
        const width = Math.min(265, Math.max(66, shown.length * 6.15 + 18));
        const offsetX = r + 10;
        const tag = svgEl('g', { class: 'graphRightsTag',
          transform: `translate(${offsetX},-13)` });
        tag.appendChild(svgEl('rect', { class: 'graphRightsBadge',
          x: 0, y: 0, width, height: 25, rx: 5, stroke: edisp.color }));
        const txt = svgEl('text', { class: 'graphRightsLabel', x: 8, y: 17 });
        txt.textContent = shown;
        tag.appendChild(txt);
        group.appendChild(tag);
      }
      // A person who is a member of a granting group can ALSO have a
      // separate direct ACL. Show both, without duplicating the user node.
      const ownAcl = (g.extraLinks || []).find(link =>
        link.to === key && link.reason === 'additionalDirectAcl');
      if (ownAcl) {
        const direct = edgeDisplayInfo(ownAcl.edgeInfo);
        edgeTip += '\nДополнительный прямой ACL: ' +
          edgeDetailLines(ownAcl.edgeInfo).join('; ');
        const shown = truncateLabel('Прямой ACL: ' + direct.label, 28);
        const width = Math.min(275, Math.max(80, shown.length * 6.2 + 18));
        const badge = svgEl('g', { class: 'graphRightsTag',
          transform: `translate(${r + 10},16)` });
        badge.appendChild(svgEl('rect', {
          class:'graphRightsBadge', x:0, y:0, width, height:25, rx:5,
          stroke:direct.color
        }));
        const text = svgEl('text', { class:'graphRightsLabel', x:8, y:17 });
        text.textContent = shown;
        badge.appendChild(text);
        group.appendChild(badge);
      }
      const otherMemberships = (g.extraLinks || []).filter(link =>
        link.to === key && link.reason === 'additionalMembership');
      if (otherMemberships.length) {
        edgeTip += '\nТакже состоит в группах: ' +
          otherMemberships.map(link => nodeDisplayInfo(link.from).full).join(', ');
      }
    }
    const nameLbl = svgEl('text', { class: 'nodeLabel', x: 0, y: r + 16, 'text-anchor': 'middle' });
    nameLbl.textContent = truncateLabel(info.label, 22);
    group.appendChild(nameLbl);
    const title = document.createElementNS('http://www.w3.org/2000/svg', 'title');
    title.textContent = info.full + (info.status ? '\nСостояние: ' + info.status : '') + edgeTip;
    group.appendChild(title);
    nodesLayer.appendChild(group);
    // Never detach/reappend an SVG node during hover: doing so can invalidate
    // the active pointer target and make dragging unreliable in Chromium.
    group.addEventListener('keydown', ev => {
      if (!isCenter && (ev.key === 'Enter' || ev.key === ' ')) {
        ev.preventDefault();
        onNavigate(key);
      }
    });
    return group;
  }

  // RU_GRAPH_POINTER_DRAG_1_0_15: native Pointer Events keep mouse, stylus
  // and touch drags attached to a stable SVG element. Never reparent that
  // element on hover, otherwise browsers can cancel the active interaction.
  function clientToSvgScale() {
    const rect = svg.getBoundingClientRect ? svg.getBoundingClientRect() : null;
    const live = svg.viewBox && svg.viewBox.baseVal ? svg.viewBox.baseVal : null;
    const coords = (svg.getAttribute('viewBox') || '').trim().split(/\s+/).map(Number);
    const width = (live && live.width > 0 ? live.width : coords[2]) || vb.w;
    const height = (live && live.height > 0 ? live.height : coords[3]) || vb.h;
    const clientW = (rect && rect.width) || 900;
    const clientH = (rect && rect.height) || 520;
    return { sx: width / clientW, sy: height / clientH };
  }

  function attachDragHandlers(group, key, pos, isCenter) {
    let drag = null;
    function releasePointer(e, cancelled) {
      if (!drag || e.pointerId !== drag.pointerId) return;
      const previous = drag;
      drag = null;
      document.removeEventListener('pointermove', onPointerMove);
      document.removeEventListener('pointerup', onPointerUp);
      document.removeEventListener('pointercancel', onPointerCancel);
      if (group.releasePointerCapture && group.hasPointerCapture &&
          group.hasPointerCapture(previous.pointerId)) {
        try { group.releasePointerCapture(previous.pointerId); } catch (_) { }
      }
      group.classList.remove('dragging');
      if (!cancelled && !previous.moved && !isCenter) onNavigate(key);
    }
    function onPointerMove(e) {
      if (!drag || e.pointerId !== drag.pointerId) return;
      const dClientX = e.clientX - drag.startClientX;
      const dClientY = e.clientY - drag.startClientY;
      if (Math.abs(dClientX) > 2 || Math.abs(dClientY) > 2) drag.moved = true;
      if (!drag.moved) return;
      const scale = clientToSvgScale();
      const nextX = drag.startX + dClientX * scale.sx;
      const nextY = drag.startY + dClientY * scale.sy;
      if (Number.isFinite(nextX) && Number.isFinite(nextY)) {
        updateNodePosition(key, nextX, nextY);
      }
      if (e.cancelable) e.preventDefault();
    }
    function onPointerUp(e) { releasePointer(e, false); }
    function onPointerCancel(e) { releasePointer(e, true); }
    group.addEventListener('pointerdown', e => {
      if (e.button !== 0 || drag) return;
      e.stopPropagation();
      if (e.cancelable) e.preventDefault();
      drag = {
        pointerId: e.pointerId, moved: false,
        startClientX: e.clientX, startClientY: e.clientY,
        startX: pos.x, startY: pos.y
      };
      group.classList.add('dragging');
      if (group.setPointerCapture) {
        try { group.setPointerCapture(e.pointerId); } catch (_) { }
      }
      document.addEventListener('pointermove', onPointerMove);
      document.addEventListener('pointerup', onPointerUp);
      document.addEventListener('pointercancel', onPointerCancel);
    });
  }

  const centerGroup = buildNode(centerKey, positions.get(centerKey), true);
  attachDragHandlers(centerGroup, centerKey, positions.get(centerKey), true);

  allKeys.forEach(key => {
    if (key === centerKey) return;
    const pos = positions.get(key);
    const group = buildNode(key, pos, false);
    attachDragHandlers(group, key, pos, false);
  });

  // Pan only on the empty graph background, never when grabbing a node.
  let pan = null;
  svg.addEventListener('pointerdown', e => {
    if (e.button !== 0 || e.target !== svg || pan) return;
    const coords = svg.getAttribute('viewBox').split(/\s+/).map(Number);
    pan = {
      pointerId: e.pointerId, x: e.clientX, y: e.clientY,
      view: { x: coords[0], y: coords[1], w: coords[2], h: coords[3] }
    };
    if (svg.setPointerCapture) {
      try { svg.setPointerCapture(e.pointerId); } catch (_) { }
    }
    if (e.cancelable) e.preventDefault();
  });
  function onPanPointerMove(e) {
    if (!pan || e.pointerId !== pan.pointerId) return;
    const rect = svg.getBoundingClientRect ? svg.getBoundingClientRect() : null;
    const w = (rect && rect.width) || 900;
    const h = (rect && rect.height) || 520;
    const dx = (e.clientX - pan.x) * (pan.view.w / w);
    const dy = (e.clientY - pan.y) * (pan.view.h / h);
    svg.setAttribute('viewBox',
      `${pan.view.x - dx} ${pan.view.y - dy} ${pan.view.w} ${pan.view.h}`);
    if (e.cancelable) e.preventDefault();
  }
  function endPan(e) {
    if (!pan || e.pointerId !== pan.pointerId) return;
    if (svg.releasePointerCapture && svg.hasPointerCapture &&
        svg.hasPointerCapture(pan.pointerId)) {
      try { svg.releasePointerCapture(pan.pointerId); } catch (_) { }
    }
    pan = null;
  }
  svg.addEventListener('pointermove', onPanPointerMove);
  svg.addEventListener('pointerup', endPan);
  svg.addEventListener('pointercancel', endPan);
  // If pointer capture is unavailable, document-level handlers still finish.
  document.addEventListener('pointermove', onPanPointerMove);
  document.addEventListener('pointerup', endPan);
  document.addEventListener('pointercancel', endPan);

  const MIN_W = 200, MAX_W = 6000;
  function zoomBy(factor, clientX, clientY) {
    const cur = svg.getAttribute('viewBox').split(' ').map(Number);
    let [x, y, w, h] = cur;
    const newW = Math.min(MAX_W, Math.max(MIN_W, w * factor));
    const ratio = newW / w;
    const newH = h * ratio;
    let anchorX = x + w / 2, anchorY = y + h / 2;
    if (clientX !== undefined) {
      const rect = svg.getBoundingClientRect ? svg.getBoundingClientRect() : null;
      if (rect && rect.width) {
        anchorX = x + (clientX - rect.left) * (w / rect.width);
        anchorY = y + (clientY - rect.top) * (h / rect.height);
      }
    }
    const newX = anchorX - (anchorX - x) * ratio;
    const newY = anchorY - (anchorY - y) * ratio;
    svg.setAttribute('viewBox', `${newX} ${newY} ${newW} ${newH}`);
  }
  svg.addEventListener('wheel', (e) => { e.preventDefault(); zoomBy(e.deltaY > 0 ? 1.15 : (1 / 1.15), e.clientX, e.clientY); }, { passive: false });
  btnIn.onclick = () => zoomBy(1 / 1.3);
  btnOut.onclick = () => zoomBy(1.3);
  btnReset.onclick = () => {
    // Reset both positions and connected lines. Rights tags are inside
    // node groups, so they follow automatically and cannot become detached.
    originalPositions.forEach((initial, key) => updateNodePosition(key, initial.x, initial.y));
    svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  };

  if (g.truncated) {
    const note = document.createElement('div');
    note.className = 'graphNote';
    note.textContent = `Связей слишком много (оставлено ${MAX_EDGES_PER_NODE} наиболее важных на узел и ${GRAPH_NODE_CAP} узлов всего). Уменьшите глубину или используйте таблицу ниже для полного перечня прямых связей центрального объекта.`;
    wrap.appendChild(note);
  }

  return wrap;
}

function renderDetailTabs(onTabChange) {
  const bar = document.createElement('div');
  bar.className = 'detailTabs';
  [['tree', 'Дерево'], ['graph', 'Граф']].forEach(([tab, label]) => {
    const btn = document.createElement('button');
    btn.className = 'detailTabBtn' + (state.detailTab === tab ? ' active' : '');
    btn.textContent = label;
    btn.onclick = () => { state.detailTab = tab; onTabChange(); };
    bar.appendChild(btn);
  });
  return bar;
}

function renderTable(rows, columns, opts) {
  // columns: [{ key, label, get(row), sortable }]
  // The filter <input> (and the table/toolbar shells) are created exactly ONCE
  // here and never torn down again for the lifetime of this table -- typing a
  // character calls update() below, which only touches the header cells, the
  // tbody rows, and the export button's row count. Rebuilding the whole
  // container (including the input itself) on every keystroke was the earlier
  // approach, and it silently stole focus after each character since the
  // browser can't keep focus on an element that no longer exists.
  const container = document.createElement('div');
  container.className = 'tableWrap';

  const toolbar = document.createElement('div');
  toolbar.className = 'tableToolbar';
  const filterInput = document.createElement('input');
  filterInput.placeholder = 'Фильтр таблицы...';
  filterInput.value = state.tableFilter;
  toolbar.appendChild(filterInput);
  const exportBtn = document.createElement('button');
  toolbar.appendChild(exportBtn);
  container.appendChild(toolbar);

  const tableBody = document.createElement('div');
  tableBody.className = 'tableBody';
  container.appendChild(tableBody);

  const table = document.createElement('table');
  table.className = 'datatable';
  const thead = document.createElement('thead');
  const trh = document.createElement('tr');
  thead.appendChild(trh);
  table.appendChild(thead);
  const tbody = document.createElement('tbody');
  table.appendChild(tbody);
  tableBody.appendChild(table);

  const note = document.createElement('div');
  note.className = 'graphNote';
  tableBody.appendChild(note);

  function computeFilteredSorted() {
    let filtered = rows;
    const q = state.tableFilter.trim().toLowerCase();
    if (q) {
      filtered = rows.filter(r => columns.some(c => String(c.get(r) || '').toLowerCase().includes(q)));
    }
    if (state.tableSort.col) {
      const col = columns.find(c => c.key === state.tableSort.col);
      if (col) {
        filtered = filtered.slice().sort((a, b) => {
          const va = col.get(a), vb = col.get(b);
          if (va < vb) return -1 * state.tableSort.dir;
          if (va > vb) return 1 * state.tableSort.dir;
          return 0;
        });
      }
    }
    return filtered;
  }

  const RENDER_LIMIT = 2000;

  function update() {
    const filtered = computeFilteredSorted();

    trh.innerHTML = '';
    columns.forEach(c => {
      const th = document.createElement('th');
      let arrow = '';
      if (state.tableSort.col === c.key) arrow = state.tableSort.dir === 1 ? ' \u25b2' : ' \u25bc';
      th.textContent = displayColumnLabel(c.label) + arrow;
      th.onclick = () => {
        if (state.tableSort.col === c.key) state.tableSort.dir *= -1;
        else state.tableSort = { col: c.key, dir: 1 };
        update();
      };
      trh.appendChild(th);
    });

    tbody.innerHTML = '';
    filtered.slice(0, RENDER_LIMIT).forEach(r => {
      const tr = document.createElement('tr');
      if (opts.onRowClick) { tr.className = 'rowclick'; tr.onclick = () => opts.onRowClick(r); }
      columns.forEach(c => {
        const td = document.createElement('td');
        if (c.html) td.innerHTML = c.html(r); else td.textContent = displayTableValue(c, r);
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });

    exportBtn.textContent = `Экспорт ${filtered.length} строк в CSV`;
    exportBtn.onclick = () => downloadCsv(opts.filename, filtered, columns.map(c => ({ label: c.label, get: c.get })));

    note.textContent = filtered.length > RENDER_LIMIT
      ? `Показаны первые ${RENDER_LIMIT} из ${filtered.length} строк. Уточните фильтр или экспортируйте весь список в CSV.`
      : '';
  }

  filterInput.oninput = (e) => { state.tableFilter = e.target.value; update(); };

  update();
  return container;
}

function renderIdentity(idx) {

  content.classList.add('content-split');

  content.appendChild(identityInfoCard(idn));

  const edgeIdxs = byIdentity.get(idx) || [];

  content.appendChild(renderDetailTabs(() => renderIdentity(idx)));

  let topContent;
  if (state.detailTab === 'graph') {

      const kind = key[0], kidx = parseInt(key.slice(2), 10);
      if (kind === 'f') selectFolder(kidx, true); else selectIdentity(kidx, true);
    }, () => renderIdentity(idx));
  } else {
    // Every distinct folder this identity directly accesses becomes its OWN tree
    // root -- each expands into its own subfolder structure independently, with
    // no relationship-hop traversal through other identities/groups at all, so
    // there's no way for something outside this identity's own access to appear.
    // computeTopmostRoots collapses a folder-and-several-of-its-own-descendants
    // (common with inherited ACEs recorded per-folder) down to just the topmost
    // one per branch, so a subfolder never shows up as a duplicate second root.
    const allAccessedFolders = Array.from(new Set(allRows.map(r => r.e[0])));
    const rootFolderIndices = computeTopmostRoots(allAccessedFolders)
      .sort((a, b) => state.sortDir * cmpText(DATA.folders[a].path, DATA.folders[b].path));

    topContent = renderFolderTreeView(
      rootFolderIndices,
      (folderIdx) => selectFolder(folderIdx, true),
      null, // no single "selected" folder highlight makes sense from an identity view with multiple roots
      () => renderIdentity(idx)
    );

  const columns = [
    { key: 'path', label: 'Path', get: r => DATA.folders[r.e[0]].path },
    { key: 'rights', label: 'Rights', get: r => RIGHTS_LABELS[r.e[2]] },

    filename: `access_${(idn.name||'identity').replace(/[^a-z0-9]+/gi,'_')}.csv`,
    onRowClick: (r) => selectFolder(r.e[0], true)
  });

  content.appendChild(makeResizableSplitPanes(topContent, bottomContent, 'accessMapIdentityPaneRatio', 0.55));
  updateUrlHash();
}

function folderInfoCard(f) {
  const div = document.createElement('div');
  div.className = 'card';

  // A clickable breadcrumb instead of a flat path string, so a deeply nested
  // folder can jump straight back to any ancestor without going through the
  // sidebar or the tree -- each segment navigates to that exact folder if
  // it's one the scan actually recorded (a virtual, "not scanned" ancestor
  // -- see ensureNode -- has nothing to navigate to, so it's shown plain).
  //
  // Walks the ORIGINAL path string's own backslash positions rather than
  // re-splitting into segments and re-joining with a hardcoded "\\" prefix
  // -- that assumption only holds for UNC-style (\\server\share\...) paths,
  // and silently made every ancestor segment unclickable for any other
  // path convention (a local C:\... root, for instance), since the
  // reconstructed prefix would never match how the path was actually
  // stored.
  const crumbWrap = document.createElement('div');
  crumbWrap.className = 'breadcrumb';
  const path = f.path;
  const isUnc = path.startsWith('\\\\');
  const segments = []; // [text, endIndexInPath]
  let start = 0;
  for (let i = 0; i <= path.length; i++) {
    if (i === path.length || path[i] === '\\') {
      if (i > start) segments.push([path.substring(start, i), i]);
      start = i + 1;
    }
  }

  segments.forEach(([seg, endIdx], i) => {
    const isLast = i === segments.length - 1;
    const span = document.createElement('span');
    span.textContent = seg;
    if (i === 0 && isUnc) {
      // The server name alone (\\server, no share) was never a node in our
      // data to begin with -- nothing to navigate to.
      span.className = 'crumbPlain';
    } else if (isLast) {
      span.className = 'crumbCurrent';
    } else {
      const nodeId = folderPathToIdx.get(path.substring(0, endIdx));
      if (nodeId !== undefined && nodeIsReal(nodeId)) {
        span.className = 'crumbLink';
        span.onclick = () => selectFolder(nodeId, true);
      } else {
        span.className = 'crumbPlain';
      }
    }
    crumbWrap.appendChild(span);
    if (!isLast) {
      const sep = document.createElement('span');
      sep.className = 'crumbSep';
      sep.textContent = '\u203a';
      crumbWrap.appendChild(sep);
    }
  });
  div.appendChild(crumbWrap);

  if (f.broken) {
    const badge = document.createElement('span');
    badge.className = 'badge broken';
    badge.textContent = 'Наследование отключено';
    div.appendChild(badge);
  }

  // Created/Modified/Accessed are optional -- only present if the scan that
  // produced this report captured them (Invoke-NTFSPermissionAudit.ps1
  // 0.5.5+; see the Summary page for whether THIS scan did). Shown the same
  // way an identity's own AD timestamps are shown on its own card -- a
  // blank/absent field just doesn't render, no special casing needed.
  if (DATA.hasFileMetadata) {
    const field = (label, val) => val ? `<span class="field"><b>${esc(label)}:</b> ${esc(fmtDate(val))}</span>` : '';
    const metaHtml = field('Создана', f.created) + field('Изменена', f.modified) + field('Последний доступ', f.accessed);
    if (metaHtml) {
      const metaWrap = document.createElement('div');
      metaWrap.className = 'folderMetaRow';
      metaWrap.innerHTML = metaHtml;
      div.appendChild(metaWrap);
    }
  }
  // fileCount/filesBrokenInheritance are per-folder and only present at all
  // when this folder actually had at least one File row under -IncludeFiles
  // (see DATA.hasFileCounts and Get-OrAdd-Folder's own comment on why this
  // is absence, not a 0/false value, for a folder that was never touched by
  // one) -- shown here unconditionally, since this IS that folder's own
  // page; the tree/list views gate the broken-files badge behind a toggle
  // instead, since space there is much more constrained.
  if (DATA.hasFileCounts && f.fileCount !== undefined) {
    const fileMetaWrap = document.createElement('div');
    fileMetaWrap.className = 'folderMetaRow';
    fileMetaWrap.innerHTML = `<span class="field"><b>Файлов в этой папке:</b> ${f.fileCount}</span>`;
    if (f.filesBrokenInheritance) {
      const fbadge = document.createElement('span');
      fbadge.className = 'badge broken';
      fbadge.textContent = 'Файлы с отключённым наследованием';
      fileMetaWrap.appendChild(fbadge);
    }
    div.appendChild(fileMetaWrap);
  }
  return div;
}

function buildFolderAclGroups(folderIdx) {
  // Splits a folder's access entries into direct rows (e[6] === -1: an
  // ordinary direct grant, OR a group's own listing) and via-group rows
  // (e[6] >= 0: a member shown here only because of that group's grant).
  // A direct row for a Group identity absorbs its own via-group rows as
  // nested children instead of leaving them as separate top-level rows --
  // that flattening (group AND every member listed side by side) is what
  // made a single group grant look like several additional, separately-
  // counted identities with access.
  const edgeIdxs = byFolder.get(folderIdx) || [];
  const byVia = new Map(); // groupIdx -> [ei,...], consumed as each group's row is built
  const directEis = [];
  edgeIdxs.forEach(ei => {
    const via = DATA.edges[ei][6];
    if (via >= 0) {
      if (!byVia.has(via)) byVia.set(via, []);
      byVia.get(via).push(ei);
    } else {
      directEis.push(ei);
    }
  });
  const rows = [];
  directEis.forEach(ei => {
    const e = DATA.edges[ei];
    const identIdx = e[1];
    const idn = DATA.identities[identIdx];
    let children = null;
    if (idn.type === 'Group' && byVia.has(identIdx)) {
      children = byVia.get(identIdx).map(cei => ({ ei: cei, e: DATA.edges[cei] }));
      byVia.delete(identIdx);
    }
    rows.push({ ei, e, children });
  });
  // Any leftover via-group rows whose granting group has no direct row of
  // its own recorded on this exact folder still need to be shown -- surfaced
  // as their own top-level rows (tagged "via <group>") rather than dropped.
  byVia.forEach(eis => eis.forEach(cei => rows.push({ ei: cei, e: DATA.edges[cei], children: null })));
  return rows;
}

function aclRowMatches(row, q) {
  if (!q) return true;
  const hay = (r) => {
    const e = r.e, idn = DATA.identities[e[1]];
    return [idn.name, idn.type, RIGHTS_LABELS[e[2]]].join(' ').toLowerCase();
  };
  if (hay(row).includes(q)) return true;
  return !!(row.children && row.children.some(c => hay(c).includes(q)));
}

function renderAclRow(row, onIdentityClick, isChild) {
  const e = row.e;
  const idn = DATA.identities[e[1]];
  const div = document.createElement('div');
  div.className = 'aclRow';
  const statusClass = identityStatusRowClass(idn);
  if (statusClass) div.classList.add(statusClass);

  const toggle = document.createElement('span');
  toggle.className = 'treeToggle';
  toggle.textContent = '\u00a0\u00a0';
  div.appendChild(toggle);

  const name = document.createElement('span');
  name.className = 'aclName';
  name.textContent = idn.name || '(неизвестно)';
  const stateText = identityStatusText(idn);
  name.title = (idn.name || '') + (stateText ? ' · ' + stateText : '');
  div.appendChild(name);
  appendIdentityStatusBadges(div, idn);

  const type = document.createElement('span');
  type.className = 'aclType';
  type.textContent = displayIdentityType(idn.type);
  div.appendChild(type);

  const rights = document.createElement('span');
  rights.className = 'pill ' + (e[5] ? 'deny' : (e[3] ? 'inherited' : 'explicit'));
  rights.textContent = displayRight(RIGHTS_LABELS[e[2]]) + (e[5] ? ' (Запрет)' : '');
  div.appendChild(rights);
  if (!isChild && idn.type === 'Group' && (!row.children || row.children.length === 0)) {
    const groupHint = document.createElement('span');
    groupHint.className = 'aclViaNote';
    groupHint.textContent = 'Состав группы не загружен';
    groupHint.title = 'Для отображения участников нужен аудит с -ExpandGroups; проверьте исключения -ExpandGroupsExclude и доступность AD.';
    div.insertBefore(groupHint, rights);
  }

  if (isChild) {
    const tag = document.createElement('span');
    tag.className = 'aclViaNote';
    tag.textContent = 'участник';
    div.appendChild(tag);
  } else if (e[6] >= 0) {
    // An orphaned via-group row: its granting group has no direct row of its
    // own on this exact folder, so it's shown flat with a "via" tag instead
    // of nested (there's no parent row here to nest it under).
    const tag = document.createElement('span');
    tag.className = 'aclViaNote';
    tag.textContent = 'через ' + (DATA.identities[e[6]].name || '?');
    div.appendChild(tag);
  }

  div.onclick = () => onIdentityClick(e[1]);

  const wrap = document.createElement('div');
  wrap.appendChild(div);

  if (row.children && row.children.length) {
    const childHost = document.createElement('div');
    childHost.className = 'aclChildren';
    childHost.style.display = 'none';
    row.children.forEach(c => childHost.appendChild(renderAclRow(c, onIdentityClick, true)));
    wrap.appendChild(childHost);
    toggle.classList.add('hasChildren');
    toggle.textContent = '\u25b8';
    // FSA_RU_GROUP_CONTROLS_EMBEDDED_V2
    const membersButton = document.createElement('button');
    membersButton.type = 'button';
    membersButton.className = 'chipBtn';
    membersButton.style.fontSize = '11px';
    membersButton.textContent = 'Участники: ' + row.children.length + ' ▸';
    membersButton.title = 'Показать или скрыть участников группы';
    div.insertBefore(membersButton, rights);
    let expanded = false;
    const setExpanded = (v) => {
      expanded = v;
      childHost.style.display = expanded ? 'block' : 'none';
      toggle.textContent = expanded ? '\u25be' : '\u25b8';
      membersButton.textContent = 'Участники: ' + row.children.length + (expanded ? ' ▾' : ' ▸');
    };
    toggle.onclick = (ev) => { ev.stopPropagation(); setExpanded(!expanded); };
    membersButton.onclick = (ev) => { ev.stopPropagation(); setExpanded(!expanded); };
    wrap._setExpanded = setExpanded; // used below to auto-expand a group whose members matched a filter
  }
  return wrap;
}

function renderFolderAclList(folderIdx, onIdentityClick) {
  const rows = buildFolderAclGroups(folderIdx);
  const counts = folderAccessCounts(folderIdx);
  const allFlatForExport = (byFolder.get(folderIdx) || []).map(ei => ({ ei, e: DATA.edges[ei] }));

  const summary = document.createElement('div');
  summary.className = 'aclSummary';
  summary.textContent = counts.viaGroup > 0
    ? `${counts.direct} прямых записей доступа · ${counts.viaGroup} записей через членство в группах (раскройте группу для просмотра участников)`
    : `${counts.direct} прямых записей доступа`;
  wrap.appendChild(summary);

  const toolbar = document.createElement('div');
  toolbar.className = 'aclToolbar';
  const filterInput = document.createElement('input');
  filterInput.placeholder = 'Фильтр списка...';
  toolbar.appendChild(filterInput);
  toolbar.style.flexWrap = 'wrap';
  filterInput.style.minWidth = '180px';
  const expandAllGroupsBtn = document.createElement('button');
  expandAllGroupsBtn.type = 'button';
  expandAllGroupsBtn.className = 'chipBtn';
  expandAllGroupsBtn.textContent = 'Развернуть все группы';
  toolbar.appendChild(expandAllGroupsBtn);
  const collapseAllGroupsBtn = document.createElement('button');
  collapseAllGroupsBtn.type = 'button';
  collapseAllGroupsBtn.className = 'chipBtn';
  collapseAllGroupsBtn.textContent = 'Свернуть все группы';
  toolbar.appendChild(collapseAllGroupsBtn);
  const exportBtn = document.createElement('button');
  exportBtn.textContent = `Экспорт ${allFlatForExport.length} строк в CSV`;
  exportBtn.onclick = () => downloadCsv(
    `access_${DATA.folders[folderIdx].path.replace(/[^a-z0-9]+/gi, '_')}.csv`,
    allFlatForExport,
    [
      { label: 'Identity', get: r => DATA.identities[r.e[1]].name },
      { label: 'Type', get: r => DATA.identities[r.e[1]].type },
      { label: 'Rights', get: r => RIGHTS_LABELS[r.e[2]] },
      { label: 'Inherited', get: r => r.e[3] ? 'Yes' : 'No' },
      { label: 'Deny', get: r => r.e[5] ? 'Yes' : 'No' },
      { label: 'Granted via group', get: r => r.e[6] >= 0 ? DATA.identities[r.e[6]].name : '' },
      { label: 'Enabled', get: r => fmtBool(DATA.identities[r.e[1]].enabled) }
    ]
  );
  toolbar.appendChild(exportBtn);
  wrap.appendChild(toolbar);

  const host = document.createElement('div');
  host.className = 'aclHost';
  wrap.appendChild(host);
  let renderedGroups = [];
  expandAllGroupsBtn.onclick = () => {
    if (!renderedGroups.length) {
      window.alert('Для этой папки состав групп не загружен. Выполните аудит с -ExpandGroups.');
      return;
    }
    renderedGroups.forEach(n => n._setExpanded(true));
  };
  collapseAllGroupsBtn.onclick = () => renderedGroups.forEach(n => n._setExpanded(false));

  function rebuild() {
    host.innerHTML = '';
    renderedGroups = [];
    const q = filterInput.value.trim().toLowerCase();
    const visible = rows.filter(r => aclRowMatches(r, q));
    visible.forEach(r => {
      const node = renderAclRow(r, onIdentityClick, false);
      host.appendChild(node);
      if (node._setExpanded) renderedGroups.push(node);
      if (q && node._setExpanded) {
        const idn = DATA.identities[r.e[1]];
        const parentMatches = [idn.name, idn.type, RIGHTS_LABELS[r.e[2]]].join(' ').toLowerCase().includes(q);
        if (!parentMatches) node._setExpanded(true); // the match was in a member, not the group itself -- expand so it's visible
      }
    });
    if (visible.length === 0) {
      const none = document.createElement('div');
      none.className = 'graphNote';
      none.textContent = 'Совпадений нет.';
      host.appendChild(none);
    }
  }
  filterInput.oninput = rebuild;
  rebuild();

  return wrap;
}

function renderFolder(idx) {
  const f = DATA.folders[idx];
  const content = document.getElementById('content');
  content.classList.add('content-split');
  content.innerHTML = '';
  content.appendChild(folderInfoCard(f));

      }, () => renderFolder(idx))
    : renderFolderTreeView(
        [idx],
        (folderIdx) => selectFolder(folderIdx, true),

}
