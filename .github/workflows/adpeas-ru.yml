name: "adPEAS RU · Windows PowerShell 5.1"
on:
  push:
    branches:
      - adpeas-ru-2.9.0
    paths:
      - "adPEAS-RU/Import-adPEAS-RU.ps1"
      - "adPEAS-RU/Localize-RU.ps1"
      - "adPEAS-RU/Localization/**"
      - "adPEAS-RU/Run-AD-Audit-RU.ps1"
      - "adPEAS-RU/Tests/**"
      - "adPEAS-RU/README_RU.md"
      - "adPEAS-RU/docs/ru-RU/**"
      - "adPEAS-RU/ROADMAP_RU.md"
      - ".github/workflows/adpeas-ru.yml"
  pull_request:
    branches:
      - adpeas-ru-2.9.0
    paths:
      - "adPEAS-RU/Localization/**"
      - "adPEAS-RU/Localize-RU.ps1"
      - "adPEAS-RU/Tests/**"
      - "adPEAS-RU/docs/ru-RU/**"
      - "adPEAS-RU/README_RU.md"
      - "adPEAS-RU/ROADMAP_RU.md"
      - ".github/workflows/adpeas-ru.yml"
  workflow_dispatch:
concurrency:
  group: adpeas-ru-build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  import-and-verify:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Checkout project branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch pinned upstream, localize and build
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          .\adPEAS-RU\Import-adPEAS-RU.ps1
      - name: Offline tests (PowerShell 5.1)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          .\adPEAS-RU\Tests\Invoke-CI.ps1
          .\adPEAS-RU\Tests\Test-Import.ps1
          .\adPEAS-RU\Tests\Test-RunnerOffline.ps1
          .\adPEAS-RU\Tests\Test-RussianReportCards.ps1
          .\adPEAS-RU\Tests\Test-RussianReportHelp.ps1
          .\adPEAS-RU\Tests\Test-RemediationTranslations.ps1
          .\adPEAS-RU\Tests\Test-FullTechnicalRU.ps1
          .\adPEAS-RU\Tests\Test-ReportSourceInventory.ps1
          .\adPEAS-RU\Tests\Test-ObservedFindingRU.ps1
          .\adPEAS-RU\Tests\Test-FindingTranslationCoverage392.ps1
          .\adPEAS-RU\Tests\Test-SourceFieldParity392.ps1
          .\adPEAS-RU\Tests\Test-StageDVerifiedAttackRU.ps1
          .\adPEAS-RU\Tests\Test-StageD2VerifiedFieldsRU.ps1
          .\adPEAS-RU\Tests\Test-StageD3VerifiedCoreRU.ps1
          .\adPEAS-RU\Tests\Test-StageD4VerifiedCoreRU.ps1
          .\adPEAS-RU\Tests\Test-StageD5VerifiedCoreRU.ps1
          .\adPEAS-RU\Tests\Test-StageD6VerifiedCoreRU.ps1
          .\adPEAS-RU\Tests\Test-StageD7VerifiedCoreRU.ps1
          .\adPEAS-RU\Tests\Test-StageD8VerifiedCoreRU.ps1
          .\adPEAS-RU\Tests\Test-StageD9VerifiedCoreRU.ps1
          .\adPEAS-RU\Tests\Test-StageD10VerifiedCoreRU.ps1
          .\adPEAS-RU\Tests\Test-StageD11VerifiedCoreRU.ps1
          .\adPEAS-RU\Tests\Test-StageD12VerifiedCoreRU.ps1
          .\adPEAS-RU\Tests\Test-StageD13VerifiedCoreRU.ps1
          .\adPEAS-RU\Tests\Test-StageD14VerifiedCoreRU.ps1
          .\adPEAS-RU\Tests\Test-StageD15VerifiedCoreRU.ps1
          .\adPEAS-RU\Tests\Test-StageD16VerifiedCoreRU.ps1
          .\adPEAS-RU\Tests\Test-StageD17VerifiedCoreRU.ps1
          .\adPEAS-RU\Tests\Test-StageD18VerifiedCoreRU.ps1
          .\adPEAS-RU\Tests\Test-StageD19VerifiedCoreRU.ps1
          .\adPEAS-RU\Tests\Test-UsageDocumentationRU.ps1
          .\adPEAS-RU\Tests\Test-DOC2CoreFunctionsRU.ps1
          .\adPEAS-RU\Tests\Test-DOC2HelperFunctionsRU.ps1
          .\adPEAS-RU\Tests\Test-DOC2SetModulesRU.ps1
          .\adPEAS-RU\Tests\Test-DOC2SecurityChecksRU.ps1
          .\adPEAS-RU\Tests\Test-DOC3TechnicalDocumentationRU.ps1
          .\adPEAS-RU\Tests\Test-DOC4aRuntimeMessagesRU.ps1
          .\adPEAS-RU\Tests\Test-DOC4bReportEvidenceRU.ps1
          .\adPEAS-RU\Tests\Test-CheckSecureMessagesRU.ps1
          .\adPEAS-RU\Tests\Test-StageAVisibleMessages.ps1
          .\adPEAS-RU\Tests\Test-StageBVisibleMessages.ps1
          .\adPEAS-RU\Tests\Test-StageCVisibleMessages.ps1
      - name: Extended report text coverage (offline)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          .\\adPEAS-RU\\Tests\\Test-AdditionalCheckMessages.ps1
      - name: JavaScript template syntax check
        shell: pwsh
        run: |
          $jsPath = ".\adPEAS-RU\src\modules\Reporting\templates\report-scripts.js"
          $source = Get-Content -LiteralPath $jsPath -Raw -Encoding UTF8
          # Report JS contains literal {{PLACEHOLDERS}} until Export-HTMLReport expands them.
          $runnable = [regex]::Replace($source, '\{\{[A-Z0-9_]+\}\}', 'null')
          $tempJs = Join-Path $env:RUNNER_TEMP "adpeas-expanded-report-check.js"
          [IO.File]::WriteAllText($tempJs, $runnable, (New-Object System.Text.UTF8Encoding($false)))
          node --check $tempJs
      - name: DOC4b synthetic HTML/DOM value translations
        shell: pwsh
        run: |
          node .\adPEAS-RU\Tests\Test-DOC4bHtmlFixture.js
      - name: Package verified RU build for public download
        if: github.event_name != 'pull_request'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $archive = "adPEAS-RU-2.9.0-DOC4b-20261113.zip"
          if (Test-Path -LiteralPath $archive) { Remove-Item -LiteralPath $archive -Force }
          Compress-Archive -Path "adPEAS-RU" -DestinationPath $archive -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("adPEAS-RU-2.9.0-DOC4b-20261113.sha256", "$hash  $archive"+[Environment]::NewLine, (New-Object Text.UTF8Encoding($false)))
          Write-Host "RU BUILD ZIP SHA-256: $hash"
      - name: Upload full source and build artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: adPEAS-RU-2.9.0-full-source
          path: |
            adPEAS-RU
            adPEAS-RU-2.9.0-DOC4b-20261113.zip
            adPEAS-RU-2.9.0-DOC4b-20261113.sha256
          retention-days: 7
      - name: Commit complete project to dedicated branch
        if: github.event_name != 'pull_request'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- adPEAS-RU adPEAS-RU-2.9.0-DOC4b-20261113.zip adPEAS-RU-2.9.0-DOC4b-20261113.sha256
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m "adPEAS-RU: full pinned v2.9.0 sources, localized build and verified tests"
            if ($LASTEXITCODE -ne 0) { throw "git commit failed" }
            $remoteRef = (git ls-remote origin "refs/heads/adpeas-ru-2.9.0") -split "\s+" | Select-Object -First 1
            if ($remoteRef -ne $env:GITHUB_SHA) {
              Write-Host "A newer source revision is available; skip pushing this superseded build."
            } else {
              git push origin HEAD:adpeas-ru-2.9.0
              if ($LASTEXITCODE -ne 0) { throw "git push failed" }
            }
          }
