name: "adPEAS RU · Windows PowerShell 5.1"
on:
  push:
    branches:
      - adpeas-ru-2.9.0
    paths:
      - "adPEAS-RU/Import-adPEAS-RU.ps1"
      - "adPEAS-RU/Localize-RU.ps1"
      - "adPEAS-RU/Localization/**"
      - "adPEAS-RU/Run-AD-Audit-RU.ps1"
      - "adPEAS-RU/Tests/**"
      - ".github/workflows/adpeas-ru.yml"
  workflow_dispatch:
concurrency:
  group: adpeas-ru-build
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  import-and-verify:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Checkout project branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch pinned upstream, localize and build
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          .\adPEAS-RU\Import-adPEAS-RU.ps1
      - name: Offline tests (PowerShell 5.1)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          .\adPEAS-RU\Tests\Invoke-CI.ps1
          .\adPEAS-RU\Tests\Test-Import.ps1
          .\adPEAS-RU\Tests\Test-RunnerOffline.ps1
          .\adPEAS-RU\Tests\Test-RussianReportCards.ps1
          .\adPEAS-RU\Tests\Test-RussianReportHelp.ps1
          .\adPEAS-RU\Tests\Test-RemediationTranslations.ps1
          .\adPEAS-RU\Tests\Test-FullTechnicalRU.ps1
          .\adPEAS-RU\Tests\Test-ReportSourceInventory.ps1
          .\adPEAS-RU\Tests\Test-ObservedFindingRU.ps1
          .\adPEAS-RU\Tests\Test-FindingTranslationCoverage392.ps1
          .\adPEAS-RU\Tests\Test-SourceFieldParity392.ps1
          .\adPEAS-RU\Tests\Test-CheckSecureMessagesRU.ps1
          .\adPEAS-RU\Tests\Test-StageAVisibleMessages.ps1
      - name: Extended report text coverage (offline)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          .\\adPEAS-RU\\Tests\\Test-AdditionalCheckMessages.ps1
      - name: JavaScript template syntax check
        shell: pwsh
        run: |
          $jsPath = ".\adPEAS-RU\src\modules\Reporting\templates\report-scripts.js"
          $source = Get-Content -LiteralPath $jsPath -Raw -Encoding UTF8
          # Report JS contains literal {{PLACEHOLDERS}} until Export-HTMLReport expands them.
          $runnable = [regex]::Replace($source, '\{\{[A-Z0-9_]+\}\}', 'null')
          $tempJs = Join-Path $env:RUNNER_TEMP "adpeas-expanded-report-check.js"
          [IO.File]::WriteAllText($tempJs, $runnable, (New-Object System.Text.UTF8Encoding($false)))
          node --check $tempJs
      - name: Package verified RU build for public download
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $archive = "adPEAS-RU-2.9.0-STAGE-A-20261111.zip"
          if (Test-Path -LiteralPath $archive) { Remove-Item -LiteralPath $archive -Force }
          Compress-Archive -Path "adPEAS-RU" -DestinationPath $archive -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("adPEAS-RU-2.9.0-STAGE-A-20261111.sha256", "$hash  $archive"+[Environment]::NewLine, (New-Object Text.UTF8Encoding($false)))
          Write-Host "RU BUILD ZIP SHA-256: $hash"
      - name: Upload full source and build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: adPEAS-RU-2.9.0-full-source
          path: |
            adPEAS-RU
            adPEAS-RU-2.9.0-STAGE-A-20261111.zip
            adPEAS-RU-2.9.0-STAGE-A-20261111.sha256
          retention-days: 7
      - name: Commit complete project to dedicated branch
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- adPEAS-RU adPEAS-RU-2.9.0-STAGE-A-20261111.zip adPEAS-RU-2.9.0-STAGE-A-20261111.sha256
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m "adPEAS-RU: full pinned v2.9.0 sources, localized build and verified tests"
            if ($LASTEXITCODE -ne 0) { throw "git commit failed" }
            $remoteRef = (git ls-remote origin "refs/heads/adpeas-ru-2.9.0") -split "\s+" | Select-Object -First 1
            if ($remoteRef -ne $env:GITHUB_SHA) {
              Write-Host "A newer source revision is available; skip pushing this superseded build."
            } else {
              git push origin HEAD:adpeas-ru-2.9.0
              if ($LASTEXITCODE -ne 0) { throw "git push failed" }
            }
          }
