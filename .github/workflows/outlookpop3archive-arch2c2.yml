name: OutlookPOP3Archive ARCH2c2 private TEMP ACL and lease full Windows PS5.1 CI
on:
  push:
    branches: [feature/outlookpop3archive-2.6.5-arch2c2-acl-lease-crash-fence]
    paths: ['OutlookPOP3Archive/**', '.github/workflows/outlookpop3archive-arch2c2.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  full-ci:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
        working-directory: OutlookPOP3Archive
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester and PSScriptAnalyzer
        run: |
          $ErrorActionPreference='Stop'
          [Net.ServicePointManager]::SecurityProtocol=[Net.SecurityProtocolType]::Tls12
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force
          Install-Module Pester -MinimumVersion 5.0 -Scope CurrentUser -Force -SkipPublisherCheck -AllowClobber
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -AllowClobber
      - name: Mandatory original Windows PowerShell 5.1 CI gates
        run: |
          $ErrorActionPreference='Stop'
          .\Invoke-CI.ps1 -ExpectedBuild '2.6.3-PREVIEW1'
          if($LASTEXITCODE -ne 0){throw 'Original CI gates failed.'}
      - name: ARCH2c2 mandatory protected workspace, lease and no-writer gates
        run: |
          $ErrorActionPreference='Stop'
          $safety=Get-Content -LiteralPath 'Core/Archive/ARCH2c2TempSafety.ps1' -Raw -Encoding UTF8
          $witness=Get-Content -LiteralPath 'Core/Archive/ARCH2bSemanticWitness.ps1' -Raw -Encoding UTF8
          $tests=Get-Content -LiteralPath 'Tests/Archive/ARCH2c2TempSafety.Tests.ps1' -Raw -Encoding UTF8
          $docs=Get-Content -LiteralPath 'docs/2.6.5-arch2c2-private-acl-lease.md' -Raw -Encoding UTF8
          $entry=Get-Content -LiteralPath 'OutlookPOP3Archive.ps1' -Raw -Encoding UTF8
          $rel=Get-Content -LiteralPath 'RELEASE.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          if(-not $safety.Contains('SetAccessRuleProtection($true,$false)') -or
             -not $safety.Contains('[IO.FileShare]::None') -or
             -not $safety.Contains('Assert-OPA265ARCH2c2PrivateWorkspaceAcl') -or
             -not $safety.Contains('Directory]::Delete($workspacePath,$false)') -or
             -not $witness.Contains('New-OPA265ARCH2c2PrivateWorkspace') -or
             -not $witness.Contains('Close-OPA265ARCH2c2PrivateWorkspace') -or
             -not $witness.Contains('Get-OPA265ARCH2c2ObservedLeaseState') -or
             -not $entry.Contains('Assert-OPA265ARCH2aDevelopmentWriterClosed') -or
             -not $tests.Contains('simulated interruption') -or
             -not $docs.Contains('ARCH2c2') -or
             [int]$rel.Verification.ExpectedPesterTests -ne 3778 -or
             [int]$rel.Verification.ExpectedTestContainers -ne 127) {
             throw 'ARCH2c2 NTFS-ACL/lease/orphan policy gate incomplete.'
          }
          Write-Host 'PASS ARCH2c2 protected NTFS ACL, lease, read-only orphan and closed DEV writer gates.'
      - name: Package only OutlookPOP3Archive from tested commit and calculate SHA-256
        run: |
          $ErrorActionPreference='Stop'
          $project=(Get-Location).Path
          $short=$env:GITHUB_SHA.Substring(0,8).ToLowerInvariant()
          $base='OutlookPOP3Archive-2.6.5-ARCH2c2-dev-g'+$short
          $out=Join-Path $env:RUNNER_TEMP 'OPA-ARCH2c2-Package'
          $stageParent=Join-Path $env:RUNNER_TEMP 'OPA-ARCH2c2-Stage'
          $staged=Join-Path $stageParent $base
          [void][IO.Directory]::CreateDirectory($out)
          [void][IO.Directory]::CreateDirectory($staged)
          foreach($f in @('.editorconfig','.gitignore','.psscriptanalyzer.psd1','RELEASE.json','MANIFEST.txt','README.md','CHANGELOG.md','OutlookPOP3Archive.ps1','OutlookPOP3Archive.Worker.ps1','Invoke-CI.ps1','Invoke-OPAWorkerSelfTest.ps1','New-OPABuildPackage.ps1')){
            $src=Join-Path $project $f
            if(-not (Test-Path -LiteralPath $src -PathType Leaf)){throw ('Required project file absent: '+$f)}
            Copy-Item -LiteralPath $src -Destination (Join-Path $staged $f)
          }
          foreach($dir in @('Core','Tests','docs')){
            $dirPath=Join-Path $project $dir
            foreach($f in @(Get-ChildItem -LiteralPath $dirPath -Recurse -File -Force)){
              $extension=if($dir -eq 'docs'){'.md'}else{'.ps1'}
              if($f.Extension -cne $extension -or
                 ($dir -eq 'Tests' -and $f.Name -notmatch '\.Tests\.ps1$') -or
                 (($f.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0)){throw ('Unallowlisted file: '+$f.FullName)}
              $relative=$f.FullName.Substring($project.Length).TrimStart([char[]]@('\','/'))
              $dst=Join-Path $staged $relative
              [void][IO.Directory]::CreateDirectory([IO.Path]::GetDirectoryName($dst))
              Copy-Item -LiteralPath $f.FullName -Destination $dst
            }
          }
          $info=[ordered]@{Schema='OPA265.ARCH2c2.BuildInfo.1';DevelopmentGate='2.6.5-ARCH2c2';SourceCommit=$env:GITHUB_SHA;WindowsPowerShell51CiPassed=$true;PesterAndPSScriptAnalyzerRequired=$true;LiveOutlookTestInCi=$false;ArchiveResumeAutoClosed=$true;ProductionReady=$false}
          [IO.File]::WriteAllText((Join-Path $staged 'BUILD-INFO.json'),(ConvertTo-Json -InputObject $info -Depth 4),(New-Object Text.UTF8Encoding($false)))
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip=Join-Path $out ($base+'.zip')
          [IO.Compression.ZipFile]::CreateFromDirectory($stageParent,$zip,[IO.Compression.CompressionLevel]::Optimal,$false)
          $hash=(Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $out ($base+'.sha256')),($hash+'  '+[IO.Path]::GetFileName($zip)+[char]10),(New-Object Text.UTF8Encoding($false)))
          Write-Host ('ARCH2c2 ZIP SHA256: '+$hash)
      - name: Upload tested project-only ARCH2c2 DEV ZIP
        uses: actions/upload-artifact@v4
        with:
          name: OutlookPOP3Archive-2.6.5-ARCH2c2-dev
          path: |
            ${{ runner.temp }}/OPA-ARCH2c2-Package/*.zip
            ${{ runner.temp }}/OPA-ARCH2c2-Package/*.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Publish public test-only ARCH2c2 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $short=$env:GITHUB_SHA.Substring(0,8).ToLowerInvariant()
          $base='OutlookPOP3Archive-2.6.5-ARCH2c2-dev-g'+$short
          $dir=Join-Path $env:RUNNER_TEMP 'OPA-ARCH2c2-Package'
          $zip=Join-Path $dir ($base+'.zip')
          $sha=Join-Path $dir ($base+'.sha256')
          if(-not (Test-Path -LiteralPath $zip -PathType Leaf) -or -not (Test-Path -LiteralPath $sha -PathType Leaf)){throw 'ZIP/checksum absent'}
          $tag='outlookpop3archive-2.6.5-arch2c2-dev-g'+$short
          gh release create $tag $zip $sha --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title ('OutlookPOP3Archive 2.6.5-ARCH2c2 DEV '+$short) --notes 'ARCH2c2 DEV: NTFS private DACL (current Windows user and SYSTEM), exclusive FileShare.None lease while SaveAsFile hashes bytes, nonrecursive fail-closed cleanup and strictly read-only postcrash lease inventory. 14 new synthetic tests; Windows PS5.1 mandatory 3778 Pester in 127 containers, PSScriptAnalyzer/BOM/JSON. ARCH2a blocks Archive Resume Auto even WhatIf; never touch production PST. No live Outlook acceptance. Project-only ZIP and SHA-256.' --prerelease
          if($LASTEXITCODE -ne 0){throw 'GitHub prerelease publication failed'}
