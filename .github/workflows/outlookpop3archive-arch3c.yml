name: OutlookPOP3Archive ARCH3c synthetic immutable original OperationJournal Windows PS5.1 CI
on:
  push:
    branches: [feature/outlookpop3archive-2.6.5-arch3c-durable-journal-adapter]
    paths: ['OutlookPOP3Archive/**', '.github/workflows/outlookpop3archive-arch3c.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  full-ci:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
        working-directory: OutlookPOP3Archive
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester and PSScriptAnalyzer
        run: |
          $ErrorActionPreference='Stop'
          [Net.ServicePointManager]::SecurityProtocol=[Net.SecurityProtocolType]::Tls12
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force
          Install-Module Pester -MinimumVersion 5.0 -Scope CurrentUser -Force -SkipPublisherCheck -AllowClobber
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -AllowClobber
      - name: Focused ARCH2d3 fault scenarios and original semantic witnesses
        run: |
          $ErrorActionPreference='Stop'
          $paths=@(
            'Tests/Archive/ARCH2c4RealPop3OneShot.Tests.ps1',
            'Tests/Archive/ARCH2c4aRuntimeDependencies.Tests.ps1',
            'Tests/Archive/ARCH2dBoundedRealBatch10.Tests.ps1',
            'Tests/Archive/ARCH2d3FaultMatrix.Tests.ps1',
            'Tests/Archive/ARCH2d4ReadOnlyForensics.Tests.ps1',
            'Tests/Archive/ARCH2d5RealBatch100.Tests.ps1',
            'Tests/Archive/ARCH3aReuseExistingArchiver.Tests.ps1',
            'Tests/Archive/ARCH3bOriginalMoverContract.Tests.ps1',
            'Tests/Archive/ARCH3cDurableOriginalOperationJournal.Tests.ps1',
            'Tests/Archive/ARCH2bSemanticWitness.Tests.ps1',
            'Tests/Archive/ARCH2c1TempIsolation.Tests.ps1',
            'Tests/Archive/ARCH2c2TempSafety.Tests.ps1'
          )
          $result=Invoke-Pester -Path $paths -Output Detailed -PassThru
          if($result.Result -ne 'Passed' -or $result.FailedCount -ne 0 -or $result.SkippedCount -ne 0){
            throw ('ARCH3c focused Pester gate failed: '+$result.Result)
          }
          Write-Host ('PASS ARCH3c focused Pester '+$result.PassedCount+' tests.')
      - name: Mandatory original Windows PowerShell 5.1 CI gates
        run: |
          $ErrorActionPreference='Stop'
          .\Invoke-CI.ps1 -ExpectedBuild '2.6.3-PREVIEW1'
          if($LASTEXITCODE -ne 0){throw 'Original CI gates failed.'}
      - name: ARCH2d exactly ten immutable semantic claims before real COM Move and independent restart fence
        run: |
          $ErrorActionPreference='Stop'
          $core=Get-Content -LiteralPath 'Core/Archive/ARCH2dBatchCore.ps1' -Raw -Encoding UTF8
          $policy=Get-Content -LiteralPath 'Core/Archive/ARCH2dBatchPolicy.ps1' -Raw -Encoding UTF8
          $entry=Get-Content -LiteralPath 'Invoke-ARCH2d.ps1' -Raw -Encoding UTF8
          $main=Get-Content -LiteralPath 'OutlookPOP3Archive.ps1' -Raw -Encoding UTF8
          $docs=Get-Content -LiteralPath 'docs/2.6.5-arch2d-bounded-real-batch10.md' -Raw -Encoding UTF8
          $tests=Get-Content -LiteralPath 'Tests/Archive/ARCH2dBoundedRealBatch10.Tests.ps1' -Raw -Encoding UTF8
          $rel=Get-Content -LiteralPath 'RELEASE.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          $globalIdx=$core.IndexOf('Write-OPA265ARCH2c4JsonOnce -Path $layout.GlobalClaimPath')
          $itemIdx=$core.IndexOf('Write-OPA265ARCH2c4JsonOnce -Path (Get-OPA265ARCH2dItemClaimPath')
          $moveIdx=$core.IndexOf('$item.Move($target)')
          if(([regex]::Matches($core,'\$item\.Move\(\$target\)')).Count -ne 1 -or
             $globalIdx -lt 0 -or $itemIdx -le $globalIdx -or $moveIdx -le $itemIdx -or
             $core -cnotmatch 'Get-OPA265ARCH2bMailSemanticWitness' -or
             $core -cnotmatch 'Compare-OPA265ARCH2bMailSemanticWitness' -or
             $core -cnotmatch 'Get-OPA265ARCH2dTargetFolder' -or
             $core -cmatch '\.(Delete|Copy|Send)\s*\(' -or
             $policy -cnotmatch 'Get-OPA265ARCH2dReconcileDecision' -or
             $policy -cnotmatch 'ARCH2c4OneShotCore\.ps1' -or
             $policy -cnotmatch 'AutomaticRetryAllowed=\$false' -or
             $entry -cnotmatch 'Invoke-OPA265ARCH2dBatch' -or
             $main -cnotmatch 'Assert-OPA265ARCH2aDevelopmentWriterClosed' -or
             $docs -cnotmatch 'ARCH2d' -or
             $tests -cnotmatch 'independently approves exact ten semantic matches' -or
             [int]$rel.Verification.ExpectedPesterTests -ne 4174 -or
             [int]$rel.Verification.ExpectedTestContainers -ne 137){
              throw 'ARCH2d real batch10 fail-closed, SHA witness, claim order or inventory gate incomplete.'
          }
          Write-Host 'PASS ARCH2d batch10 SHA256-original, global then per-item claim before Move, no retry, original CLI closed.'
      - name: ARCH2d3 bounded synthetic-only failpoint model and no historical PST access gate
        run: |
          $ErrorActionPreference='Stop'
          $sim=Get-Content -LiteralPath 'Core/Diagnostics/ARCH2d3FaultSimulator.ps1' -Raw -Encoding UTF8
          $entry=Get-Content -LiteralPath 'Invoke-ARCH2d3.ps1' -Raw -Encoding UTF8
          $tests=Get-Content -LiteralPath 'Tests/Archive/ARCH2d3FaultMatrix.Tests.ps1' -Raw -Encoding UTF8
          $doc=Get-Content -LiteralPath 'docs/2.6.5-arch2d3-fault-injection.md' -Raw -Encoding UTF8
          $realCore=Get-Content -LiteralPath 'Core/Archive/ARCH2dBatchCore.ps1' -Raw -Encoding UTF8
          $realEntry=Get-Content -LiteralPath 'Invoke-ARCH2d.ps1' -Raw -Encoding UTF8
          $main=Get-Content -LiteralPath 'OutlookPOP3Archive.ps1' -Raw -Encoding UTF8
          $rel=Get-Content -LiteralPath 'RELEASE.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          if($sim -cnotmatch 'Write-OPA265ARCH2c4JsonOnce -Path \$globalPath' -or
             $sim -cnotmatch 'Write-OPA265ARCH2c4JsonOnce -Path \$row\.ClaimPath' -or
             $sim -cnotmatch 'Get-OPA265ARCH2dReconcileDecision -ItemResults' -or
             $sim -cnotmatch 'foreach\(\$ord in @\(1,5,10\)\)' -or
             $sim -cnotmatch 'Cases=\$all.Count' -or
             $sim -cmatch 'GetActiveObject\s*\(' -or
             $sim -cmatch '\.Move\s*\(' -or
             $sim -cmatch '\.AddStoreEx\s*\(' -or
             $sim -cmatch '\.SaveAsFile\s*\(' -or
             $entry -cnotmatch 'Invoke-OPA265ARCH2d3SyntheticMatrix' -or
             $entry -cmatch 'GetActiveObject\s*\(' -or
             $tests -cnotmatch '57-case 1/5/10 failure injection' -or
             $tests -cnotmatch 'ComAppliesThenThrows' -or
             $doc -cnotmatch '57' -or
             $realCore -cnotmatch 'GlobalClaimPath' -or
             $realEntry -cnotmatch 'Invoke-OPA265ARCH2dBatch' -or
             $main -cnotmatch 'Assert-OPA265ARCH2aDevelopmentWriterClosed' -or
             [int]$rel.Verification.ExpectedPesterTests -ne 4174 -or
             [int]$rel.Verification.ExpectedTestContainers -ne 137){
             throw 'ARCH2d3 synthetic fault matrix/no Outlook/real writer compatibility gate failed.'
          }
          Write-Host 'PASS ARCH2d3 57-case 1/5/10 no-retry, actual force-flushed JSON writer, no COM/PST, original ARCH2d untouched.'
      - name: ARCH2d4 exact historical pinned evidence and read-only semantic forensic gates
        run: |
          $ErrorActionPreference='Stop'
          $evidence=Get-Content -LiteralPath 'Core/Diagnostics/ARCH2d4EvidencePolicy.ps1' -Raw -Encoding UTF8
          $audit=Get-Content -LiteralPath 'Core/Diagnostics/ARCH2d4LiveAudit.ps1' -Raw -Encoding UTF8
          $entry=Get-Content -LiteralPath 'Invoke-ARCH2d4.ps1' -Raw -Encoding UTF8
          $docs=Get-Content -LiteralPath 'docs/2.6.5-arch2d4-readonly-forensics.md' -Raw -Encoding UTF8
          $main=Get-Content -LiteralPath 'OutlookPOP3Archive.ps1' -Raw -Encoding UTF8
          $rel=Get-Content -LiteralPath 'RELEASE.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          if($evidence -cnotmatch 'Read-OPA265ARCH2c4JsonSealed -Path \(\[string\]\$Layout.ManifestPath\)' -or
             $evidence -cnotmatch 'Read-OPA265ARCH2c4JsonSealed -Path \(\[string\]\$Layout.GlobalClaimPath\)' -or
             $evidence -cnotmatch 'Read-OPA265ARCH2d4UnanchoredJson' -or
             $evidence -cnotmatch 'MovedContentMatchedReceiptMissingManualReview' -or
             $evidence -cnotmatch 'PartialBatchReadOnlyClassifiedNoResumePermit' -or
             $audit -cnotmatch 'Open-OPA265ARCH2dSession' -or
             $audit -cnotmatch 'Get-OPA265ARCH2bMailSemanticWitness' -or
             $audit -cnotmatch 'Get-OPA265ARCH2dSourcePresence' -or
             $audit -cnotmatch 'Get-OPA265ARCH2d4BatchDecision' -or
             $audit -cmatch '\.(Move|Copy|Save|Delete|AddStoreEx|RemoveStore)\s*\(' -or
             $audit -cmatch 'Write-OPA265ARCH2c4JsonOnce' -or
             $evidence -cmatch 'Write-OPA265ARCH2c4JsonOnce' -or
             $entry -cnotmatch "ValidateSet\('Plan','Evidence','LiveAudit'\)" -or
             $entry -cmatch 'MoveBatch' -or
             $docs -cnotmatch 'PerItemReceiptsExternallyHashPinned' -or
             $main -cnotmatch 'Assert-OPA265ARCH2aDevelopmentWriterClosed' -or
             [int]$rel.Verification.ExpectedPesterTests -ne 4174 -or
             [int]$rel.Verification.ExpectedTestContainers -ne 137){
             throw 'ARCH2d4 forensic pinned claims/return check and zero real write permissions gate failed.'
          }
          Write-Host 'PASS ARCH2d4 operator hashes anchored, 10 receipts validated, no journal/PST writes or any COM Move.'
      - name: ARCH2d5 exact 100 originals and externally anchored SHA256 receipt chain safety
        run: |
          $ErrorActionPreference='Stop'
          $core=Get-Content -LiteralPath 'Core/Archive/ARCH2d5Batch100Core.ps1' -Raw -Encoding UTF8
          $policy=Get-Content -LiteralPath 'Core/Archive/ARCH2d5Batch100Policy.ps1' -Raw -Encoding UTF8
          $entry=Get-Content -LiteralPath 'Invoke-ARCH2d5.ps1' -Raw -Encoding UTF8
          $docs=Get-Content -LiteralPath 'docs/2.6.5-arch2d5-real-batch100.md' -Raw -Encoding UTF8
          $rel=Get-Content -LiteralPath 'RELEASE.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          $global=$core.IndexOf('Write-OPA265ARCH2c4JsonOnce -Path $layout.GlobalClaimPath')
          $item=$core.IndexOf('Write-OPA265ARCH2c4JsonOnce -Path (Get-OPA265ARCH2d5ItemPath -Layout $layout -Ordinal $ordinal)')
          $move=$core.IndexOf('$moved=$mail.Move($target)')
          $return=$core.IndexOf('Write-OPA265ARCH2c4JsonOnce -Path (Get-OPA265ARCH2d5ItemPath -Layout $layout -Ordinal $ordinal -Kind Return)')
          $checkpoint=$core.IndexOf('Write-OPA265ARCH2c4JsonOnce -Path (Get-OPA265ARCH2d5CheckpointPath')
          $final=$core.IndexOf('Write-OPA265ARCH2c4JsonOnce -Path $layout.FinalSealPath')
          if(([regex]::Matches($core,'\$moved=\$mail\.Move\(\$target\)')).Count -ne 1 -or
             $global -lt 0 -or $item -le $global -or $move -le $item -or
             $return -le $move -or $checkpoint -le $return -or $final -le $checkpoint -or
             $core -cmatch '\.(Copy|Delete|Save|Send)\s*\(' -or
             $core -cnotmatch 'for\(\$i=0;\$i -lt 100;\$i\+\+\)' -or
             $core -cnotmatch 'Get-OPA265ARCH2bMailSemanticWitness' -or
             $core -cnotmatch 'PreviousReceiptSha256=\$lastReturnSha' -or
             $policy -cnotmatch 'AllHundredChainVerified' -or
             $policy -cnotmatch 'FinalSealExternallyPinned' -or
             $entry -cnotmatch "ValidateSet\('Plan','Inventory','Prepare','MoveBatch','Evidence','Reconcile'\)" -or
             $docs -cnotmatch 'FinalSealSha256' -or
             [int]$rel.Verification.ExpectedPesterTests -ne 4174 -or
             [int]$rel.Verification.ExpectedTestContainers -ne 137){
              throw 'ARCH2d5 batch100 sealed receipt chain static safety gate failed.'
          }
          Write-Host 'PASS ARCH2d5 100 originals, per-item claim before COM Move, ten receipt checkpoints and final operator-pinned SHA.'
      - name: ARCH3a reuse-only original Year/PST/Sent/POP3 contracts, no new writer gate
        run: |
          $ErrorActionPreference='Stop'
          $audit=Get-Content -LiteralPath 'Core/Diagnostics/ARCH3aLegacyIntegrationAudit.ps1' -Raw -Encoding UTF8
          $entry=Get-Content -LiteralPath 'Invoke-ARCH3a.ps1' -Raw -Encoding UTF8
          $tests=Get-Content -LiteralPath 'Tests/Archive/ARCH3aReuseExistingArchiver.Tests.ps1' -Raw -Encoding UTF8
          $adr=Get-Content -LiteralPath 'docs/ADR-ARCH3-001-reuse-existing-archiver.md' -Raw -Encoding UTF8
          $map=Get-Content -LiteralPath 'docs/2.6.5-arch3a-existing-pipeline-audit.md' -Raw -Encoding UTF8
          $main=Get-Content -LiteralPath 'OutlookPOP3Archive.ps1' -Raw -Encoding UTF8
          $rel=Get-Content -LiteralPath 'RELEASE.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          if($audit -cnotmatch 'function Get-OPA265ARCH3aIntegrationAudit' -or
             $audit -cnotmatch 'function Get-OPA265ARCH3aExistingRoutingExamples' -or
             $audit -cnotmatch 'Get-OPAArchivePartPath -SourcePst' -or
             $audit -cnotmatch 'Get-OPAArchiveTargetPath -ReceivedTime' -or
             $audit -cnotmatch 'Get-OPAArchiveItemDate -Item' -or
             $audit -cnotmatch 'Test-OPAExcludedSystemFolder' -or
             $audit -cnotmatch 'SourceMarkerEvidenceIsNotRuntimeCertification' -or
             $audit -cmatch 'GetActiveObject\s*\(' -or
             $audit -cmatch '\.(Move|AddStoreEx|Save|Copy|Delete)\s*\(' -or
             $audit -cmatch 'Write-OPA265ARCH2c4JsonOnce' -or
             $entry -cnotmatch "ValidateSet\('Plan','Audit','RoutingExamples'\)" -or
             $entry -cmatch "ValidateSet\('Prepare','MoveBatch'" -or
             $tests -cnotmatch 'the original archive verifier already contains full semantic comparison' -or
             $adr -cnotmatch 'ARCH3b' -or
             $adr -cnotmatch 'ArchiveVerifier.ps1' -or
             $map -cnotmatch 'ARCH3a' -or
             $main -cnotmatch 'Assert-OPA265ARCH2aDevelopmentWriterClosed -Mode \$Mode' -or
             [int]$rel.Verification.ExpectedPesterTests -ne 4174 -or
             [int]$rel.Verification.ExpectedTestContainers -ne 137){
            throw 'ARCH3a exact original-code reuse/explicit open gaps/writer-closed safety contract missing.'
          }
          Write-Host 'PASS ARCH3a single existing archiver, original Year/POP3/SentOn/PST routing, semantic verifier preserved; no duplicate writer, production closed.'
      - name: ARCH3b original candidate SHA operation identity and synthetic fail closed sequence
        run: |
          $ErrorActionPreference='Stop'
          $bridge=Get-Content -LiteralPath 'Core/Archive/ARCH3bOriginalMoverContract.ps1' -Raw -Encoding UTF8
          $entry=Get-Content -LiteralPath 'Invoke-ARCH3b.ps1' -Raw -Encoding UTF8
          $tests=Get-Content -LiteralPath 'Tests/Archive/ARCH3bOriginalMoverContract.Tests.ps1' -Raw -Encoding UTF8
          $docs=Get-Content -LiteralPath 'docs/2.6.5-arch3b-original-mover-contract.md' -Raw -Encoding UTF8
          $main=Get-Content -LiteralPath 'OutlookPOP3Archive.ps1' -Raw -Encoding UTF8
          $rel=Get-Content -LiteralPath 'RELEASE.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          if($bridge -cnotmatch 'function New-OPA265ARCH3bOperationContract' -or
             $bridge -cnotmatch 'function Test-OPA265ARCH3bPhaseEvidence' -or
             $bridge -cnotmatch 'function New-OPA265ARCH3bBatchPreview' -or
             $bridge -cnotmatch 'Get-OPAArchivePartPath -SourcePst' -or
             $bridge -cnotmatch 'Get-OPAArchiveTargetPath -ReceivedTime' -or
             $bridge -cnotmatch 'Get-OPA265ARCH3bDigest -Parts' -or
             $bridge -cnotmatch 'MoveIndeterminate' -or
             $bridge -cnotmatch 'PrepareIntent' -or
             $bridge -cnotmatch 'IndependentContentVerified' -or
             $bridge -cnotmatch 'IndexCommitted' -or
             $bridge -cnotmatch 'DurablyFlushedBeforeMove' -or
             $bridge -cnotmatch 'OutlookRestartConfirmed' -or
             $bridge -cmatch '\.(Move|AddStoreEx|Save|Delete|Copy)\s*\(' -or
             $bridge -cmatch 'Write-OPA265ARCH2c4JsonOnce' -or
             $entry -cnotmatch "ValidateSet\('Plan','SyntheticPreview','SyntheticCrashReview'\)" -or
             $tests -cnotmatch 'durable Prepare intent MUST precede destination PST creation' -or
             $docs -cnotmatch 'ARCH3c' -or
             $main -cnotmatch 'Assert-OPA265ARCH2aDevelopmentWriterClosed -Mode \$Mode' -or
             [int]$rel.Verification.ExpectedPesterTests -ne 4174 -or
             [int]$rel.Verification.ExpectedTestContainers -ne 137){
            throw 'ARCH3b original MailMover source-backed identity and fail-closed no-write gate missing.'
          }
          Write-Host 'PASS ARCH3b original Year/part/folder functions and SHA operation identity, PrepareIntent-before-PST phase order, no live writer.'
      - name: ARCH3c original OperationJournal durable synthetic seal and production safety gate
        run: |
          $ErrorActionPreference='Stop'
          $a=Get-Content -LiteralPath 'Core/Archive/ARCH3cDurableOperationLedger.ps1' -Raw -Encoding UTF8
          $entry=Get-Content -LiteralPath 'Invoke-ARCH3c.ps1' -Raw -Encoding UTF8
          $tests=Get-Content -LiteralPath 'Tests/Archive/ARCH3cDurableOriginalOperationJournal.Tests.ps1' -Raw -Encoding UTF8
          $docs=Get-Content -LiteralPath 'docs/2.6.5-arch3c-durable-original-operation-journal.md' -Raw -Encoding UTF8
          $main=Get-Content -LiteralPath 'OutlookPOP3Archive.ps1' -Raw -Encoding UTF8
          $rel=Get-Content -LiteralPath 'RELEASE.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          if($a -cnotmatch 'function Invoke-OPA265ARCH3cSyntheticWrite' -or
             $a -cnotmatch 'function Test-OPA265ARCH3cSyntheticEvidence' -or
             $a -cnotmatch 'FileMode]::CreateNew' -or
             $a -cnotmatch '\$fs.Flush\(\$true\)' -or
             $a -cnotmatch 'ARCH3C-SYNTHETIC' -or
             $a -cnotmatch 'Write-OPAOperationJournalEvent -Path' -or
             $a -cnotmatch 'Read-OPAOperationJournal -Path' -or
             $a -cnotmatch 'Resolve-OPAOperationRecovery -Journal' -or
             $a -cnotmatch 'FinalSealSha256' -or
             $a -cnotmatch 'PreviousStageSha256' -or
             $a -cnotmatch 'IndependentLivePstVerified=\$false' -or
             $a -cmatch '\.(Move|AddStoreEx|Delete|Save|Copy)\s*\(' -or
             $a -cmatch 'Save-OPAArchiveTransaction|Add-OPADuplicateEntry' -or
             $entry -cnotmatch "ValidateSet\('Plan','SyntheticWrite','Evidence'\)" -or
             $tests -cnotmatch 'indeterminate synthetic crash after claim remains permanently unrepeatable' -or
             $docs -cnotmatch 'ARCH3c' -or
             $main -cnotmatch 'Assert-OPA265ARCH2aDevelopmentWriterClosed -Mode \$Mode' -or
             [int]$rel.Verification.ExpectedPesterTests -ne 4174 -or
             [int]$rel.Verification.ExpectedTestContainers -ne 137){
            throw 'ARCH3c synthetic ONLY original OperationJournal / SHA-anchored immutable evidence contract failed.'
          }
          Write-Host 'PASS ARCH3c synthetic immutable SHA-chain, original OperationJournal, no Outlook/PST/Move or production permit.'
      - name: Package only OutlookPOP3Archive from tested commit and calculate SHA-256
        run: |
          $ErrorActionPreference='Stop'
          $project=(Get-Location).Path
          $short=$env:GITHUB_SHA.Substring(0,8).ToLowerInvariant()
          $base='OutlookPOP3Archive-2.6.5-ARCH3c-dev-g'+$short
          $out=Join-Path $env:RUNNER_TEMP 'OPA-ARCH3c-Package'
          $stageParent=Join-Path $env:RUNNER_TEMP 'OPA-ARCH3c-Stage'
          $staged=Join-Path $stageParent $base
          [void][IO.Directory]::CreateDirectory($out)
          [void][IO.Directory]::CreateDirectory($staged)
          foreach($f in @('.editorconfig','.gitignore','.psscriptanalyzer.psd1','RELEASE.json','MANIFEST.txt','README.md','CHANGELOG.md','OutlookPOP3Archive.ps1','OutlookPOP3Archive.Worker.ps1','Invoke-ARCH2c4.ps1','Invoke-ARCH2d.ps1','Invoke-ARCH2d3.ps1','Invoke-ARCH2d4.ps1','Invoke-ARCH2d5.ps1','Invoke-ARCH3a.ps1','Invoke-ARCH3b.ps1','Invoke-ARCH3c.ps1','Invoke-CI.ps1','Invoke-OPAWorkerSelfTest.ps1','New-OPABuildPackage.ps1')){
            $src=Join-Path $project $f
            if(-not (Test-Path -LiteralPath $src -PathType Leaf)){throw ('Required project file absent: '+$f)}
            Copy-Item -LiteralPath $src -Destination (Join-Path $staged $f)
          }
          foreach($dir in @('Core','Tests','docs')){
            $dirPath=Join-Path $project $dir
            foreach($f in @(Get-ChildItem -LiteralPath $dirPath -Recurse -File -Force)){
              $extension=if($dir -eq 'docs'){'.md'}else{'.ps1'}
              if($f.Extension -cne $extension -or
                 ($dir -eq 'Tests' -and $f.Name -notmatch '\.Tests\.ps1$') -or
                 (($f.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0)){throw ('Unallowlisted file: '+$f.FullName)}
              $relative=$f.FullName.Substring($project.Length).TrimStart([char[]]@('\','/'))
              $dst=Join-Path $staged $relative
              [void][IO.Directory]::CreateDirectory([IO.Path]::GetDirectoryName($dst))
              Copy-Item -LiteralPath $f.FullName -Destination $dst
            }
          }
          $info=[ordered]@{Schema='OPA265.ARCH3c.BuildInfo.1';DevelopmentGate='2.6.5-ARCH3c';SourceCommit=$env:GITHUB_SHA;WindowsPowerShell51CiPassed=$true;PesterAndPSScriptAnalyzerRequired=$true;LiveOutlookTestInCi=$false;ArchiveResumeAutoClosed=$true;ProductionReady=$false}
          [IO.File]::WriteAllText((Join-Path $staged 'BUILD-INFO.json'),(ConvertTo-Json -InputObject $info -Depth 4),(New-Object Text.UTF8Encoding($false)))
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip=Join-Path $out ($base+'.zip')
          [IO.Compression.ZipFile]::CreateFromDirectory($stageParent,$zip,[IO.Compression.CompressionLevel]::Optimal,$false)
          $hash=(Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $out ($base+'.sha256')),($hash+'  '+[IO.Path]::GetFileName($zip)+[char]10),(New-Object Text.UTF8Encoding($false)))
          Write-Host ('ARCH3c ZIP SHA256: '+$hash)
      - name: Upload tested project-only ARCH3c DEV ZIP
        uses: actions/upload-artifact@v4
        with:
          name: OutlookPOP3Archive-2.6.5-ARCH3c-dev
          path: |
            ${{ runner.temp }}/OPA-ARCH3c-Package/*.zip
            ${{ runner.temp }}/OPA-ARCH3c-Package/*.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Publish public test-only ARCH3c prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $short=$env:GITHUB_SHA.Substring(0,8).ToLowerInvariant()
          $base='OutlookPOP3Archive-2.6.5-ARCH3c-dev-g'+$short
          $dir=Join-Path $env:RUNNER_TEMP 'OPA-ARCH3c-Package'
          $zip=Join-Path $dir ($base+'.zip')
          $sha=Join-Path $dir ($base+'.sha256')
          if(-not (Test-Path -LiteralPath $zip -PathType Leaf) -or -not (Test-Path -LiteralPath $sha -PathType Leaf)){throw 'ZIP/checksum absent'}
          $tag='outlookpop3archive-2.6.5-arch3c-dev-g'+$short
          gh release create $tag $zip $sha --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title ('OutlookPOP3Archive 2.6.5-ARCH3c DEV '+$short) --notes 'ARCH3c DEV: synthetically persist seven immutable CreateNew+Flush(true) SHA-linked operation stage files in OS TEMP only. Reuses original ARCH3b source/Year/PST OperationId and ORIGINAL Write-OPAOperationJournalEvent/Read-OPAOperationJournal/Resolve-OPAOperationRecovery (no duplicate journal). Final operator-externally pinned seal contains seven stage hashes and original OperationJournal SHA256. 29 tests cover crash after intent/claim/return, torn original JSONL, altered stage/operation journal, missing seal, no retry. This is SYNTHETIC and does not call Outlook, open or create PST, alter original MailMover, transaction or DuplicateIndex. Production Archive/Resume/Auto blocked. Full Windows PowerShell 5.1 CI expected 4174 Pester tests in 137 containers, PSSA BOM JSON gates, project-only SHA256 ZIP.' --prerelease
          if($LASTEXITCODE -ne 0){throw 'GitHub prerelease publication failed'}
