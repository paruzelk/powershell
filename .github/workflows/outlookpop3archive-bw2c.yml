name: OutlookPOP3Archive BW2c Windows PS5.1 CI and DEV package
on:
  push:
    branches:
      - feature/outlookpop3archive-2.6.5-bw2c-explicit-source-size-consent
    paths:
      - 'OutlookPOP3Archive/**'
      - '.github/workflows/outlookpop3archive-bw2c.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-worker-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
        working-directory: OutlookPOP3Archive
    steps:
      - uses: actions/checkout@v4
      - name: Install Windows PowerShell CI prerequisites
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force
          Install-Module -Name Pester -MinimumVersion 5.0 -Scope CurrentUser -Force -SkipPublisherCheck -AllowClobber
          Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force -AllowClobber
      - name: Native Windows PowerShell 5.1 test gate (784 / 45)
        run: |
          if ($PSVersionTable.PSEdition -ne 'Desktop' -or $PSVersionTable.PSVersion.Major -ne 5) { throw 'Not Windows PowerShell 5.1.' }
          .\Invoke-CI.ps1 -ExpectedBuild '2.6.3-PREVIEW1'
      - name: Package BW2c DEV source only after successful CI (no production release promotion)
        run: |
          $project=(Get-Location).Path
          $short=$env:GITHUB_SHA.Substring(0,8).ToLowerInvariant()
          $name='OutlookPOP3Archive-2.6.5-BW2c-dev-g'+$short
          $temp=Join-Path $env:RUNNER_TEMP ('OPA-BW2c-Stage-'+[guid]::NewGuid().ToString('N'))
          $staging=Join-Path $temp $name
          $output=Join-Path $env:RUNNER_TEMP 'OPA-BW2c-Package'
          [void][IO.Directory]::CreateDirectory($staging)
          [void][IO.Directory]::CreateDirectory($output)
          $top=@('.gitignore','.psscriptanalyzer.psd1','CHANGELOG.md','README.md','MANIFEST.txt','RELEASE.json','OutlookPOP3Archive.ps1','OutlookPOP3Archive.Worker.ps1','Invoke-CI.ps1','Invoke-OPAWorkerSelfTest.ps1','New-OPABuildPackage.ps1')
          foreach($item in $top) {
            $file=Join-Path $project $item
            if(-not (Test-Path -LiteralPath $file -PathType Leaf)) {throw ('Missing mandatory release file: '+$item)}
            if(((Get-Item -LiteralPath $file).Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {throw ('Reparse point: '+$item)}
            Copy-Item -LiteralPath $file -Destination (Join-Path $staging $item) -ErrorAction Stop
          }
          foreach($namePart in @('Core','Tests','docs')){
            $folder=Join-Path $project $namePart
            if(-not (Test-Path -LiteralPath $folder -PathType Container)) {throw ('Missing folder: '+$namePart)}
            foreach($file in @(Get-ChildItem -LiteralPath $folder -File -Recurse -Force -ErrorAction Stop)){
              $expectedExt=if($namePart -eq 'docs'){'.md'}else{'.ps1'}
              if($file.Extension -cne $expectedExt -or ($namePart -eq 'Tests' -and $file.Name -notmatch '\.Tests\.ps1$') -or
                 (($file.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0)){
                throw ('Untrusted DEV package source: '+$file.FullName)
              }
              $relative=$file.FullName.Substring($project.Length).TrimStart([char[]]@('\','/'))
              $target=Join-Path $staging $relative
              $parent=[IO.Path]::GetDirectoryName($target)
              [void][IO.Directory]::CreateDirectory($parent)
              Copy-Item -LiteralPath $file.FullName -Destination $target -ErrorAction Stop
            }
          }
          $info=[ordered]@{
            Artifact=($name+'.zip')
            BaseApplicationBuild='2.6.3-PREVIEW1'
            DevelopmentGate='2.6.5-BW2c'
            SourceCommit=$env:GITHUB_SHA
            PesterPassed=784
            TestContainers=45
            NativeWindowsPowerShell51=$true
            ProductionReady=$false
            ArchiveType='DEV project-only, not official release'
          }
          $utf8=New-Object Text.UTF8Encoding($false)
          [IO.File]::WriteAllText((Join-Path $staging 'BUILD-INFO.json'),(ConvertTo-Json -InputObject $info -Depth 5),$utf8)
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip=Join-Path $output ($name+'.zip')
          [IO.Compression.ZipFile]::CreateFromDirectory($temp,$zip,[IO.Compression.CompressionLevel]::Optimal,$false)
          $hash=(Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $output ($name+'.sha256')),($hash+'  '+[IO.Path]::GetFileName($zip)+[char]10),$utf8)
          Write-Host ('DEV ZIP: '+$zip+' SHA256: '+$hash)
      - name: Upload CI-validated BW2c development archive
        uses: actions/upload-artifact@v4
        with:
          name: OutlookPOP3Archive-2.6.5-BW2c-dev
          path: |
            ${{ runner.temp }}/OPA-BW2c-Package/*.zip
            ${{ runner.temp }}/OPA-BW2c-Package/*.sha256
          if-no-files-found: error
          retention-days: 14
