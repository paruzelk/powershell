name: OutlookPOP3Archive BW4k7v2a full Windows PS5.1 CI
on:
  push:
    branches: [feature/outlookpop3archive-2.6.5-bw4k7v2a-pristine-pst-gate]
    paths: ['OutlookPOP3Archive/**', '.github/workflows/outlookpop3archive-bw4k7v2a.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  full-ci:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
        working-directory: OutlookPOP3Archive
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester and PSScriptAnalyzer
        run: |
          [Net.ServicePointManager]::SecurityProtocol=[Net.SecurityProtocolType]::Tls12
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force
          Install-Module Pester -MinimumVersion 5.0 -Scope CurrentUser -Force -SkipPublisherCheck -AllowClobber
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -AllowClobber
      - name: Complete original PS5.1 CI release gates
        run: .\Invoke-CI.ps1 -ExpectedBuild '2.6.3-PREVIEW1'
      - name: Verify normative SEM-001 documentation is tracked
        run: |
          $ErrorActionPreference='Stop'
          $spec=Get-Content -LiteralPath 'docs/TECHNICAL_SPECIFICATION.md' -Raw -Encoding UTF8
          $norm=Get-Content -LiteralPath 'docs/SEMANTIC-INTEGRITY-POLICY.md' -Raw -Encoding UTF8
          foreach($doc in @('README.md','docs/ARCHITECTURE.md','docs/TESTING.md','docs/RECOVERY.md')){
            $body=Get-Content -LiteralPath $doc -Raw -Encoding UTF8
            if($body -cnotmatch 'SEM-001'){throw ('Missing SEM-001 policy link '+$doc)}
          }
          if($spec -cnotmatch 'SEM-001' -or
             $norm -cnotmatch 'SEM-001-MAPI' -or
             $norm -cnotmatch 'SEM-001-MOVE' -or
             $norm -cnotmatch 'SEM-001-CI' -or
             $norm -cnotmatch 'PR_MESSAGE_SIZE' -or
             $norm -cnotmatch 'Sent Items'){
            throw 'Normative semantic integrity policy incomplete.'
          }
          Write-Host 'PASS SEM-001 normative requirements and architecture/testing/recovery docs'
      - name: Verify BW4k7j Microsoft MS-OXCMSG documented vs unresolved flag no-waiver policy
        run: |
          $ErrorActionPreference='Stop'
          $d=Get-Content -LiteralPath 'docs/2.6.5-bw4k7j-mapi-flag-investigation.md' -Raw -Encoding UTF8
          $norm=Get-Content -LiteralPath 'docs/SEMANTIC-INTEGRITY-POLICY.md' -Raw -Encoding UTF8
          $ctrl=Get-Content -LiteralPath 'Core/Diagnostics/Invoke-OPA265BW4k7jFlagPolicyReview.ps1' -Raw -Encoding UTF8
          $worker=Get-Content -LiteralPath 'Core/Worker/BW4k7jRawMessageFlagPolicy265.ps1' -Raw -Encoding UTF8
          if($d -cnotmatch '325787fee94bf5c80e75e761cfc2a1724d94683204b73c2e03eaf384a530ba4c' -or
             $d -cnotmatch 'f75594047529cca19bbeb8d2a52db5412187325a39db4d659dc85b4b41d44399' -or
             $d -cnotmatch 'MS-OXCMSG' -or
             $d -cnotmatch 'STORE_HTML_OK' -or
             $d -cnotmatch 'NEVER RETRY' -or
             $norm -cnotmatch 'BW4k7j distinguish' -or
             $ctrl -cnotmatch 'Invoke-OPA265BW4k7iReopenIntegrityReview' -or
             $worker -cnotmatch 'UnspecifiedInReviewedMsOxcmsgTable' -or
             $worker -cnotmatch 'mfUnmodified' -or
             $worker -cnotmatch 'StoreHtmlOk0x10000BelongsToOtherProperty' -or
             $ctrl -cmatch '\$mail\.Move\s*\(' -or
             $ctrl -cmatch 'Write-OPA265BW4k7gClaimOnce'){
             throw 'BW4k7j documented vs unclassified MAPI flag SEM-001 contract incomplete.'
          }
          Write-Host 'PASS BW4k7j Microsoft MAPI message flags known vs unknown, cross-property and no-write policy'
      - name: Verify BW4k7k PST provider provenance and locale-neutral Pester gate
        run: |
          $ErrorActionPreference='Stop'
          $controller=Get-Content -LiteralPath 'Core/Diagnostics/Invoke-OPA265BW4k7kProviderPropertyReview.ps1' -Raw -Encoding UTF8
          $policy=Get-Content -LiteralPath 'Core/Worker/BW4k7kProviderPropertyContext265.ps1' -Raw -Encoding UTF8
          $tests=Get-Content -LiteralPath 'Tests/Worker/BW4k7dRecipientsFlags.Tests.ps1' -Raw -Encoding UTF8
          $new=Get-Content -LiteralPath 'Tests/Worker/BW4k7kProviderPropertyContext.Tests.ps1' -Raw -Encoding UTF8
          $docs=Get-Content -LiteralPath 'docs/2.6.5-bw4k7k-provider-property-review.md' -Raw -Encoding UTF8
          if($controller -cnotmatch 'Invoke-OPA265BW4k7jFlagPolicyReview' -or
             $controller -cnotmatch '0x0E070003' -or
             $controller -cnotmatch '0x0E170003' -or
             $controller -cnotmatch '0x0E1B000B' -or
             $controller -cnotmatch 'Get-Process -Name OUTLOOK' -or
             $controller -cmatch '\$mail\.(Move|Save|Delete|Send)\s*\(' -or
             $controller -cmatch '\.SetProperty\s*\(' -or
             $policy -cnotmatch 'ProviderSpecificFlagWaiver=\$false' -or
             $policy -cnotmatch 'Original0x00010000MeaningEstablished=\$false' -or
             $tests -cnotmatch 'Should -Throw # Locale-neutral' -or
             $tests -cmatch 'Should -Throw .empty array.' -or
             $new -cnotmatch 'works across Russian and English' -or
             $docs -cnotmatch '2402/2403 FAILED'){
              throw 'BW4k7k locale safety / MAPI property provenance / no-Move CI gate failed.'
          }
          Write-Host 'PASS BW4k7k locale-neutral test regression and read-only unknown MAPI flag policy'

      - name: Verify BW4k7l fresh isolated no-Move original MAPI evidence gates
        run: |
          $ErrorActionPreference='Stop'
          $controller=Get-Content -LiteralPath 'Core/Diagnostics/Invoke-OPA265BW4k7lFreshPreMoveReview.ps1' -Raw -Encoding UTF8
          $worker=Get-Content -LiteralPath 'Core/Worker/BW4k7lFreshPreMoveMapiWitness265.ps1' -Raw -Encoding UTF8
          $tests=Get-Content -LiteralPath 'Tests/Worker/BW4k7lFreshPreMoveMapiWitness.Tests.ps1' -Raw -Encoding UTF8
          $docs=Get-Content -LiteralPath 'docs/2.6.5-bw4k7l-fresh-premovewitness.md' -Raw -Encoding UTF8
          $meta=Get-Content -LiteralPath 'RELEASE.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          if([int]$meta.Verification.ExpectedTestContainers -ne 114 -or
             [int]$meta.Verification.ExpectedPesterTests -ne 3370 -or
             $controller -cnotmatch 'ConfirmImmutableCapture' -or
             $controller -cnotmatch 'Get-OPA265BW4cPop3Store' -or
             $controller -cnotmatch 'GetDefaultFolder\(6\)' -or
             $controller -cnotmatch 'Selection\.Count -ne 1' -or
             $controller -cnotmatch 'Write-OPA265BW4k7lEvidenceOnce' -or
             $controller -cnotmatch 'ShouldProcess' -or
             $controller -cmatch '\$mail\.(Move|Save|Delete|Send)\s*\(' -or
             $controller -cmatch '\.SetProperty\s*\(' -or
             $worker -cnotmatch 'FileMode\]::CreateNew' -or
             $worker -cnotmatch 'Flush\(\$true\)' -or
             $worker -cnotmatch '0x0E170003' -or
             $worker -cnotmatch '0x0E070003' -or
             $worker -cnotmatch '0x0E1B000B' -or
             $worker -cnotmatch 'RawFlag0x00010000BeforeMove' -or
             $worker -cmatch '\$mail\.(Move|Save|Delete|Send)\s*\(' -or
             $tests -cnotmatch 'stable validator refuses forged writer permission' -or
             $docs -cnotmatch 'BW4k7m' -or
             [bool]$meta.Integration.ArchiveWorkerEnabled -or
             [bool]$meta.Integration.ResumeWorkerEnabled -or
             [bool]$meta.Integration.AutoWorkerEnabled){
              throw 'BW4k7l fail-closed PRE-MOVE evidence-only contract incomplete.'
          }
          Write-Host 'PASS BW4k7l unique fresh fixture, raw pre-Move MAPI, immutable evidence only, no Move'

      - name: Verify BW4k7m single exact sealed original, irreversible Claim-before-Move and independent read-only audit
        run: |
          $ErrorActionPreference='Stop'
          $controller=Get-Content -LiteralPath 'Core/Diagnostics/Invoke-OPA265BW4k7mFreshOneShotMove.ps1' -Raw -Encoding UTF8
          $post=Get-Content -LiteralPath 'Core/Diagnostics/Invoke-OPA265BW4k7mIndependentPostMoveAudit.ps1' -Raw -Encoding UTF8
          $guards=Get-Content -LiteralPath 'Core/Worker/BW4k7mFreshOneShotGuard265.ps1' -Raw -Encoding UTF8
          $tests=Get-Content -LiteralPath 'Tests/Worker/BW4k7mFreshOneShotMove.Tests.ps1' -Raw -Encoding UTF8
          $docs=Get-Content -LiteralPath 'docs/2.6.5-bw4k7m-fresh-oneshot-move.md' -Raw -Encoding UTF8
          $meta=Get-Content -LiteralPath 'RELEASE.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          $n=@([regex]::Matches($controller,'(?i)\$mail\.Move\s*\(')).Count
          if([int]$meta.Verification.ExpectedTestContainers -ne 114 -or
             [int]$meta.Verification.ExpectedPesterTests -ne 3370 -or
             $n -ne 1 -or
             $controller -cnotmatch 'ConfirmOneShotFreshMove' -or
             $controller -cnotmatch 'MOVE EXACT ONE BW4K7M' -or
             $controller -cnotmatch 'Read-OPA265BW4k7mSealedEvidence' -or
             $controller -cnotmatch 'Assert-OPA265BW4k7mSourceEqualsSealed' -or
             $controller -cnotmatch 'Write-OPA265BW4k7mClaimOnce' -or
             $controller -cnotmatch 'ShouldProcess' -or
             $guards -cnotmatch '36ca109b7905e0040e57c6b9e01d0858daefd2ae7c76daba5c091663bbe36c29' -or
             $guards -cnotmatch 'd1a68868-acf5-4c70-860d-5521e1ce2836' -or
             $guards -cnotmatch 'FileMode\]::CreateNew' -or
             $guards -cnotmatch 'Flush\(\$true\)' -or
             $guards -cnotmatch 'NEVER RETRY' -or
             $post -cnotmatch 'ExpectedClaimSha256' -or
             $post -cnotmatch 'Get-OPA265BW4k7mContentComparison' -or
             $post -cnotmatch 'SourceMessageIdMatches=0' -or
             $post -cnotmatch 'DestinationMessageIdMatches=1' -or
             $post -cmatch '\.(Move|Save|Delete|Send|SetProperty)\s*\(' -or
             $tests -cnotmatch 'CreateNew flushed Claim persists once then prevents the next Move' -or
             $docs -cnotmatch 'BW4k7l' -or
             -not [bool]$meta.Verification.BW4k7mClaimBeforeExactlyOneMoveImplemented -or
             [bool]$meta.Verification.BW4k7mRealOutlookMoveInCI -or
             [bool]$meta.Verification.BW4k7mAutomaticRetryAllowed -or
             [bool]$meta.Verification.BW4k7mUnknownRawFlagWaived -or
             [bool]$meta.Verification.BW4k7mProductionWorkerDispatchAllowed -or
             [bool]$meta.Integration.ArchiveWorkerEnabled -or
             [bool]$meta.Integration.ResumeWorkerEnabled -or
             [bool]$meta.Integration.AutoWorkerEnabled){
              throw 'BW4k7m exact fresh fixture/Claim-before-Move/independent audit safety gate failed.'
          }
          Write-Host 'PASS BW4k7m synthetic only: exact sealed original, Claim-before-one-Move, read-only independent audit, no production'

      - name: Verify BW4k7n independent post-restart provider/size diagnostics no Move gates
        run: |
          $ErrorActionPreference='Stop'
          $meta=Get-Content -LiteralPath 'RELEASE.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          $driver=Get-Content -LiteralPath 'Core/Diagnostics/Invoke-OPA265BW4k7nReadOnlyProviderInvestigation.ps1' -Raw -Encoding UTF8
          $worker=Get-Content -LiteralPath 'Core/Worker/BW4k7nProviderSizeFlagDiagnostics265.ps1' -Raw -Encoding UTF8
          $tests=Get-Content -LiteralPath 'Tests/Worker/BW4k7nProviderSizeFlagDiagnostics.Tests.ps1' -Raw -Encoding UTF8
          $docs=Get-Content -LiteralPath 'docs/2.6.5-bw4k7n-readonly-provider-size-flag.md' -Raw -Encoding UTF8
          if([int]$meta.Verification.ExpectedPesterTests -ne 3370 -or
             [int]$meta.Verification.ExpectedTestContainers -ne 114 -or
             $driver -cnotmatch 'Invoke-OPA265BW4k7mIndependentPostMoveAudit' -or
             $driver -cnotmatch 'Read-OPA265BW4k7mSealedEvidence' -or
             $driver -cnotmatch 'Assert-OPA265BW4k7nStableArchivedProbe' -or
             $driver -cnotmatch 'Get-OPA265BW4k7nClassification' -or
             $driver -cmatch '\.(Move|Save|Delete|Send|SetProperty)\s*\(' -or
             $driver -cmatch 'Write-OPA265BW4k7mClaimOnce|FileMode\]::CreateNew' -or
             $worker -cnotmatch '0x0E080003' -or
             $worker -cnotmatch '0x0E080014' -or
             $worker -cnotmatch '0x0E070003' -or
             $worker -cnotmatch '0x0E170003' -or
             $worker -cnotmatch 'OriginalPrMessageSizeCapturedBeforeMove=\$false' -or
             $worker -cnotmatch 'PropertySpecificSizeDeltaCauseProven=\$false' -or
             $worker -cnotmatch 'CrossPropertyStoreHtmlOkEquivalenceAssumed=\$false' -or
             $worker -cmatch '\.(Move|Save|Delete|Send|SetProperty)\s*\(' -or
             $tests -cnotmatch 'size delta exactly negative 532 bytes' -or
             $docs -cnotmatch 'PidTagMessageSizeExtended' -or
             $docs -cnotmatch '0x00010000' -or
             [bool]$meta.Verification.BW4k7nOriginalRawPrMessageSizeBeforeMoveCaptured -or
             [bool]$meta.Verification.BW4k7nProviderSpecificSizeCauseProven -or
             [bool]$meta.Verification.BW4k7nUnknown0x10000MeaningEstablished -or
             [bool]$meta.Verification.BW4k7nHistoricalClaimOrEvidenceRewritten -or
             [bool]$meta.Verification.BW4k7nLiveOutlookMoveInCI -or
             [bool]$meta.Verification.BW4k7nAutomaticRetryAllowed -or
             [bool]$meta.Verification.BW4k7nProductionWorkerDispatchAllowed -or
             [bool]$meta.Integration.ArchiveWorkerEnabled -or
             [bool]$meta.Integration.ResumeWorkerEnabled -or
             [bool]$meta.Integration.AutoWorkerEnabled){
              throw 'BW4k7n fail-closed exact real fixture no-writer independent provider context gate failed.'
          }
          Write-Host 'PASS BW4k7n original Evidence+Claim pins, no Move, bounded MAPI sizes, unknown 0x10000 still blocked'

      - name: Verify BW4k7n1 exact optional PT_I8 interop skip and required properties still fail closed
        run: |
          $ErrorActionPreference='Stop'
          $meta=Get-Content -LiteralPath 'RELEASE.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          $worker=Get-Content -LiteralPath 'Core/Worker/BW4k7nProviderSizeFlagDiagnostics265.ps1' -Raw -Encoding UTF8
          $tests=Get-Content -LiteralPath 'Tests/Worker/BW4k7nProviderSizeFlagDiagnostics.Tests.ps1' -Raw -Encoding UTF8
          $docs=Get-Content -LiteralPath 'docs/2.6.5-bw4k7n1-extended-size-interop-fix.md' -Raw -Encoding UTF8
          if([int]$meta.Verification.ExpectedPesterTests -ne 3370 -or
             [int]$meta.Verification.ExpectedTestContainers -ne 114 -or
             $worker -cnotmatch 'NotProbedPowerShellComPtI8Interop' -or
             $worker -cnotmatch "Name -ceq 'PrMessageSizeExtended'" -or
             $worker -cnotmatch "Tag -ceq '0x0E080014'" -or
             $worker -cnotmatch "Kind -ceq 'Int64'" -or
             $worker -cnotmatch 'ObservationState' -or
             $worker -cnotmatch 'PrMessageSizeExtendedProviderSupportEstablished=\$false' -or
             $worker -cnotmatch 'if\(-not \$notFound -or \[bool\]\$Definition.Required\)' -or
             $worker -cmatch '\.(Move|Save|Delete|Send|SetProperty)\s*\(' -or
             $tests -cnotmatch 'PT_I8 skipped on real-world COM string conversion without triggering GetProperty' -or
             $tests -cnotmatch 'fail closed if required flags invocation throws after extended skip' -or
             $docs -cnotmatch 'NotProbedPowerShellComPtI8Interop' -or
             -not [bool]$meta.Verification.BW4k7n1OnlyOptionalPtI8ComTagSkipped -or
             -not [bool]$meta.Verification.BW4k7n1NotProbedNotProviderAbsent -or
             -not [bool]$meta.Verification.BW4k7n1RequiredMapiPropertiesRemainFailClosed -or
             [bool]$meta.Verification.BW4k7n1OriginalEvidenceOrClaimRewritten -or
             [bool]$meta.Verification.BW4k7n1OutlookMoveInCI -or
             [bool]$meta.Verification.BW4k7n1AutomaticRetryAllowed -or
             [bool]$meta.Verification.BW4k7n1ProductionWorkerDispatchAllowed -or
             [bool]$meta.Integration.ArchiveWorkerEnabled -or
             [bool]$meta.Integration.ResumeWorkerEnabled -or
             [bool]$meta.Integration.AutoWorkerEnabled){
              throw 'BW4k7n1 narrow optional PT_I8 interop bypass failed safety gate.'
          }
          Write-Host 'PASS BW4k7n1 optional PT_I8 not-probed and all required MAPI fail-closed'

      - name: Verify BW4k7o versioned SEM-001 full decision matrix with original immutable MAPI evidence
        run: |
          $ErrorActionPreference='Stop'
          $meta=Get-Content -LiteralPath 'RELEASE.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          $worker=Get-Content -LiteralPath 'Core/Worker/BW4k7oSemanticIntegrityPolicy265.ps1' -Raw -Encoding UTF8
          $driver=Get-Content -LiteralPath 'Core/Diagnostics/Invoke-OPA265BW4k7oSemanticIntegrityReview.ps1' -Raw -Encoding UTF8
          $tests=Get-Content -LiteralPath 'Tests/Worker/BW4k7oSemanticIntegrityPolicy.Tests.ps1' -Raw -Encoding UTF8
          $docs=Get-Content -LiteralPath 'docs/2.6.5-bw4k7o-semantic-integrity-decision.md' -Raw -Encoding UTF8
          $norm=Get-Content -LiteralPath 'docs/SEMANTIC-INTEGRITY-POLICY.md' -Raw -Encoding UTF8
          if([int]$meta.Verification.ExpectedPesterTests -ne 3370 -or
             [int]$meta.Verification.ExpectedTestContainers -ne 114 -or
             $worker -cnotmatch 'SEM-001-BW4k7o-v1' -or
             $worker -cnotmatch 'UnclassifiedRawMapiFlagsChangedBlocked' -or
             $worker -cnotmatch 'SourceDestinationIdentityMismatchBlocked' -or
             $worker -cnotmatch 'SemanticContentOrAttachmentMismatchBlocked' -or
             $worker -cnotmatch 'PrMessageStatusChangedBlocked' -or
             $worker -cnotmatch 'ReadOrHasAttachFlagChangedBlocked' -or
             $worker -cnotmatch 'DocumentedMfUnmodifiedChangeNeedsReview' -or
             $worker -cnotmatch 'SizeOnlyDifferenceNeedsReview' -or
             $worker -cnotmatch 'OriginalRawPrMessageSizeCapturedBeforeMove=\$false' -or
             $worker -cnotmatch 'Unknown0x00010000MeaningEstablished=\$false' -or
             $worker -cnotmatch 'PhysicalPstDurabilityProven=\$false' -or
             $worker -cnotmatch 'SentItemsAndCustomFoldersCoverageProven=\$false' -or
             $worker -cmatch '\.(Move|Save|Delete|Send|SetProperty)\s*\(' -or
             $driver -cnotmatch 'Invoke-OPA265BW4k7nReadOnlyProviderInvestigation.ps1' -or
             $driver -cnotmatch 'UnclassifiedRawMapiFlagsChangedBlocked' -or
             $driver -cnotmatch 'WhatIfPolicyOnlyNoOutlookAccessNoWrites' -or
             $driver -cmatch '\.(Move|Save|Delete|Send|SetProperty)\s*\(' -or
             $driver -cmatch 'Write-OPA265BW4k7mClaimOnce' -or
             $tests -cnotmatch 'live real report complete accepted as independently verified' -or
             $tests -cnotmatch 'synthetic unknown high bit is blocker' -or
             $tests -cnotmatch 'provider size missing needs review' -or
             $docs -cnotmatch '90-GB POP3 PST' -or
             $norm -cnotmatch 'BW4k7o versioned SEM-001 semantic integrity decision gate' -or
             -not [bool]$meta.Verification.BW4k7oVersionedSem001DecisionMatrix -or
             -not [bool]$meta.Verification.BW4k7oExactOperatorEvidenceAndClaimShaPinned -or
             [bool]$meta.Verification.BW4k7oUnknown0x10000FlagWaived -or
             [bool]$meta.Verification.BW4k7oSizeDeltaAcceptedGlobally -or
             [bool]$meta.Verification.BW4k7oClaimOrEvidenceRewritten -or
             [bool]$meta.Verification.BW4k7oOutlookMoveInCI -or
             [bool]$meta.Verification.BW4k7oAutomaticRetryAllowed -or
             [bool]$meta.Verification.BW4k7oJournalCompletionAllowed -or
             [bool]$meta.Verification.BW4k7oProductionWorkerDispatchAllowed -or
             [bool]$meta.Integration.ArchiveWorkerEnabled -or
             [bool]$meta.Integration.ResumeWorkerEnabled -or
             [bool]$meta.Integration.AutoWorkerEnabled){
              throw 'BW4k7o SEM-001 fail-closed semantic/flag/size no-writer policy gate failed.'
          }
          Write-Host 'PASS BW4k7o SEM-001 decision matrix, unknown 0x10000 BLOCKED, original Evidence and Claim immutable, production disabled'

      - name: Verify BW4k7p exact POP3 SentItems vs Outbox and bounded no-writer year inventory gates
        run: |
          $ErrorActionPreference='Stop'
          $meta=Get-Content -LiteralPath 'RELEASE.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          $driver=Get-Content -LiteralPath 'Core/Diagnostics/Invoke-OPA265BW4k7pPop3FolderScopeInventory.ps1' -Raw -Encoding UTF8
          $worker=Get-Content -LiteralPath 'Core/Worker/BW4k7pFolderScopeInventory265.ps1' -Raw -Encoding UTF8
          $tests=Get-Content -LiteralPath 'Tests/Worker/BW4k7pFolderScopeInventory.Tests.ps1' -Raw -Encoding UTF8
          $doc=Get-Content -LiteralPath 'docs/2.6.5-bw4k7p-pop3-folder-sent-year-inventory.md' -Raw -Encoding UTF8
          if([int]$meta.Verification.ExpectedPesterTests -ne 3370 -or
             [int]$meta.Verification.ExpectedTestContainers -ne 114 -or
             $driver -cnotmatch 'Get-OPA265BW4cPop3Store' -or
             $driver -cnotmatch 'Get-OPA265BW4k7pDefaultFolderMap' -or
             $driver -cnotmatch 'MaxTotalItems=5000' -or
             $driver -cnotmatch 'SentItemsResolvedInThisPop3Store' -or
             $driver -cnotmatch 'OutboxNeverEquivalentToSentItems=\$true' -or
             $driver -cnotmatch 'Pop3BoundedPartialYearInventoryNoFullCoverageClaim' -or
             $driver -cnotmatch 'New-OPA265BW4k7pYearPlan' -or
             $driver -cnotmatch 'ProposedArchiveFilesCreated=\$false' -or
             $driver -cnotmatch 'WriterPermit=\$false' -or
             $driver -cnotmatch 'ProductionReady=\$false' -or
             $driver -cmatch '\.(Move|Save|Delete|Send|SetProperty|AddStoreEx|AddStore)\s*\(' -or
             $worker -cnotmatch "SentItems',5" -or
             $worker -cnotmatch "Outbox',4" -or
             $worker -cnotmatch "Inbox',6" -or
             $worker -cnotmatch 'Archive-' -or
             $worker -cnotmatch 'AttachmentSizeEvidenceComplete' -or
             $worker -cmatch '\.(Move|Save|Delete|Send|SetProperty|AddStoreEx|AddStore)\s*\(' -or
             $tests -cnotmatch 'Sent Mail other store rejected' -or
             $tests -cnotmatch 'bounded partial has no inflated count' -or
             $doc -cnotmatch 'olFolderSentMail=5' -or
             $doc -cnotmatch '90-GB PST' -or
             -not [bool]$meta.Verification.BW4k7pExactPop3DeliveryStoreOnly -or
             -not [bool]$meta.Verification.BW4k7pCanonicalSentMailNotOutbox -or
             [bool]$meta.Verification.BW4k7pAttachmentPayloadsRead -or
             [bool]$meta.Verification.BW4k7pArchivePstsCreated -or
             [bool]$meta.Verification.BW4k7pOriginalBw4k7mClaimRewritten -or
             [bool]$meta.Verification.BW4k7pUnknown0x10000Waived -or
             [bool]$meta.Verification.BW4k7pActualOutlookMoveInCI -or
             [bool]$meta.Verification.BW4k7pAutomaticRetryAllowed -or
             [bool]$meta.Verification.BW4k7pProductionWorkerDispatchAllowed -or
             [bool]$meta.Integration.ArchiveWorkerEnabled -or
             [bool]$meta.Integration.ResumeWorkerEnabled -or
             [bool]$meta.Integration.AutoWorkerEnabled){
              throw 'BW4k7p exact POP3 folder/Sent/Outbox bounded read-only policy gate failed.'
          }
          Write-Host 'PASS BW4k7p POP3 Sent vs Outbox strict store scope, bounded years, partial disclosures, no writer'

      - name: Verify BW4k7q strict POP3 scope/exclusions, empty and nonempty Sent, preserve tests no Move
        run: |
          $ErrorActionPreference='Stop'
          $m=Get-Content -LiteralPath 'RELEASE.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          $pure=Get-Content -LiteralPath 'Core/Worker/BW4k7qPop3ScopeExclusionPolicy265.ps1' -Raw -Encoding UTF8
          $live=Get-Content -LiteralPath 'Core/Diagnostics/Invoke-OPA265BW4k7qPop3ScopeExclusionReview.ps1' -Raw -Encoding UTF8
          $tests=Get-Content -LiteralPath 'Tests/Worker/BW4k7qPop3ScopeExclusionPolicy.Tests.ps1' -Raw -Encoding UTF8
          $doc=Get-Content -LiteralPath 'docs/2.6.5-bw4k7q-pop3-scope-exclusions.md' -Raw -Encoding UTF8
          $bw4k7qGateFailures=New-Object 'System.Collections.Generic.List[string]'
          if([int]$m.Verification.ExpectedPesterTests -ne 3370){$bw4k7qGateFailures.Add('G01: expected Pester tests')}
          if([int]$m.Verification.ExpectedTestContainers -ne 114){$bw4k7qGateFailures.Add('G01b: expected 106 Pester containers')}
          if($pure -cnotmatch 'POP3-SCOPE-001-BW4k7q-v1'){$bw4k7qGateFailures.Add('G02: expected Pester containers')}
          if($pure -cnotmatch 'OPA264-LIVE3-'){$bw4k7qGateFailures.Add('G03: versioned policy ID')}
          if($pure -cnotmatch 'KnownSettingsRootNames'){$bw4k7qGateFailures.Add('G04: reserved LIVE3 marker')}
          if($pure -cnotmatch 'ExactKnownOutlookSettingsFolder'){$bw4k7qGateFailures.Add('G05: quick settings')}
