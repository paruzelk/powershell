          gh release create $tag $zip $sha --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title ('OutlookPOP3Archive 2.6.5-BW4k7v2a DEV '+$short) --notes 'BW4k7v2a DEV ISOLATED ONE-PILOT PREFLIGHT AND READ-ONLY PRISTINE TEST-PST INVENTORY ONLY. User actual BW4k7v first mail was MISROUTED into working Outlook default Drafts; old failed SuiteId 78a3e477-98fc-4134-b400-429b3e3b216b and all old PST/Claim/evidence quarantined. To prevent any cross-store write, Plan/Prepare/Inspect are harmless; CreatePilot requires a distinct profile OPA265-BW4k7v2, zero accounts, EXACT ONE mounted local PST and sole default store, a newly prepared exact GUID test path and explicit per-GUID consent. Before any pilot write, fails closed on preexisting items or incomplete bounded Outlook-visible folder inventory (128 folders, 32 depth). Uses OFT SaveAs type 2 and CreateItemFromTemplate with explicit InFolder for one item only, immediately validates actual Parent Folder and StoreID after Save; no second item. Seals one original CreateNew/Flush(true) manifest and VerifyPilot requires restarted Outlook process. New profile with no mail accounts may be unavailable in Outlook 2019; in that case STOP. No original working Outlook profile, real mail, old Draft cleanup, Move, Send, Delete, auto retry, actual MAPI dates or production. 3370 PS5.1 Pester/114 containers and inherited BW4j6 test matrix; no production Archive/Resume/Auto.' --prerelease
