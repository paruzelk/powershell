      - name: Verify all five MIG18 outputs and embedded executable resource
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python adPEAS-RU/Migration/v2.11.0/MIG18/Build-MIG18Integration.py --candidate '_mig/candidate' --verify-build --report '_mig/2.11.0-mig18-build.json'
          if ($LASTEXITCODE -ne 0) { throw 'MIG18 output verification failed' }
          foreach ($name in @('adPEAS.ps1','adPEAS_min.ps1','adPEAS_ultra.ps1','adPEAS_obf.ps1')) {
            $file = (Resolve-Path "_mig/candidate/$name").Path
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file,[ref]$tokens,[ref]$errors)
            if ($errors.Count -gt 0) { throw "Artifact parse failed: $name $($errors[0].Message)" }
          }
          $exe = (Resolve-Path '_mig/candidate/adPEAS.exe').Path
          $asm = [Reflection.Assembly]::ReflectionOnlyLoadFrom($exe)
          $names = @($asm.GetManifestResourceNames())
          if ($names.Count -ne 1 -or $names[0] -ne 'adPEAS.ps1') { throw 'Unexpected embedded resource' }
          $stream = $asm.GetManifestResourceStream($names[0])
          $sha = [Security.Cryptography.SHA256]::Create()
          try { $embedded = [BitConverter]::ToString($sha.ComputeHash($stream)).Replace('-','') }
          finally { $stream.Dispose(); $sha.Dispose() }
          $expected = (Get-FileHash '_mig/candidate/adPEAS.ps1' -Algorithm SHA256).Hash
          if ($embedded -cne $expected) { throw 'EXE payload mismatch' }
          $vi = (Get-Item $exe).VersionInfo
          $ru = -join (@(0x430,0x443,0x434,0x438,0x442,0x20,0x431,0x435,0x437,0x43e,0x43f,0x430,0x441,0x43d,0x43e,0x441,0x442,0x438) | ForEach-Object { [char]$_ })
          $expectedDescription = 'adPEAS 2.11.0 ' + [char]0x2014 + ' ' + $ru + ' Active Directory'
          Write-Host ('EXE FileDescription: ' + $vi.FileDescription)
          Write-Host ('EXE ProductName: ' + $vi.ProductName)
          if ($vi.FileDescription -notmatch '[\u0400-\u04FF]' -or $vi.FileDescription -cne $expectedDescription) { throw 'Wrong Russian EXE FileDescription' }
          if ($vi.ProductName -cne 'adPEAS') { throw 'EXE product name changed' }
          Write-Host 'PASS: exact Russian Win32 FileDescription and original product name'
          Write-Host 'PASS: all scripts parse; EXE resource matches readable PS1 byte for byte; no AD access'
